- id: alarm_door_trigger
  alias: 'Alarm: Door opened while armed'
  description: 'Fires alarm_trigger when any door sensor goes ON while the alarm is
    in armed_away or armed_home. The manual alarm platform handles the pending → triggered
    state transition with the configured delay_time.

    '
  mode: single
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.main_panel_front_door
    - binary_sensor.main_panel_garage_door
    - binary_sensor.main_panel_basement_door
    - binary_sensor.main_panel_sliding_door
    to: 'on'
  condition:
  - condition: state
    entity_id: alarm_control_panel.home_alarm
    state:
    - armed_away
    - armed_home
  action:
  - action: alarm_control_panel.alarm_trigger
    entity_id: alarm_control_panel.home_alarm
- id: alarm_motion_trigger
  alias: 'Alarm: Motion detected while armed away'
  mode: single
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.main_panel_office_motion
    - binary_sensor.main_panel_family_room_motion
    to: 'on'
  condition:
  - condition: state
    entity_id: alarm_control_panel.home_alarm
    state: armed_away
  action:
  - action: alarm_control_panel.alarm_trigger
    entity_id: alarm_control_panel.home_alarm
- id: alarm_exit_delay_beep
  alias: 'Alarm: Exit delay beeping'
  mode: restart
  trigger:
  - platform: state
    entity_id: alarm_control_panel.home_alarm
    to: arming
  action:
  - repeat:
      while:
      - condition: state
        entity_id: alarm_control_panel.home_alarm
        state: arming
      sequence:
      - action: esphome.konnected_56a4fa_play_rtttl
        data:
          song_str: exit:d=32,o=4,b=100:e,p
      - delay:
          milliseconds: 1500
- id: alarm_entry_delay_beep
  alias: 'Alarm: Entry delay beeping'
  mode: restart
  trigger:
  - platform: state
    entity_id: alarm_control_panel.home_alarm
    to: pending
  action:
  - repeat:
      while:
      - condition: state
        entity_id: alarm_control_panel.home_alarm
        state: pending
      sequence:
      - action: esphome.konnected_56a4fa_play_rtttl
        data:
          song_str: entry:d=32,o=4,b=100:e,p
      - delay:
          milliseconds: 700
- id: alarm_triggered_siren
  alias: 'Alarm: Triggered — activate siren'
  mode: single
  trigger:
  - platform: state
    entity_id: alarm_control_panel.home_alarm
    to: triggered
  action:
  - action: esphome.konnected_56a4fa_stop_rtttl
  - action: switch.turn_on
    entity_id: switch.alarm_panel_56ac70_siren
- id: alarm_disarmed
  alias: 'Alarm: Disarmed — all clear'
  mode: single
  trigger:
  - platform: state
    entity_id: alarm_control_panel.home_alarm
    to: disarmed
  action:
  - action: switch.turn_off
    entity_id: switch.alarm_panel_56ac70_siren
  - action: esphome.konnected_56a4fa_stop_rtttl
  - delay:
      milliseconds: 300
  - action: esphome.konnected_56a4fa_play_rtttl
    data:
      song_str: disarm:d=32,o=4,b=100:e,p,e,p,e
- id: alarm_armed_confirmation
  alias: 'Alarm: Armed — confirmation tone'
  mode: single
  trigger:
  - platform: state
    entity_id: alarm_control_panel.home_alarm
    to:
    - armed_away
    - armed_home
  action:
  - action: esphome.konnected_56a4fa_play_rtttl
    data:
      song_str: armed:d=32,o=4,b=100:e,p,e
- id: door_chime
  alias: Door chime when disarmed
  mode: single
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.main_panel_front_door
    - binary_sensor.main_panel_garage_door
    - binary_sensor.main_panel_basement_door
    - binary_sensor.main_panel_sliding_door
    to: 'on'
  condition:
  - condition: state
    entity_id: alarm_control_panel.home_alarm
    state: disarmed
  action:
  - action: esphome.konnected_56a4fa_play_rtttl
    data:
      song_str: chime:d=32,o=4,b=100:e,p,e
- id: meeting_status_on
  alias: 'Meeting: Status ON — hallway red'
  triggers:
  - entity_id: switch.meeting_button_in_meeting
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - action: light.turn_on
    data:
      rgb_color:
      - 255
      - 0
      - 0
      brightness: 150
      transition: 1
    target:
      device_id: caa9c445375f8b67c1a29b11c8ae61c3
  mode: single
- id: meeting_status_off
  alias: 'Meeting: Status OFF — hallway green'
  triggers:
  - entity_id: switch.meeting_button_in_meeting
    to: 'off'
    trigger: state
  conditions: []
  actions:
  - action: light.turn_off
    data:
      transition: 1
    target:
      device_id: caa9c445375f8b67c1a29b11c8ae61c3
  mode: single
- id: meeting_button_offline
  alias: 'Meeting: Button offline — hallway off'
  triggers:
  - entity_id: switch.meeting_button_in_meeting
    to: unavailable
    for:
      seconds: 10
    trigger: state
  conditions: []
  actions:
  - action: light.turn_off
    target:
      device_id: caa9c445375f8b67c1a29b11c8ae61c3
    data:
      transition: 2
  mode: single
- id: meeting_button_reconnect
  alias: 'Meeting: Button reconnected — re-sync hallway'
  triggers:
  - entity_id: switch.meeting_button_in_meeting
    from: unavailable
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: switch.meeting_button_in_meeting
        state: 'on'
      sequence:
      - action: light.turn_on
        data:
          rgb_color:
          - 255
          - 0
          - 0
          brightness: 150
          transition: 1
        target:
          device_id: caa9c445375f8b67c1a29b11c8ae61c3
    - conditions:
      - condition: state
        entity_id: switch.meeting_button_in_meeting
        state: 'off'
      sequence:
      - action: light.turn_off
        data:
          transition: 1
        target:
          device_id: caa9c445375f8b67c1a29b11c8ae61c3
  mode: single
- id: gitops_sync_poll
  alias: 'GitOps: Poll and deploy'
  description: Fetch repo every 5 min; validate and restart HA on change
  trigger:
  - platform: time_pattern
    minutes: /5
  action:
  - service: shell_command.gitops_sync
  mode: single
  max_exceeded: silent
