# Konnected Alarm Panel — Secondary (Add-on) Board
# Board: ESP8266 (NodeMCU v2 compatible)
# MAC: 2C:F4:32:56:A4:FA
# IP: 192.168.139.175
#
# Zone wiring:
#   Zone 1 (GPIO5)  → Piezo buzzer (output)
#   Zones 2-6       → Not connected (floating — not configured)
#
# This board serves as an interior annunciator. The piezo provides:
#   - Entry delay countdown beeps
#   - Exit delay countdown beeps
#   - Arm/disarm confirmation tones
#   - Door chime when disarmed
# All tone patterns are triggered from HA automations via the
# esphome.<name>_play_rtttl service.

substitutions:
  name: konnected-56a4fa
  friendly_name: Secondary Panel

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

esp8266:
  board: nodemcuv2

# --- Network ---

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret wifi_password

captive_portal:

# --- API and OTA ---

api:
  encryption:
    key: !secret api_key_secondary_panel

ota:
  - platform: esphome

# --- Logging ---

logger:
  level: DEBUG
  logs:
    api: INFO
    json: INFO
    sensor: INFO

# --- Web server for local diagnostics ---
web_server:
  port: 80

# --- Status LED ---
status_led:
  pin: GPIO2

# --- Piezo buzzer ---
# Zone 1 (GPIO5) is repurposed as a PWM output driving a piezo.
# The rtttl component lets us play Ring Tone Text Transfer Language
# strings — basically Nokia ringtone notation. This gives us full
# control over pitch, duration, and tempo from HA automations.
#
# Example HA service call:
#   service: esphome.konnected_56a4fa_play_rtttl
#   data:
#     song_str: "beep:d=4,o=5,b=100:c"

output:
  - platform: esp8266_pwm
    pin: GPIO5
    id: buzzer_output

rtttl:
  output: buzzer_output
  id: buzzer

# --- Diagnostic sensors ---

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s

  - platform: uptime
    name: Uptime
    update_interval: 60s

binary_sensor:
  - platform: status
    name: Status

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address

button:
  - platform: restart
    name: Restart
