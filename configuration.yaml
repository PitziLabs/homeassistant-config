# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

frontend:
  themes: !include_dir_merge_named themes

# Text to speech
tts:
  - platform: google_translate

# Includes
group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Cloud config
cloud:

# Alarm panel — manual platform, all logic driven by automations
# States: disarmed → arming (exit delay) → armed_away/armed_home
#         armed → pending (entry delay) → triggered → (auto-disarm after trigger_time)
alarm_control_panel:
  - platform: manual
    name: Home Alarm
    code_arm_required: false
    # code: !secret alarm_code
    # Exit delay — time to leave after arming
    arming_time: 30
    # Entry delay — time to disarm after a sensor trips
    delay_time: 30
    # How long the siren sounds before auto-resetting (4 minutes)
    trigger_time: 240
    disarmed:
      trigger_time: 0
    armed_home:
      arming_time: 10
      delay_time: 15

# Dashboards — YAML-managed, git-tracked
lovelace:
  dashboards:
    dashboard-home:
      mode: yaml
      filename: dashboards/home.yaml
      title: Home
      icon: mdi:home
      show_in_sidebar: true

# Prometheus
prometheus:
