# Core config for Home Assistant.
homeassistant:
  auth_providers:
    - type: homeassistant
    - type: trusted_networks
      trusted_networks:
        - !secret trusted_network
      allow_bypass_login: true
  packages: !include_dir_named packages

# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/kiosk-mode/kiosk-mode.js
    - /hacsfiles/card-mod/card-mod.js

# Text to speech
tts:
  - platform: google_translate

# Includes
group: !include groups.yaml
automation ui: !include automations.yaml
automation manual: !include_dir_merge_list automations/
script: !include scripts.yaml
scene: !include scenes.yaml
shell_command: !include shell_commands.yaml

# Cloud config
cloud:

# Alarm panel — manual platform, all logic driven by automations
# States: disarmed → arming (exit delay) → armed_away/armed_home
#         armed → pending (entry delay) → triggered → (auto-disarm after trigger_time)
alarm_control_panel:
  - platform: manual
    name: Home Alarm
    code: !secret alarm_code
    code_arm_required: false
    arming_time: 30
    delay_time: 30
    trigger_time: 240
    disarmed:
      trigger_time: 0
    armed_home:
      arming_time: 10
      delay_time: 15

# Dashboards — YAML-managed, git-tracked
lovelace:
  dashboards:
    dashboard-home:
      mode: yaml
      filename: dashboards/home.yaml
      title: Home
      icon: mdi:home
      show_in_sidebar: true
    dashboard-homelab-status:
      mode: yaml
      filename: dashboards/homelab-status.yaml
      title: Homelab Status
      icon: mdi:server-network
      show_in_sidebar: true
    dashboard-kiosk:
      mode: yaml
      title: Kiosk
      icon: mdi:monitor-dashboard
      show_in_sidebar: false
      filename: dashboards/kiosk.yaml
    dashboard-command-deck:
      mode: yaml
      filename: dashboards/command-deck.yaml
      title: Command Deck
      icon: mdi:gamepad-variant
      show_in_sidebar: true
    dashboard-screen-time:
      mode: yaml
      filename: dashboards/screen-time.yaml
      title: Screen Time
      icon: mdi:television-clock
      show_in_sidebar: true

# Prometheus
prometheus:

# Light groups — referenced by Sonoff button automations and dashboards.
# `switch.back_porch` is outdoor lighting too but lives in a separate action
# in `automations/sonoff_button_outdoor.yaml` because light groups can't hold
# switches.
light:
  - platform: group
    name: Outdoor
    unique_id: outdoor
    entities:
      - light.front_door
      - light.front_lantern
      - light.garage_front
      - light.garage_side
      - light.shed

  - platform: group
    name: Downstairs
    unique_id: downstairs
    entities:
      - light.kitchen_main
      - light.kitchen_island
      - light.kitchen_table
      - light.family_room_2
      - light.floor_lamp_composite

# Template sensors for Sonos group-aware dashboard
template:
  - binary_sensor:
      # --- Playing + group coordinator sensors ---

      - name: "Sonos Office Leader"
        unique_id: sonos_office_leader
        state: >
          {{ is_state('media_player.office', 'playing')
             and state_attr('media_player.office', 'group_members') is not none
             and state_attr('media_player.office', 'group_members')[0] == 'media_player.office' }}

      - name: "Sonos Kitchen Leader"
        unique_id: sonos_kitchen_leader
        state: >
          {{ is_state('media_player.kitchen', 'playing')
             and state_attr('media_player.kitchen', 'group_members') is not none
             and state_attr('media_player.kitchen', 'group_members')[0] == 'media_player.kitchen' }}

      - name: "Sonos Dining Room Leader"
        unique_id: sonos_dining_room_leader
        state: >
          {{ is_state('media_player.dining_room', 'playing')
             and state_attr('media_player.dining_room', 'group_members') is not none
             and state_attr('media_player.dining_room', 'group_members')[0] == 'media_player.dining_room' }}

      - name: "Sonos Master Bedroom Leader"
        unique_id: sonos_master_bedroom_leader
        state: >
          {{ is_state('media_player.master_bedroom', 'playing')
             and state_attr('media_player.master_bedroom', 'group_members') is not none
             and state_attr('media_player.master_bedroom', 'group_members')[0] == 'media_player.master_bedroom' }}

      - name: "Sonos Roam Leader"
        unique_id: sonos_roam_leader
        state: >
          {{ is_state('media_player.roam_2', 'playing')
             and state_attr('media_player.roam_2', 'group_members') is not none
             and state_attr('media_player.roam_2', 'group_members')[0] == 'media_player.roam_2' }}

      # --- Per-room light activity ---
      - name: "Kitchen Lights On"
        unique_id: kitchen_lights_on
        state: >
          {{ is_state('light.kitchen_main', 'on')
             or is_state('light.kitchen_island', 'on')
             or is_state('light.kitchen_table', 'on') }}

      - name: "Office Lights On"
        unique_id: office_lights_on
        state: >
          {{ is_state('light.bookcase_lamp', 'on')
             or is_state('light.corner_lamp', 'on')
             or is_state('light.door_lamp', 'on')
             or is_state('light.desk_lamp_2', 'on')
             or is_state('light.desk_lamp_2_2', 'on') }}

      - name: "Play Room Lights On"
        unique_id: play_room_lights_on
        state: >
          {{ is_state('light.playroom_1', 'on')
             or is_state('light.playroom_2', 'on')
             or is_state('light.playroom_3', 'on')
             or is_state('light.playroom_4', 'on') }}

      - name: "Family Room Lights On"
        unique_id: family_room_lights_on
        state: >
          {{ is_state('light.family_room_2', 'on')
             or is_state('light.floor_lamp_composite', 'on') }}

      - name: "Entry Lights On"
        unique_id: entry_lights_on
        state: >
          {{ is_state('light.downstairs_hallway', 'on')
             or is_state('light.upstairs_hallway_light', 'on')
             or is_state('light.meeting_light', 'on') }}

      - name: "Outdoor Lights On"
        unique_id: outdoor_lights_on
        state: >
          {{ is_state('light.outdoor', 'on')
             or is_state('switch.back_porch', 'on') }}

      - name: "Any Switch On"
        unique_id: any_switch_on
        state: >
          {{ is_state('switch.play_room_outlet', 'on') }}

      # --- Aggregate openings (doors + garage covers) ---
      # Used by the kiosk alarm hero to escalate visual state when the
      # alarm is disarmed but a perimeter opening is detected.
      - name: "House Openings"
        unique_id: house_openings
        state: >
          {{ is_state('binary_sensor.main_panel_front_door', 'on')
             or is_state('binary_sensor.main_panel_sliding_door', 'on')
             or is_state('binary_sensor.main_panel_garage_door', 'on')
             or is_state('binary_sensor.basement_kitchen_door', 'on')
             or is_state('cover.garage_door_1_door', 'open')
             or is_state('cover.garage_door_2_door', 'open') }}
        attributes:
          open_list: >
            {% set names = namespace(open=[]) %}
            {% if is_state('binary_sensor.main_panel_front_door', 'on') %}
              {% set names.open = names.open + ['Front'] %}
            {% endif %}
            {% if is_state('binary_sensor.main_panel_sliding_door', 'on') %}
              {% set names.open = names.open + ['Sliding'] %}
            {% endif %}
            {% if is_state('binary_sensor.main_panel_garage_door', 'on') %}
              {% set names.open = names.open + ['Garage Entry'] %}
            {% endif %}
            {% if is_state('binary_sensor.basement_kitchen_door', 'on') %}
              {% set names.open = names.open + ['Basement'] %}
            {% endif %}
            {% if is_state('cover.garage_door_1_door', 'open') %}
              {% set names.open = names.open + ['Garage 1'] %}
            {% endif %}
            {% if is_state('cover.garage_door_2_door', 'open') %}
              {% set names.open = names.open + ['Garage 2'] %}
            {% endif %}
            {{ names.open | join(', ') }}

  - light:
      - name: "Floor Lamp Composite"
        unique_id: floor_lamp_composite
        turn_on:
          - service: switch.turn_on
            target:
              entity_id: switch.family_room_outlets
        turn_off:
          - service: switch.turn_off
            target:
              entity_id: switch.family_room_outlets
        state: "{{ is_state('switch.family_room_outlets', 'on') }}"

  - sensor:
      - name: "Lights On Office Count"
        unique_id: lights_on_office_count
        state: >
          {{ ['light.bookcase_lamp','light.corner_lamp',
              'light.door_lamp','light.meeting_light',
              'light.desk_lamp_2','light.desk_lamp_2_2']
             | select('is_state','on') | list | count }}
        icon: mdi:lightbulb-group

      - name: "Lights On Family Room Count"
        unique_id: lights_on_family_room_count
        state: >
          {{ ['light.family_room_2','light.floor_lamp_composite']
             | select('is_state','on') | list | count }}
        icon: mdi:lightbulb-group

      - name: "Lights On Kitchen Count"
        unique_id: lights_on_kitchen_count
        state: >
          {{ ['light.kitchen_island','light.kitchen_main','light.kitchen_table']
             | select('is_state','on') | list | count }}
        icon: mdi:lightbulb-group

      - name: "Lights On Outdoor Count"
        unique_id: lights_on_outdoor_count
        state: >
          {{ ['light.front_lantern','light.front_door','light.garage_front',
              'light.garage_side','light.shed','switch.back_porch']
             | select('is_state','on') | list | count }}
        icon: mdi:lightbulb-group-outline

      - name: "Lights On Hallway Count"
        unique_id: lights_on_hallway_count
        state: >
          {{ ['light.downstairs_hallway','light.upstairs_hallway_light']
             | select('is_state','on') | list | count }}
        icon: mdi:lightbulb-group

  - trigger:
      - platform: time_pattern
        minutes: "/30"
      - platform: homeassistant
        event: start
    action:
      - service: weather.get_forecasts
        data:
          type: daily
        target:
          entity_id: weather.forecast_home
        response_variable: forecast_data
    sensor:
      - name: "Weather Forecast Daily"
        unique_id: weather_forecast_daily
        state: "{{ forecast_data['weather.forecast_home'].forecast | length }}"
        attributes:
          forecast: "{{ forecast_data['weather.forecast_home'].forecast }}"

# Screen-time tracking — per (TV × app) daily totals via history_stats.
# Reads from sensor.<tv>_active_app (Roku integration). Used by the
# Screen Time dashboard (dashboards/screen-time.yaml). The Roku ECP
# integration flaps briefly (~10-40s of `unavailable`) during long
# sessions; history_stats time-in-state counts only the resolved
# segments, which undercounts by <5% — acceptable without smoothing.
sensor:
  # ---- Play Room TV ----
  - platform: history_stats
    name: Play Room Netflix Today
    entity_id: sensor.play_room_tv_active_app
    state: "Netflix"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Play Room YouTube Today
    entity_id: sensor.play_room_tv_active_app
    state: "YouTube"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Play Room Prime Video Today
    entity_id: sensor.play_room_tv_active_app
    state: "Prime Video"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Play Room Apple TV Today
    entity_id: sensor.play_room_tv_active_app
    state: "Apple TV"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Play Room Disney Plus Today
    entity_id: sensor.play_room_tv_active_app
    state: "Disney Plus"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  # ---- Basement TV ----
  - platform: history_stats
    name: Basement Netflix Today
    entity_id: sensor.basement_tv_active_app
    state: "Netflix"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Basement YouTube Today
    entity_id: sensor.basement_tv_active_app
    state: "YouTube"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Basement Prime Video Today
    entity_id: sensor.basement_tv_active_app
    state: "Prime Video"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  # ---- Office TV ----
  - platform: history_stats
    name: Office Netflix Today
    entity_id: sensor.office_tv_active_app
    state: "Netflix"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Office YouTube Today
    entity_id: sensor.office_tv_active_app
    state: "YouTube"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Office Prime Video Today
    entity_id: sensor.office_tv_active_app
    state: "Prime Video"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
