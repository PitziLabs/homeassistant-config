# device_ieee f0:44:d3:ff:fe:f6:94:01 = Sonoff Button 1 (downstairs)
# device_id: get from Settings → Devices & Services → ZHA → Sonoff Button 1
#            (the UUID in the device URL, or copy from Automation editor Device trigger UI)
- id: sonoff_button_1_kitchen_family_on
  alias: 'Sonoff Button 1: Single press → Downstairs ON'
  triggers:
  - trigger: device
    domain: zha
    device_id: REPLACE_WITH_DEVICE_ID_FOR_SONOFF_BUTTON_1
    type: remote_button_short_press
    subtype: turn_on
  conditions: []
  actions:
  - action: light.turn_on
    data:
      brightness: 255
    target:
      entity_id: group.downstairs_lights
  - action: switch.turn_on
    target:
      entity_id: switch.family_room_outlets
  mode: single
- id: sonoff_button_1_kitchen_family_off
  alias: 'Sonoff Button 1: Double press → Downstairs OFF'
  triggers:
  - trigger: device
    domain: zha
    device_id: REPLACE_WITH_DEVICE_ID_FOR_SONOFF_BUTTON_1
    type: remote_button_double_press
    subtype: turn_on
  conditions: []
  actions:
  - action: homeassistant.turn_off
    target:
      entity_id: group.downstairs_lights
  - action: switch.turn_off
    target:
      entity_id: switch.family_room_outlets
  mode: single
