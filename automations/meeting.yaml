- id: meeting_status_on
  alias: 'Meeting: Status ON — hallway red'
  triggers:
  - entity_id: switch.meeting_button_in_meeting
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - action: light.turn_on
    data:
      rgb_color:
      - 255
      - 0
      - 0
      brightness: 255
      transition: 1
    target:
      device_id: caa9c445375f8b67c1a29b11c8ae61c3
  mode: single
- id: meeting_status_off
  alias: 'Meeting: Status OFF — hallway green'
  triggers:
  - entity_id: switch.meeting_button_in_meeting
    to: 'off'
    trigger: state
  conditions: []
  actions:
  - action: light.turn_off
    data:
      transition: 1
    target:
      device_id: caa9c445375f8b67c1a29b11c8ae61c3
  mode: single
- id: meeting_button_offline
  alias: 'Meeting: Button offline — hallway off'
  triggers:
  - entity_id: switch.meeting_button_in_meeting
    to: unavailable
    for:
      seconds: 10
    trigger: state
  conditions: []
  actions:
  - action: light.turn_off
    target:
      device_id: caa9c445375f8b67c1a29b11c8ae61c3
    data:
      transition: 2
  mode: single
- id: meeting_button_reconnect
  alias: 'Meeting: Button reconnected — re-sync hallway'
  triggers:
  - entity_id: switch.meeting_button_in_meeting
    from: unavailable
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: switch.meeting_button_in_meeting
        state: 'on'
      sequence:
      - action: light.turn_on
        data:
          rgb_color:
          - 255
          - 0
          - 0
          brightness: 255
          transition: 1
        target:
          device_id: caa9c445375f8b67c1a29b11c8ae61c3
    - conditions:
      - condition: state
        entity_id: switch.meeting_button_in_meeting
        state: 'off'
      sequence:
      - action: light.turn_off
        data:
          transition: 1
        target:
          device_id: caa9c445375f8b67c1a29b11c8ae61c3
  mode: single
