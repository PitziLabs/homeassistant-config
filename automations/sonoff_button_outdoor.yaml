# device_ieee 18:69:0a:ff:fe:13:a1:01 = Sonoff Button 2 (outdoor)
# device_id: get from Settings → Devices & Services → ZHA → Sonoff Button 2
#            (the UUID in the device URL, or copy from Automation editor Device trigger UI)
- id: sonoff_button_2_outdoor_on
  alias: 'Sonoff Button 2: Single press → Outdoor lights ON'
  triggers:
  - trigger: device
    domain: zha
    device_id: REPLACE_WITH_DEVICE_ID_FOR_SONOFF_BUTTON_2
    type: remote_button_short_press
    subtype: turn_on
  conditions: []
  actions:
  - action: homeassistant.turn_on
    target:
      entity_id: group.outdoor_lights
  mode: single
- id: sonoff_button_2_outdoor_off
  alias: 'Sonoff Button 2: Double press → Outdoor lights OFF'
  triggers:
  - trigger: device
    domain: zha
    device_id: REPLACE_WITH_DEVICE_ID_FOR_SONOFF_BUTTON_2
    type: remote_button_double_press
    subtype: turn_on
  conditions: []
  actions:
  - action: homeassistant.turn_off
    target:
      entity_id: group.outdoor_lights
  mode: single
