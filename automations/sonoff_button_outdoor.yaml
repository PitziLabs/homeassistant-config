# device_ieee 18:69:0a:ff:fe:13:a1:01 = Sonoff Button 2 (outdoor)
- id: sonoff_button_2_outdoor_on
  alias: 'Sonoff Button 2: Single press → Outdoor lights ON'
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: 18:69:0a:ff:fe:13:a1:01
      command: toggle
  conditions: []
  actions:
  - action: homeassistant.turn_on
    target:
      entity_id: group.outdoor_lights
  mode: single
- id: sonoff_button_2_outdoor_off
  alias: 'Sonoff Button 2: Double press → Outdoor lights OFF'
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: 18:69:0a:ff:fe:13:a1:01
      command: "on"
  conditions: []
  actions:
  - action: homeassistant.turn_off
    target:
      entity_id: group.outdoor_lights
  mode: single
