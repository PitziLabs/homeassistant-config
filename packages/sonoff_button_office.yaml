# Sonoff Button 2 (SNZB-01) → Office lights
#
# Device IEEE: 18:69:0a:ff:fe:13:a1:01
#
# SNZB-01 ZHA events (cluster 6):
#   command: toggle  → single press
#   command: 'on'    → double press
#   command: 'off'   → long press (hold)
#
# Bindings:
#   single press → if lights are off, reset counter to 1 and apply scene 1;
#                  otherwise advance the counter (wraps 9 → 1) and apply.
#                  i.e. first click turns on, subsequent clicks cycle scenes.
#   double press → all office lights off (counter persists)
#   long press   → jump straight to scene 1 (Bright), reset counter to 1.
#                  Useful for bailing out of a colored/flicker scene without
#                  click-cycling through the rest of the catalog.
#
# The counter (counter.office_sonoff_scene) is also shared with the Zooz ZEN77
# in-wall switch (packages/office_zen77.yaml) so both controllers cycle from the
# same scene index. Single source of truth.
#
# Static scenes (1-3) apply uniform values to all six lamps simultaneously.
# Flicker scenes (4-9) all share one parallel driver loop in
# `script.office_sonoff_candle_loop`. The loop dispatches per-lamp ticks
# every 180-400 ms to `script.office_lamp_tick`, which renders the current
# scene's frame for that lamp. Brightness always flickers in a tight 75-92%
# band with a 0.2 s transition; what differs per scene is how the color is
# computed:
#
#   - Candle scenes (4-6): fixed hue per scene, looked up from a palette dict.
#   - Blue + Red Desk (7): per-lamp color — the two desk lamps flicker red,
#     every other lamp flickers blue. Same brightness band as the candles.
#   - Rainbow Sync (8): hue derived from wall-clock time, same on all lamps.
#   - Rainbow Cascade (9): hue derived from wall-clock time + a per-lamp
#     60° cascade offset, so the rainbow ripples across the room.
#
# Each per-lamp branch also waits a random 0-300 ms startup phase so the
# lamps don't all brighten or dim on the same beat.
#
# Scene catalog:
#   1  Bright            — all 6, 100% / 2700K  (warm general illumination)
#   2  Relax             — all 6, 40%  / 2200K  (warm, low)
#   3  Focus             — all 6, 100% / 5000K  (bright, cool)
#   4  Amber Candle      — flicker rgb(255, 100, 15)
#   5  Red Candle        — flicker rgb(255,  20,  5)
#   6  Blue Candle       — flicker rgb(30,   80, 255)
#   7  Blue + Red Desk   — flicker; desk lamps rgb(255, 20, 5), rest rgb(30, 80, 255)
#   8  Rainbow Sync      — flicker; hue cycles every 30 s, all lamps in unison
#   9  Rainbow Cascade   — flicker; hue cycles every 30 s, each lamp offset 60°
#
# The static Red and Blue scenes from earlier iterations were retired — the
# candle/rainbow variants cover colored lighting and clicking past two extra
# steady-color scenes to reach the more useful effects was friction. The
# Yellow, Green, and Purple candles were purged 2026-06-14 (never rested on
# in 10 days of dwell-time history — pure click-past friction); the Blue +
# Red Desk scene was added the same day, slotted next to the Blue candle.
#
# The flicker driver (mode: restart) exits when counter.office_sonoff_scene
# drops to 3 or below. Every static scene calls script.turn_off on it before
# applying. Transitioning into any flicker scene calls script.turn_on so the
# apply script fires-and-forgets — it never waits on the infinite loop.
#
# The driver is also self-extending: HA's `repeat: while:` is capped at 10000
# iterations per block; at our 180-400 ms tick delays each branch hits that
# cap after ~30-66 min and exits. Before this was fixed the lamps then froze
# on the last rendered frame until a paddle tap (or HA restart) re-fired the
# loop. Now, when the slowest parallel branch exits, the driver re-invokes
# itself iff counter > 3 — mode:restart cancels the dying instance cleanly,
# so a flicker scene keeps ticking indefinitely without user intervention.
#
# Live brightness: input_number.office_brightness (10-100, step 5) is the
# brightness applied by every scene. Static scenes read it directly;
# flicker tick scales its 75-92% random band by `helper / 100`. apply_scene
# resets the helper to the new scene's default brightness on every tap/cycle
# (1=100, 2=40, 3=100, 4-9=100) — pass `reset_brightness: false` to render
# without touching the helper (used by ZEN77 hold-to-dim/brighten). Step 5
# keeps the ZEN77 hold-ramp visibly smooth; static scene branches add a
# 0.3 s transition so each ramp step interpolates on the bulbs.

counter:
  office_sonoff_scene:
    name: Office Sonoff Scene
    minimum: 1
    maximum: 9
    initial: 1
    step: 1
    restore: true

input_number:
  office_brightness:
    name: Office Brightness
    min: 10
    max: 100
    step: 5
    unit_of_measurement: '%'
    icon: mdi:brightness-6

script:
  office_sonoff_apply_scene:
    alias: 'Office Sonoff: Apply current scene'
    mode: restart
    fields:
      reset_brightness:
        description: >-
          When true (default), resets input_number.office_brightness to the
          new scene's default before rendering. Pass false from hold-to-dim
          handlers so the helper drives the render instead.
        default: true
    variables:
      # Office lamps to drive. While a meeting is active (light.meeting_light
      # on) light.corner_lamp is owned by the meeting indicator and is dropped
      # from the set — see packages/meeting_indicator.yaml.
      office_lamps: >-
        {% set lamps = ['light.bookcase_lamp', 'light.door_lamp',
          'light.desk_lamp_2', 'light.desk_lamp_2_2', 'light.table_lamp'] %}
        {{ lamps if is_state('light.meeting_light', 'on')
           else lamps + ['light.corner_lamp'] }}
    sequence:
      # Coerce reset_brightness to its passed value or true. The fields.default
      # above only seeds the dev-tools service form; at runtime, callers that
      # invoke this script without `data: { reset_brightness: ... }` leave the
      # variable undefined, and `{{ reset_brightness }}` renders as "" (falsy).
      # That made the reset path below silently skip on every tap-to-cycle.
      - variables:
          reset_brightness: "{{ reset_brightness | default(true) }}"
      # Scene-change path: reset helper to scene default and kill any running
      # candle loop so the choose: block below starts fresh. On hold-to-dim
      # (reset_brightness:false) we skip both — the helper is already at the
      # caller's stepped value, and a running flicker loop must keep ticking
      # so the next ~400 ms tick picks up the new helper value without a
      # visible kill/restart glitch.
      - if:
          - condition: template
            value_template: "{{ reset_brightness }}"
        then:
          - action: input_number.set_value
            target:
              entity_id: input_number.office_brightness
            data:
              value: "{{ 40 if states('counter.office_sonoff_scene') == '2' else 100 }}"
          - action: script.turn_off
            target:
              entity_id: script.office_sonoff_candle_loop
      - choose:
          - conditions: "{{ states('counter.office_sonoff_scene') == '1' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: '{{ office_lamps }}'
                data:
                  brightness_pct: "{{ states('input_number.office_brightness') | int(100) }}"
                  color_temp_kelvin: 2700
                  transition: 0.3
          - conditions: "{{ states('counter.office_sonoff_scene') == '2' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: '{{ office_lamps }}'
                data:
                  brightness_pct: "{{ states('input_number.office_brightness') | int(40) }}"
                  color_temp_kelvin: 2200
                  transition: 0.3
          - conditions: "{{ states('counter.office_sonoff_scene') == '3' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: '{{ office_lamps }}'
                data:
                  brightness_pct: "{{ states('input_number.office_brightness') | int(100) }}"
                  color_temp_kelvin: 5000
                  transition: 0.3
          # Scenes 4-9 are all flicker variants; the loop reads its target
          # color from a palette dict keyed on the counter, so we just turn
          # it on for any scene >= 4 and cycling between hues changes
          # color seamlessly on the next tick. Gated so hold-to-dim on a
          # running flicker scene is a no-op (the loop is already ticking,
          # the helper update reaches it on next iteration) — but if the
          # loop is OFF (e.g. revived from a dead-loop state or a fresh
          # HA boot mid-candle-scene) the hold path also restarts it so
          # the lamps don't stay frozen on the last rendered frame.
          - conditions:
              - "{{ states('counter.office_sonoff_scene') | int(0) >= 4 }}"
              - "{{ reset_brightness or is_state('script.office_sonoff_candle_loop', 'off') }}"
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.office_sonoff_candle_loop

  # Per-lamp tick: renders one frame of whatever flicker scene is active to one
  # lamp. Pulled out as a sub-script so the candle loop's six parallel branches
  # stay short and so adding a new flicker scene needs only a new branch in the
  # choose: block below, not a new template in each branch.
  office_lamp_tick:
    alias: 'Office Sonoff: render one tick for one lamp'
    mode: parallel
    max: 12
    fields:
      target_entity:
        description: 'Light entity to update (e.g. light.bookcase_lamp)'
      cascade_offset:
        description: 'Hue offset (degrees) for Rainbow Cascade — ignored by other scenes'
        default: 0
    variables:
      scene: "{{ states('counter.office_sonoff_scene') | int(0) }}"
      # 75-92% random flicker band scaled by input_number.office_brightness.
      # At helper=100 (default) the band is unchanged; at helper=50 it's 37-46%.
      brightness: "{{ ((range(75, 93) | random) * (states('input_number.office_brightness') | int(100)) / 100) | int }}"
    sequence:
      - choose:
          # Scene 8 — Rainbow Sync: all lamps share the same hue, driven by
          # wall-clock time. 12 deg/sec → full cycle every 30 s.
          - conditions: "{{ scene == 8 }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: "{{ target_entity }}"
                data:
                  hs_color:
                    - "{{ (now().timestamp() * 12) % 360 }}"
                    - 100
                  brightness_pct: "{{ brightness }}"
                  transition: 0.2
          # Scene 9 — Rainbow Cascade: each lamp offset by `cascade_offset` so
          # the rainbow ripples across the room rather than moving in unison.
          - conditions: "{{ scene == 9 }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: "{{ target_entity }}"
                data:
                  hs_color:
                    - "{{ ((now().timestamp() * 12) + cascade_offset) % 360 }}"
                    - 100
                  brightness_pct: "{{ brightness }}"
                  transition: 0.2
          # Scene 7 — Blue + Red Desk: a per-lamp variant of the Blue candle.
          # The two desk lamps flicker the Red-candle hue rgb(255, 20, 5);
          # every other lamp flickers the Blue-candle hue rgb(30, 80, 255).
          # Same 75-92% brightness band as the candles, so it reads as one
          # cohesive flicker scene that happens to have a red desk.
          - conditions: "{{ scene == 7 }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: "{{ target_entity }}"
                data:
                  rgb_color: >-
                    {{ [255, 20, 5]
                       if target_entity in ['light.desk_lamp_2', 'light.desk_lamp_2_2']
                       else [30, 80, 255] }}
                  brightness_pct: "{{ brightness }}"
                  transition: 0.2
        default:
          # Scenes 4-6 — fixed-hue candles, color from palette dict.
          - action: light.turn_on
            target:
              entity_id: "{{ target_entity }}"
            data:
              rgb_color: >-
                {% set palette = {
                  '4': [255, 100, 15],
                  '5': [255, 20,  5],
                  '6': [30,   80, 255]
                } %}
                {{ palette[states('counter.office_sonoff_scene')] | default([255, 100, 15]) }}
              brightness_pct: "{{ brightness }}"
              transition: 0.2

  # Six parallel per-lamp loops. Each branch is just startup-phase delay,
  # then a tight while-loop of (call tick, sleep random delay). All scene
  # rendering logic lives in office_lamp_tick.
  office_sonoff_candle_loop:
    alias: 'Office Sonoff: Flicker loop driver'
    mode: restart
    sequence:
      - parallel:
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: numeric_state
                      entity_id: counter.office_sonoff_scene
                      above: 3
                  sequence:
                    - action: script.office_lamp_tick
                      data:
                        target_entity: light.bookcase_lamp
                        cascade_offset: 0
                    - delay:
                        milliseconds: "{{ range(180, 400) | random }}"
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: numeric_state
                      entity_id: counter.office_sonoff_scene
                      above: 3
                    # Stop ticking corner_lamp while a meeting owns it.
                    - condition: not
                      conditions:
                        - condition: state
                          entity_id: light.meeting_light
                          state: 'on'
                  sequence:
                    - action: script.office_lamp_tick
                      data:
                        target_entity: light.corner_lamp
                        cascade_offset: 60
                    - delay:
                        milliseconds: "{{ range(180, 400) | random }}"
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: numeric_state
                      entity_id: counter.office_sonoff_scene
                      above: 3
                  sequence:
                    - action: script.office_lamp_tick
                      data:
                        target_entity: light.door_lamp
                        cascade_offset: 120
                    - delay:
                        milliseconds: "{{ range(180, 400) | random }}"
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: numeric_state
                      entity_id: counter.office_sonoff_scene
                      above: 3
                  sequence:
                    - action: script.office_lamp_tick
                      data:
                        target_entity: light.desk_lamp_2
                        cascade_offset: 180
                    - delay:
                        milliseconds: "{{ range(180, 400) | random }}"
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: numeric_state
                      entity_id: counter.office_sonoff_scene
                      above: 3
                  sequence:
                    - action: script.office_lamp_tick
                      data:
                        target_entity: light.desk_lamp_2_2
                        cascade_offset: 240
                    - delay:
                        milliseconds: "{{ range(180, 400) | random }}"
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: numeric_state
                      entity_id: counter.office_sonoff_scene
                      above: 3
                  sequence:
                    - action: script.office_lamp_tick
                      data:
                        target_entity: light.table_lamp
                        cascade_offset: 300
                    - delay:
                        milliseconds: "{{ range(180, 400) | random }}"
      # Self-extend past HA's 10000-iteration cap on `repeat:`. With our
      # 180-400 ms per-tick delays each branch's while-loop hits the cap
      # in ~30-66 min and exits silently; before this self-restart the
      # lamps then froze on the last rendered frame until something else
      # turned the loop back on (a tap-to-cycle or watchdog). Now, once
      # all six parallel branches finish, we re-invoke this script if a
      # flicker scene is still active. mode:restart cleanly cancels the
      # outgoing run, so the visible gap is sub-second. Gated on counter
      # so deliberate off / jump-to-static (1-3) terminates cleanly.
      - if:
          - condition: numeric_state
            entity_id: counter.office_sonoff_scene
            above: 3
        then:
          - action: script.turn_on
            target:
              entity_id: script.office_sonoff_candle_loop

automation:
  - id: sonoff_button_2_office_cycle
    alias: 'Sonoff Button 2: Single press → office on / cycle scenes'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: 18:69:0a:ff:fe:13:a1:01
          command: toggle
    conditions: []
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.office_lights_on
                state: 'off'
            sequence:
              - action: counter.set_value
                target:
                  entity_id: counter.office_sonoff_scene
                data:
                  value: 1
        default:
          - if:
              - condition: state
                entity_id: counter.office_sonoff_scene
                state: '9'
            then:
              - action: counter.set_value
                target:
                  entity_id: counter.office_sonoff_scene
                data:
                  value: 1
            else:
              - action: counter.increment
                target:
                  entity_id: counter.office_sonoff_scene
      - action: script.office_sonoff_apply_scene
    mode: single

  - id: sonoff_button_2_office_off
    alias: 'Sonoff Button 2: Double press → Office lights OFF'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: 18:69:0a:ff:fe:13:a1:01
          command: 'on'
    conditions: []
    variables:
      # While a meeting is active, corner_lamp is owned by the meeting indicator
      # (packages/meeting_indicator.yaml) and stays out of office-off.
      office_lamps: >-
        {% set lamps = ['light.bookcase_lamp', 'light.door_lamp',
          'light.desk_lamp_2', 'light.desk_lamp_2_2', 'light.table_lamp'] %}
        {{ lamps if is_state('light.meeting_light', 'on')
           else lamps + ['light.corner_lamp'] }}
    actions:
      - action: script.turn_off
        target:
          entity_id: script.office_sonoff_candle_loop
      - action: light.turn_off
        target:
          entity_id: '{{ office_lamps }}'
    mode: single

  - id: sonoff_button_2_office_jump_to_bright
    alias: 'Sonoff Button 2: Long press → jump to scene 1 (Bright)'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: 18:69:0a:ff:fe:13:a1:01
          command: 'off'
    conditions: []
    actions:
      - action: counter.set_value
        target:
          entity_id: counter.office_sonoff_scene
        data:
          value: 1
      - action: script.office_sonoff_apply_scene
    mode: single
