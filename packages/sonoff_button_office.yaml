# Sonoff Button 2 (SNZB-01) → Office lights
#
# Device IEEE: 18:69:0a:ff:fe:13:a1:01
#
# SNZB-01 ZHA events (cluster 6):
#   command: toggle  → single press
#   command: 'on'    → double press
#   command: 'off'   → long press (hold)
#
# Bindings (mirror the in-wall Hue rocker's behavior):
#   single press → if lights are off, reset counter to 1 and apply scene 1;
#                  otherwise advance the counter (wraps 6 → 1) and apply.
#                  i.e. first click turns on, subsequent clicks cycle scenes.
#   double press → all office lights off (counter persists)
#   long press   → all office lights off (counter persists)
#
# Long press is intentionally just an alternative OFF — the hold dwell is too
# long to be useful for the more frequent cycle action, so single press is the
# cycler.
#
# The counter is independent of `counter.office_scene_index` used by the in-wall
# Hue rocker (packages/office_hue_switch.yaml) so the two remotes do not stomp
# on each other's scene library.
#
# Every scene except Candle applies the same values to all six lamps
# simultaneously — no per-lamp tiers. Candlelight runs six independent per-lamp
# flicker loops in parallel, each with its own random RGB, brightness, tick
# interval, and a random startup phase so the lamps don't all brighten or dim
# on the same beat (unison flicker looks fake; phase-shifted flicker looks
# like real candles).
#
# Scene catalog:
#   1 Bright    — all 6, 100% / 4000K  (general illumination)
#   2 Relax     — all 6, 40%  / 2200K  (warm, low)
#   3 Focus     — all 6, 100% / 5000K  (bright, cool)
#   4 Red       — all 6, RGB 255,0,0 @ 100%
#   5 Blue      — all 6, RGB 0,0,255 @ 100%
#   6 Candle    — all 6 flicker in unison with random warm RGB
#
# Candlelight runs in script.office_sonoff_candle_loop (mode: restart) and
# exits when counter.office_sonoff_scene leaves '6'. Every non-candle scene
# calls script.turn_off on the candle loop before applying, so transitioning
# out is clean. Transitioning into candle calls script.turn_on so the apply
# script fires-and-forgets — it never waits on the infinite while-loop.

counter:
  office_sonoff_scene:
    name: Office Sonoff Scene
    minimum: 1
    maximum: 6
    initial: 1
    step: 1
    restore: true

script:
  office_sonoff_apply_scene:
    alias: 'Office Sonoff: Apply current scene'
    mode: restart
    sequence:
      - action: script.turn_off
        target:
          entity_id: script.office_sonoff_candle_loop
      - choose:
          - conditions: "{{ states('counter.office_sonoff_scene') == '1' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id:
                    - light.bookcase_lamp
                    - light.corner_lamp
                    - light.door_lamp
                    - light.desk_lamp_2
                    - light.desk_lamp_2_2
                    - light.table_lamp
                data:
                  brightness_pct: 100
                  color_temp_kelvin: 4000
          - conditions: "{{ states('counter.office_sonoff_scene') == '2' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id:
                    - light.bookcase_lamp
                    - light.corner_lamp
                    - light.door_lamp
                    - light.desk_lamp_2
                    - light.desk_lamp_2_2
                    - light.table_lamp
                data:
                  brightness_pct: 40
                  color_temp_kelvin: 2200
          - conditions: "{{ states('counter.office_sonoff_scene') == '3' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id:
                    - light.bookcase_lamp
                    - light.corner_lamp
                    - light.door_lamp
                    - light.desk_lamp_2
                    - light.desk_lamp_2_2
                    - light.table_lamp
                data:
                  brightness_pct: 100
                  color_temp_kelvin: 5000
          - conditions: "{{ states('counter.office_sonoff_scene') == '4' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id:
                    - light.bookcase_lamp
                    - light.corner_lamp
                    - light.door_lamp
                    - light.desk_lamp_2
                    - light.desk_lamp_2_2
                    - light.table_lamp
                data:
                  rgb_color: [255, 0, 0]
                  brightness_pct: 100
          - conditions: "{{ states('counter.office_sonoff_scene') == '5' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id:
                    - light.bookcase_lamp
                    - light.corner_lamp
                    - light.door_lamp
                    - light.desk_lamp_2
                    - light.desk_lamp_2_2
                    - light.table_lamp
                data:
                  rgb_color: [0, 0, 255]
                  brightness_pct: 100
          - conditions: "{{ states('counter.office_sonoff_scene') == '6' }}"
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.office_sonoff_candle_loop

  office_sonoff_candle_loop:
    alias: 'Office Sonoff: Candlelight flicker loop'
    mode: restart
    sequence:
      - parallel:
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: state
                      entity_id: counter.office_sonoff_scene
                      state: '6'
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: light.bookcase_lamp
                      data:
                        rgb_color:
                          - "{{ range(230, 256) | random }}"
                          - "{{ range(85, 111) | random }}"
                          - "{{ range(5, 21) | random }}"
                        brightness_pct: "{{ range(65, 96) | random }}"
                        transition: 0.2
                    - delay:
                        milliseconds: "{{ range(120, 350) | random }}"
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: state
                      entity_id: counter.office_sonoff_scene
                      state: '6'
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: light.corner_lamp
                      data:
                        rgb_color:
                          - "{{ range(230, 256) | random }}"
                          - "{{ range(85, 111) | random }}"
                          - "{{ range(5, 21) | random }}"
                        brightness_pct: "{{ range(65, 96) | random }}"
                        transition: 0.2
                    - delay:
                        milliseconds: "{{ range(120, 350) | random }}"
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: state
                      entity_id: counter.office_sonoff_scene
                      state: '6'
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: light.door_lamp
                      data:
                        rgb_color:
                          - "{{ range(230, 256) | random }}"
                          - "{{ range(85, 111) | random }}"
                          - "{{ range(5, 21) | random }}"
                        brightness_pct: "{{ range(65, 96) | random }}"
                        transition: 0.2
                    - delay:
                        milliseconds: "{{ range(120, 350) | random }}"
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: state
                      entity_id: counter.office_sonoff_scene
                      state: '6'
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: light.desk_lamp_2
                      data:
                        rgb_color:
                          - "{{ range(230, 256) | random }}"
                          - "{{ range(85, 111) | random }}"
                          - "{{ range(5, 21) | random }}"
                        brightness_pct: "{{ range(65, 96) | random }}"
                        transition: 0.2
                    - delay:
                        milliseconds: "{{ range(120, 350) | random }}"
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: state
                      entity_id: counter.office_sonoff_scene
                      state: '6'
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: light.desk_lamp_2_2
                      data:
                        rgb_color:
                          - "{{ range(230, 256) | random }}"
                          - "{{ range(85, 111) | random }}"
                          - "{{ range(5, 21) | random }}"
                        brightness_pct: "{{ range(65, 96) | random }}"
                        transition: 0.2
                    - delay:
                        milliseconds: "{{ range(120, 350) | random }}"
          - sequence:
              - delay:
                  milliseconds: "{{ range(0, 300) | random }}"
              - repeat:
                  while:
                    - condition: state
                      entity_id: counter.office_sonoff_scene
                      state: '6'
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: light.table_lamp
                      data:
                        rgb_color:
                          - "{{ range(230, 256) | random }}"
                          - "{{ range(85, 111) | random }}"
                          - "{{ range(5, 21) | random }}"
                        brightness_pct: "{{ range(65, 96) | random }}"
                        transition: 0.2
                    - delay:
                        milliseconds: "{{ range(120, 350) | random }}"

automation:
  - id: sonoff_button_2_office_cycle
    alias: 'Sonoff Button 2: Single press → office on / cycle scenes'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: 18:69:0a:ff:fe:13:a1:01
          command: toggle
    conditions: []
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.office_lights_on
                state: 'off'
            sequence:
              - action: counter.set_value
                target:
                  entity_id: counter.office_sonoff_scene
                data:
                  value: 1
        default:
          - if:
              - condition: state
                entity_id: counter.office_sonoff_scene
                state: '6'
            then:
              - action: counter.set_value
                target:
                  entity_id: counter.office_sonoff_scene
                data:
                  value: 1
            else:
              - action: counter.increment
                target:
                  entity_id: counter.office_sonoff_scene
      - action: script.office_sonoff_apply_scene
    mode: single

  - id: sonoff_button_2_office_off
    alias: 'Sonoff Button 2: Double or long press → Office lights OFF'
    triggers:
      # Double press
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: 18:69:0a:ff:fe:13:a1:01
          command: 'on'
      # Long press
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: 18:69:0a:ff:fe:13:a1:01
          command: 'off'
    conditions: []
    actions:
      - action: script.turn_off
        target:
          entity_id: script.office_sonoff_candle_loop
      - action: light.turn_off
        target:
          entity_id:
            - light.bookcase_lamp
            - light.corner_lamp
            - light.door_lamp
            - light.desk_lamp_2
            - light.desk_lamp_2_2
            - light.table_lamp
    mode: single
