# Office Hue Wall Switch (RDM001) — scene cycler
#
# Device: "Office Switch" (Signify RDM001) via ZHA
#   device_id: 0ca521afbbfd4474f24f6203d59ab398
#   area:      office
#
# Wiring: the module sits behind a maintained-contact rocker light switch.
#
# Observed events depend on the RDM001's internal `device_mode` attribute
# (see packages/office_hue_switch_modeset.yaml). Two patterns seen on this
# device today:
#
#   Mode 0 (single rocker — desired):
#     Rocker UP   → cluster 6: `attribute_updated` then `command: on`
#                   cluster 0xFC00: `left_hold` (repeats until rocker leaves)
#     Rocker DOWN → cluster 6: `attribute_updated` then `command: off`
#                   cluster 0xFC00: `left_long_release` (once)
#
#   Mode 3 (dual push button — default after factory reset):
#     Rocker UP   → cluster 6: `attribute_updated` then `command` alternates
#                   between `on` / `off_with_effect` / `on_with_recall_global_scene`
#                   on each press (firmware tracks an internal toggle).
#                   cluster 0xFC00: `left_hold` (repeats).
#     Rocker DOWN → cluster 0xFC00: `left_long_release` (once).
#                   NOTE: no cluster-6 command fires on DOWN in this mode.
#
# Triggers below are belt-and-suspenders for both modes:
#   - UP path: matches any of the cluster-6 commands the device might emit.
#     In mode 0 only `on` fires; in mode 3 it alternates through the others.
#     Since exactly one cluster-6 command fires per flip-up in either mode,
#     adding the extras can't cause double-firing.
#   - DOWN path: matches both cluster-6 `off` (mode 0) and cluster-64512
#     `left_long_release` (mode 3). In mode 0 both fire on each down — the
#     automation is `mode: single` so the second is discarded.
#
# `*_hold` events on the manufacturer cluster are intentionally not matched
# (they repeat every ~750ms while the rocker sits in its up position).
#
# Behavior:
#   - Rocker up (command: on)   → if office lights are off, apply scene 1.
#                                 Otherwise advance the counter (wraps 5 → 1)
#                                 and apply the matching scene. Flipping down
#                                 then up again is how you cycle scenes.
#   - Rocker down (command: off) → all office lights off; reset counter.
#
# Scenes:
#   1 Bright   — all 6 lights, 100% / 4000K  (general illumination)
#   2 Focus    — desk lamps 100% 5000K, table+bookcase 60% 3500K, corners off
#   3 Relax    — all 6 lights, 50% / 2200K  (warm)
#   4 Movie    — bookcase + corner only, 20% / 2000K, rest off
#   5 Color    — bookcase/corner/door/table in different hues, desks off

counter:
  office_scene_index:
    name: Office Scene Index
    minimum: 1
    maximum: 5
    initial: 1
    step: 1
    restore: true

automation:
  - id: office_hue_switch_top_cycle
    alias: 'Office Hue Switch: Rocker up → cycle office scenes'
    triggers:
      # Mode 0 single-rocker, or first press in mode 3:
      - trigger: event
        event_type: zha_event
        event_data:
          device_id: 0ca521afbbfd4474f24f6203d59ab398
          cluster_id: 6
          command: 'on'
      # Mode 3 dual-push-button — firmware alternates these commands on each
      # press. Exactly one fires per flip-up, so no double-trigger risk.
      - trigger: event
        event_type: zha_event
        event_data:
          device_id: 0ca521afbbfd4474f24f6203d59ab398
          cluster_id: 6
          command: 'off_with_effect'
      - trigger: event
        event_type: zha_event
        event_data:
          device_id: 0ca521afbbfd4474f24f6203d59ab398
          cluster_id: 6
          command: 'on_with_recall_global_scene'
    actions:
      # Decide which scene index to land on before applying it.
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.office_lights_on
                state: 'off'
            sequence:
              - action: counter.configure
                target:
                  entity_id: counter.office_scene_index
                data:
                  value: 1
        default:
          - if:
              - condition: state
                entity_id: counter.office_scene_index
                state: '5'
            then:
              - action: counter.configure
                target:
                  entity_id: counter.office_scene_index
                data:
                  value: 1
            else:
              - action: counter.increment
                target:
                  entity_id: counter.office_scene_index
      - choose:
          - conditions: "{{ states('counter.office_scene_index') == '1' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id:
                    - light.bookcase_lamp
                    - light.corner_lamp
                    - light.door_lamp
                    - light.desk_lamp_2
                    - light.desk_lamp_2_2
                    - light.table_lamp
                data:
                  brightness_pct: 100
                  kelvin: 4000
          - conditions: "{{ states('counter.office_scene_index') == '2' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id:
                    - light.desk_lamp_2
                    - light.desk_lamp_2_2
                data:
                  brightness_pct: 100
                  kelvin: 5000
              - action: light.turn_on
                target:
                  entity_id:
                    - light.table_lamp
                    - light.bookcase_lamp
                data:
                  brightness_pct: 60
                  kelvin: 3500
              - action: light.turn_off
                target:
                  entity_id:
                    - light.corner_lamp
                    - light.door_lamp
          - conditions: "{{ states('counter.office_scene_index') == '3' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id:
                    - light.bookcase_lamp
                    - light.corner_lamp
                    - light.door_lamp
                    - light.desk_lamp_2
                    - light.desk_lamp_2_2
                    - light.table_lamp
                data:
                  brightness_pct: 50
                  kelvin: 2200
          - conditions: "{{ states('counter.office_scene_index') == '4' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id:
                    - light.bookcase_lamp
                    - light.corner_lamp
                data:
                  brightness_pct: 20
                  kelvin: 2000
              - action: light.turn_off
                target:
                  entity_id:
                    - light.door_lamp
                    - light.desk_lamp_2
                    - light.desk_lamp_2_2
                    - light.table_lamp
          - conditions: "{{ states('counter.office_scene_index') == '5' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.bookcase_lamp
                data:
                  rgb_color: [255, 50, 200]
                  brightness_pct: 80
              - action: light.turn_on
                target:
                  entity_id: light.corner_lamp
                data:
                  rgb_color: [50, 100, 255]
                  brightness_pct: 80
              - action: light.turn_on
                target:
                  entity_id: light.door_lamp
                data:
                  rgb_color: [100, 255, 150]
                  brightness_pct: 80
              - action: light.turn_on
                target:
                  entity_id: light.table_lamp
                data:
                  rgb_color: [255, 150, 50]
                  brightness_pct: 80
              - action: light.turn_off
                target:
                  entity_id:
                    - light.desk_lamp_2
                    - light.desk_lamp_2_2
    mode: queued
    max: 5

  - id: office_hue_switch_bottom_off
    alias: 'Office Hue Switch: Rocker down → all office lights off'
    triggers:
      # Mode 0 single-rocker: cluster 6 'off' fires on every flip-down.
      - trigger: event
        event_type: zha_event
        event_data:
          device_id: 0ca521afbbfd4474f24f6203d59ab398
          cluster_id: 6
          command: 'off'
      # Mode 3 dual-push-button: only the Hue manufacturer cluster fires.
      # `mode: single` (below) makes the redundant trigger a no-op in mode 0.
      - trigger: event
        event_type: zha_event
        event_data:
          device_id: 0ca521afbbfd4474f24f6203d59ab398
          cluster_id: 64512
          command: 'left_long_release'
    actions:
      - action: light.turn_off
        target:
          entity_id:
            - light.bookcase_lamp
            - light.corner_lamp
            - light.door_lamp
            - light.desk_lamp_2
            - light.desk_lamp_2_2
            - light.table_lamp
      - action: counter.configure
        target:
          entity_id: counter.office_scene_index
        data:
          value: 1
    mode: single
