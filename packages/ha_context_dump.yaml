shell_command:
  ha_context_dump: "/bin/bash /config/scripts/ha-context-dump.sh"

input_button:
  ha_context_dump_now:
    name: "Dump HA Context for CC"
    icon: mdi:database-export

automation:
  - id: ha_context_dump_trigger
    alias: "HA Context Dump: Trigger on Button Press"
    triggers:
      - trigger: state
        entity_id: input_button.ha_context_dump_now
    actions:
      - action: shell_command.ha_context_dump
      - action: persistent_notification.create
        data:
          message: "Snapshot dumped; if changes were detected, a context-snapshot PR will open shortly."
          title: "HA Context Dump"
          notification_id: ha_context_dump_done
    mode: single

  - id: ha_context_dump_periodic
    alias: "Context Dump: Periodic snapshot"
    mode: single
    triggers:
      - trigger: time_pattern
        hours: "/6"
    actions:
      - action: shell_command.ha_context_dump
