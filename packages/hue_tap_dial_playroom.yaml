# Hue Tap Dial (RDM002) → Play Room lights
#
# Device: "Hue Tap Dial" (Signify RDM002) via ZHA
#   device_ieee: 00:17:88:01:0d:35:c4:85
#   area:        play_room
#
# Wired-power note: the four Hue White-and-Color bulbs (light.playroom_1..4,
# model LCT011) are downstream of a Belkin Wemo in-wall LightSwitch exposed
# as `switch.bonus_room` (device renamed "Playroom Lights Power" in HA UI but
# entity_id retained to match adoption-history convention used elsewhere in
# this repo, e.g. switch.alarm_panel_56ac70_siren). If the wall switch is off
# the bulbs lose mains and drop off the Zigbee mesh. Every scene-on action
# below calls `script.playroom_lights_power_on` first, which flips the switch
# on (if needed) and waits for the bulbs to rejoin before applying the scene.
# `light.turn_off` does NOT cut mains — the bulbs stay powered-but-off so the
# dial can wake them again later without a rejoin delay.
# (`switch.play_room_outlet` is a separate TP-Link Kasa HS200 outlet in the
# same room that does NOT power the bulbs.)
#
# Button layout — short press (immediate) / long press (hold):
#   1 (top)    short → Bright Daylight   100% / 4000K — workhorse white
#   1          long  → Color Loop        smooth software color cycle (~2.5s/step)
#   2          short → Sunset            per-bulb warms (coral/pink/orange/magenta)
#   2          long  → Relax              40% / 2200K — warm dim
#   3          short → Ocean             per-bulb cools (cyan/blue/teal/purple)
#   3          long  → Rainbow           per-bulb vivid (red/green/blue/yellow)
#   4 (bottom) short → Off               — bulbs off, outlet stays on
#   4          long  → Colorloop          Hue native effect, slow color cycle
#
# Dial rotation:
#   Clockwise (step up)         → brightness +25 (~10%) on all 4 lights
#   Counter-clockwise (step dn) → brightness -25 on all 4 lights
#   Rotating with all lights off is a no-op — press a button first.
#
# Color Loop driver (Button 1 long):
#   `script.playroom_color_loop` is an infinite `mode: restart` loop — every
#   ~2.5s it advances a base hue and writes four evenly-spread colors (base,
#   base+90, base+180, base+270) across the bulbs, so the room shows a rotating
#   four-colour wash. It is started fire-and-forget via `script.turn_on` (a
#   direct `action: script.playroom_color_loop` call would block the calling
#   automation forever) and stopped by `script.turn_off` — every static scene
#   below calls that stop first so it can't fight the loop. The loop only
#   writes colour, never brightness, so the dial still dims the room while it
#   runs. Same pattern as `script.office_sonoff_candle_loop`.
#
#   Off from outside this package (Alexa, dashboard, companion app, Assist)
#   does not go through Button 4, so it never stops the loop — a plain
#   light.turn_off is overwritten on the next pass and the bulbs stay lit.
#   The `playroom_color_loop_external_off_guard` automation at the bottom of
#   this file closes that gap.
#
# ZHA event signatures (PhilipsRDM002 quirk, zha-device-handlers):
#   Buttons fire on cluster 0xFC00 (64512) with commands of the form
#   `button_N_short_release` / `button_N_long_release` where N is 1-4.
#   Older or alternate quirk builds emit `N_short_release` / `N_long_release`
#   (no `button_` prefix). Both shapes are matched defensively so the
#   automation survives quirk updates.
#   The dial fires `step` / `step_with_on_off` on cluster 8 (Level Control),
#   args[0] = direction (0 = up, 1 = down) per Zigbee spec.
#   Triggers use `device_ieee` (persistent across device re-add) instead of
#   `device_id` (changes if device is removed/re-paired).
#
# If you ever need to see exactly what this dial emits, watch
# Developer Tools → Events → listen for `zha_event` and rotate / press.

script:
  playroom_lights_power_on:
    alias: 'Playroom: ensure wall switch on and bulbs reachable'
    mode: single
    sequence:
      - if:
          - condition: state
            entity_id: switch.bonus_room
            state: 'off'
        then:
          - action: switch.turn_on
            target:
              entity_id: switch.bonus_room
          # Hue bulbs need a moment to rejoin the Zigbee mesh after mains
          # is restored. Wait until all 4 report a usable state, capped at
          # 8s so a single missing bulb can't block the scene apply forever.
          - wait_template: >-
              {{ states('light.playroom_1') not in ['unavailable', 'unknown']
                 and states('light.playroom_2') not in ['unavailable', 'unknown']
                 and states('light.playroom_3') not in ['unavailable', 'unknown']
                 and states('light.playroom_4') not in ['unavailable', 'unknown'] }}
            timeout: '00:00:08'
            continue_on_timeout: true

  playroom_brightness_step:
    alias: 'Playroom: step brightness on all four lights'
    mode: queued
    max: 10
    fields:
      delta:
        description: 'Brightness delta in the 0-255 scale (+25 ≈ +10%).'
        selector:
          number:
            min: -255
            max: 255
    sequence:
      # Bulbs are unreachable when the wall switch is off; bail rather than
      # racing a power-on. User can press a button to wake the room.
      - condition: state
        entity_id: switch.bonus_room
        state: 'on'
      - variables:
          # Pick the highest current brightness across the on bulbs as the
          # reference point so a single dimmed bulb doesn't drag the whole
          # room down on the next rotation. Off bulbs contribute 0.
          current: >-
            {% set vals = [
              state_attr('light.playroom_1', 'brightness')|default(0)|int(0) if is_state('light.playroom_1', 'on') else 0,
              state_attr('light.playroom_2', 'brightness')|default(0)|int(0) if is_state('light.playroom_2', 'on') else 0,
              state_attr('light.playroom_3', 'brightness')|default(0)|int(0) if is_state('light.playroom_3', 'on') else 0,
              state_attr('light.playroom_4', 'brightness')|default(0)|int(0) if is_state('light.playroom_4', 'on') else 0
            ] %}
            {{ vals | max }}
          target: "{{ [[ (current | int(0)) + (delta | int(0)), 1 ] | max, 255 ] | min }}"
      - if:
          - condition: template
            value_template: "{{ (current | int(0)) + (delta | int(0)) > 0 }}"
        then:
          - action: light.turn_on
            target:
              entity_id:
                - light.playroom_1
                - light.playroom_2
                - light.playroom_3
                - light.playroom_4
            data:
              brightness: "{{ target }}"
              transition: 0.3
        else:
          - action: light.turn_off
            target:
              entity_id:
                - light.playroom_1
                - light.playroom_2
                - light.playroom_3
                - light.playroom_4
            data:
              transition: 0.3

  playroom_color_loop:
    alias: 'Playroom: fast color loop driver'
    # Infinite loop. mode: restart means a fresh Button-1-long press (or any
    # script.turn_on) cleanly relaunches it; script.turn_off halts it mid-delay.
    # Started fire-and-forget via script.turn_on — never called directly as
    # `action: script.playroom_color_loop`, which would block the caller.
    mode: restart
    sequence:
      - repeat:
          while:
            - condition: template
              value_template: "{{ true }}"
          sequence:
            # Advance the base hue ~23° per step. 23 is not a divisor of 360,
            # so the four-colour pattern drifts rather than snapping back.
            - variables:
                base: "{{ (repeat.index * 23) % 360 }}"
            # Four evenly-spread hues, one per bulb, all rotating together.
            # transition matches the delay so colours flow with no pause.
            # No brightness key — the dial keeps independent brightness control.
            - parallel:
                - action: light.turn_on
                  target:
                    entity_id: light.playroom_1
                  data:
                    hs_color:
                      - "{{ base }}"
                      - 100
                    transition: 2.5
                - action: light.turn_on
                  target:
                    entity_id: light.playroom_2
                  data:
                    hs_color:
                      - "{{ (base + 90) % 360 }}"
                      - 100
                    transition: 2.5
                - action: light.turn_on
                  target:
                    entity_id: light.playroom_3
                  data:
                    hs_color:
                      - "{{ (base + 180) % 360 }}"
                      - 100
                    transition: 2.5
                - action: light.turn_on
                  target:
                    entity_id: light.playroom_4
                  data:
                    hs_color:
                      - "{{ (base + 270) % 360 }}"
                      - 100
                    transition: 2.5
            - delay: "00:00:02.5"

automation:
  # ───────────────────────── BUTTON 1 ─────────────────────────
  - id: hue_tap_dial_button_1_short_bright
    alias: 'Hue Tap Dial: Button 1 short → Bright Daylight (100% / 4000K)'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_1_short_release
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '1_short_release'
    actions:
      # Stop the colour loop first so it can't override this static scene.
      - action: script.turn_off
        target:
          entity_id: script.playroom_color_loop
      - action: script.playroom_lights_power_on
      - action: light.turn_on
        target:
          entity_id:
            - light.playroom_1
            - light.playroom_2
            - light.playroom_3
            - light.playroom_4
        data:
          brightness_pct: 100
          color_temp_kelvin: 4000
          transition: 1
    mode: single

  - id: hue_tap_dial_button_1_long_color_loop
    alias: 'Hue Tap Dial: Button 1 long → Fast color loop'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_1_long_release
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '1_long_release'
    actions:
      - action: script.playroom_lights_power_on
      # Establish a visible brightness and turn the bulbs on. The loop driver
      # only writes colour, so this is the one place brightness is set on entry
      # — afterward the dial can dim the room freely while colours cycle.
      - action: light.turn_on
        target:
          entity_id:
            - light.playroom_1
            - light.playroom_2
            - light.playroom_3
            - light.playroom_4
        data:
          brightness_pct: 80
          transition: 1
      # Fire-and-forget: script.turn_on does NOT wait on the infinite loop.
      - action: script.turn_on
        target:
          entity_id: script.playroom_color_loop
    mode: single

  # ───────────────────────── BUTTON 2 ─────────────────────────
  - id: hue_tap_dial_button_2_short_sunset
    alias: 'Hue Tap Dial: Button 2 short → Sunset (per-bulb warm colors)'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_2_short_release
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '2_short_release'
    actions:
      # Stop the colour loop first so it can't override this static scene.
      - action: script.turn_off
        target:
          entity_id: script.playroom_color_loop
      - action: script.playroom_lights_power_on
      # Four warm-palette colors, one per bulb, for a vibrant sunset feel.
      - parallel:
          - action: light.turn_on
            target:
              entity_id: light.playroom_1
            data:
              brightness_pct: 90
              rgb_color: [255, 100, 80]    # coral
              transition: 1
          - action: light.turn_on
            target:
              entity_id: light.playroom_2
            data:
              brightness_pct: 90
              rgb_color: [255, 60, 130]    # pink-magenta
              transition: 1
          - action: light.turn_on
            target:
              entity_id: light.playroom_3
            data:
              brightness_pct: 90
              rgb_color: [255, 120, 30]    # burnt orange
              transition: 1
          - action: light.turn_on
            target:
              entity_id: light.playroom_4
            data:
              brightness_pct: 90
              rgb_color: [255, 80, 180]    # hot pink
              transition: 1
    mode: single

  - id: hue_tap_dial_button_2_long_relax
    alias: 'Hue Tap Dial: Button 2 long → Relax (40% / 2200K)'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_2_long_release
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '2_long_release'
    actions:
      # Stop the colour loop first so it can't override this static scene.
      - action: script.turn_off
        target:
          entity_id: script.playroom_color_loop
      - action: script.playroom_lights_power_on
      - action: light.turn_on
        target:
          entity_id:
            - light.playroom_1
            - light.playroom_2
            - light.playroom_3
            - light.playroom_4
        data:
          brightness_pct: 40
          color_temp_kelvin: 2200
          transition: 1
    mode: single

  # ───────────────────────── BUTTON 3 ─────────────────────────
  - id: hue_tap_dial_button_3_short_ocean
    alias: 'Hue Tap Dial: Button 3 short → Ocean (per-bulb cool colors)'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_3_short_release
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '3_short_release'
    actions:
      # Stop the colour loop first so it can't override this static scene.
      - action: script.turn_off
        target:
          entity_id: script.playroom_color_loop
      - action: script.playroom_lights_power_on
      # Four cool-palette colors, one per bulb, for an aquatic feel.
      - parallel:
          - action: light.turn_on
            target:
              entity_id: light.playroom_1
            data:
              brightness_pct: 90
              rgb_color: [0, 200, 230]     # cyan
              transition: 1
          - action: light.turn_on
            target:
              entity_id: light.playroom_2
            data:
              brightness_pct: 90
              rgb_color: [50, 80, 255]     # royal blue
              transition: 1
          - action: light.turn_on
            target:
              entity_id: light.playroom_3
            data:
              brightness_pct: 90
              rgb_color: [0, 180, 160]     # teal
              transition: 1
          - action: light.turn_on
            target:
              entity_id: light.playroom_4
            data:
              brightness_pct: 90
              rgb_color: [150, 80, 255]    # purple
              transition: 1
    mode: single

  - id: hue_tap_dial_button_3_long_rainbow
    alias: 'Hue Tap Dial: Button 3 long → Rainbow (per-bulb vivid primaries)'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_3_long_release
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '3_long_release'
    actions:
      # Stop the colour loop first so it can't override this static scene.
      - action: script.turn_off
        target:
          entity_id: script.playroom_color_loop
      - action: script.playroom_lights_power_on
      # Four vivid primaries, one per bulb. Big-energy "play time" mode.
      - parallel:
          - action: light.turn_on
            target:
              entity_id: light.playroom_1
            data:
              brightness_pct: 95
              rgb_color: [255, 30, 30]     # red
              transition: 1
          - action: light.turn_on
            target:
              entity_id: light.playroom_2
            data:
              brightness_pct: 95
              rgb_color: [40, 220, 60]     # green
              transition: 1
          - action: light.turn_on
            target:
              entity_id: light.playroom_3
            data:
              brightness_pct: 95
              rgb_color: [40, 80, 255]     # blue
              transition: 1
          - action: light.turn_on
            target:
              entity_id: light.playroom_4
            data:
              brightness_pct: 95
              rgb_color: [255, 220, 40]    # yellow
              transition: 1
    mode: single

  # ───────────────────────── BUTTON 4 ─────────────────────────
  - id: hue_tap_dial_button_4_short_off
    alias: 'Hue Tap Dial: Button 4 short → all playroom lights off'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_4_short_release
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '4_short_release'
    actions:
      # Stop the colour loop first so it can't re-light the bulbs after off.
      - action: script.turn_off
        target:
          entity_id: script.playroom_color_loop
      - action: light.turn_off
        target:
          entity_id:
            - light.playroom_1
            - light.playroom_2
            - light.playroom_3
            - light.playroom_4
        data:
          transition: 1
    mode: single

  - id: hue_tap_dial_button_4_long_colorloop
    alias: 'Hue Tap Dial: Button 4 long → Colorloop effect'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: button_4_long_release
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          command: '4_long_release'
    actions:
      # Stop the fast software loop before handing off to the native effect.
      - action: script.turn_off
        target:
          entity_id: script.playroom_color_loop
      - action: script.playroom_lights_power_on
      # Hue native colorloop effect — bulbs slowly cycle through the full
      # color space. Stops automatically when any of the static-color
      # scenes (1-3 short/long) are applied next.
      - action: light.turn_on
        target:
          entity_id:
            - light.playroom_1
            - light.playroom_2
            - light.playroom_3
            - light.playroom_4
        data:
          brightness_pct: 85
          effect: colorloop
    mode: single

  # ───────────────────────── DIAL ROTATION ─────────────────────────
  - id: hue_tap_dial_rotation_brightness
    alias: 'Hue Tap Dial: dial rotation → playroom brightness'
    triggers:
      - trigger: event
        event_type: zha_event
        event_data:
          device_ieee: '00:17:88:01:0d:35:c4:85'
          cluster_id: 8
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.command in ['step', 'step_with_on_off', 'move', 'move_with_on_off'] }}"
      - condition: template
        value_template: "{{ trigger.event.data.args is iterable and trigger.event.data.args | length > 0 }}"
    actions:
      - action: script.playroom_brightness_step
        data:
          # Zigbee Level Control step_mode: 0 = up, 1 = down.
          # ~10% per click feels right with the dial's typical detent count.
          delta: "{{ -25 if trigger.event.data.args[0] == 1 else 25 }}"
    mode: queued
    max: 10

  - id: playroom_color_loop_external_off_guard
    alias: 'Playroom: external off stops the color loop'
    description: >-
      Makes "turn off the playroom lights" work from outside the tap dial.
      Button 4 short calls script.turn_off on the color loop before turning the
      bulbs off; Alexa, the dashboard, the companion app and Assist all call
      plain light.turn_off, which the loop overwrites on its next pass (2.5 s
      later) because it writes light.turn_on with hs_color — enough to re-light
      a bulb that was just turned off. This guard watches for a bulb going off
      while the loop is running, kills the loop, and re-issues the off.

      Only the software loop (Button 1 long) needs this. The Hue native
      colorloop effect (Button 4 long) runs on the bulbs themselves, so HA
      sends nothing and an external off already works there.
    triggers:
      - trigger: state
        entity_id:
          - light.playroom_1
          - light.playroom_2
          - light.playroom_3
          - light.playroom_4
        from: 'on'
        to: 'off'
    conditions:
      # The loop only ever writes colour, never brightness and never off, so an
      # on→off transition while it runs came from outside the loop.
      - condition: state
        entity_id: script.playroom_color_loop
        state: 'on'
    # restart: an off command lands on all four bulbs at once, so several
    # triggers fire within a few hundred ms. Only the last run needs to finish.
    mode: restart
    actions:
      - action: script.turn_off
        target:
          entity_id: script.playroom_color_loop
      # Let the loop's in-flight parallel light.turn_on calls land before the
      # sweep, otherwise a late write re-lights a bulb behind us. The loop's
      # writes carry transition: 2.5, so give them room to complete.
      - delay:
          seconds: 3
      - action: light.turn_off
        target:
          entity_id:
            - light.playroom_1
            - light.playroom_2
            - light.playroom_3
            - light.playroom_4
        data:
          transition: 1
