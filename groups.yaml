# groups.yaml — Sensor groups for alarm panel and dashboard use

doors:
  name: Door Sensors
  entities:
    - binary_sensor.main_panel_front_door
    - binary_sensor.main_panel_garage_door
    - binary_sensor.main_panel_basement_door
    - binary_sensor.main_panel_sliding_door

motion:
  name: Motion Sensors
  entities:
    - binary_sensor.main_panel_office_motion
    - binary_sensor.main_panel_family_room_motion

downstairs_lights:
  name: Downstairs Lights
  entities:
    - light.kitchen_main
    - light.kitchen_island
    - light.kitchen_table
    - light.family_room
    - light.family_room_2
    - light.floor_lamp_composite

outdoor_lights:
  name: Outdoor Lights
  entities:
    - light.front_door
    - light.front_lantern
    - light.garage_front
    - light.garage_side
    - light.shed
    - switch.back_porch
