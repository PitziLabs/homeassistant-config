Home Polish:
  # Tokens used by dashboards/home.yaml — change here, propagate everywhere.
  # Loaded via the standard themes !include_dir_merge_named pattern in
  # configuration.yaml. Applied per-view via `theme: Home Polish` on the
  # home view, on top of the project's default Noctis Home theme.

  # Color palette
  home-bg-page: "#0e1117"
  home-bg-card: "#161b22"
  home-bg-tile: "#1a1f27"
  home-bg-tile-active-media: "#14283f"
  home-text-primary: "#e6edf3"
  home-text-secondary: "#8b949e"
  home-text-tertiary: "#6e7681"

  # Accent colors per panel
  home-accent-climate: "#f0883e"
  home-accent-sensors: "#56d364"
  home-accent-lights: "#e3b341"
  home-accent-media: "#58a6ff"
  home-accent-disarmed: "#56d364"
  home-accent-armed: "#e3b341"
  home-accent-triggered: "#f85149"

  # Mushroom token overrides — sized to fit the lights column
  # (5 sections + 7 tile rows + headers) inside the home cell
  # without triggering a page-level scrollbar at 2560x1440.
  mush-icon-size: 32px
  mush-icon-symbol-size: 0.55em
  mush-card-primary-font-size: 13px
  mush-card-secondary-font-size: 12px
  mush-spacing: 8px

  # State-color sugar
  state-on-color: "#56d364"
  state-off-color: "#6e7681"

  card-mod-theme: Home Polish
  card-mod-root: |
    /* Force home grid background through layout-card */
    home-assistant-main {
      --primary-background-color: var(--home-bg-page);
    }
  # mushroom-light-card: dark tile base, amber brightness-scaled tint when on,
  # left-border accent. Applied globally to all mushroom-light-cards on the
  # home view (tap-toggle + show_brightness_control inline slider per card).
  card-mod-card: |
    ha-card {
      {% if config.type == "custom:mushroom-light-card" %}
        background: var(--home-bg-tile) !important;
        border-radius: 8px !important;
        border: none !important;
        {% if is_state(config.entity, 'on') %}
          {% set b = (state_attr(config.entity, 'brightness') | int(128)) %}
          background-color: rgba(227, 179, 65, {{ (0.10 + 0.24 * (b / 255)) | round(2) }}) !important;
          border-left: 4px solid var(--home-accent-lights) !important;
        {% else %}
          border-left: 4px solid transparent !important;
        {% endif %}
        transition: background-color 0.4s ease, border-left 0.2s ease;
      {% endif %}
    }
