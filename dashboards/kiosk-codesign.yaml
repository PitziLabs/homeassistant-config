# =================================================================
# AUTO-GENERATED — DO NOT EDIT BY HAND.
# Mirror of dashboards/kiosk.yaml, produced by
# scripts/sync-kiosk-codesign.sh. Edit kiosk.yaml, then run that
# script to refresh this file. CI (Tests > Codesign Sync) fails if
# this file drifts from production.
#
# Purpose: preview kiosk changes at /dashboard-kiosk-codesign/home
# without touching the household monitor (/dashboard-kiosk/home).
# Preview with:
#   kiosk-host/kiosk-preview dashboards/kiosk-codesign.yaml \
#     --url http://homeassistant.local:8123/dashboard-kiosk-codesign/home
#
# Only the first view's tab title/icon and theme differ from production;
# all cards, templates, and entity references are identical.
# =================================================================
# KIOSK DASHBOARD — native `sections` layout
# Primary home-state display ("the presence monitor") on the pve2
# 2560x1440 wall monitor, served at /dashboard-kiosk/home.
#
# Layout philosophy: NO hard pixel-fit. Uses HA's native `sections`
# view — cards size to their content, sections reflow responsively
# across max_columns. There is deliberately no height:100% cascade and
# no fixed-pixel row math. This replaced the custom:grid-layout +
# mod-card pixel-fit design on 2026-06-11.
#
# Width fill: max_columns is 5. HA caps each sections column at ~500px
# and centers the grid, so on the 2560px wall display fewer columns
# leave wide black bars on each side (3 cols ≈ 530px bars; 5 cols ≈
# ~38px).
#
# Section ORDER is load-bearing. HA's sections view places sections
# round-robin by order (section i -> column i mod 5) and sizes each
# grid row to its tallest section. There are exactly TEN sections (two
# clean rows — an 11th would force a third row that overflows 1440 and
# clips the bottom), hand-ordered to PAIR a big tile section with a
# short non-tile section per column so the five columns land within
# ~200px of each other AND the page never scrolls:
#   c1 Weather              + Openings (doors/garage/motion)
#   c2 Upstairs climate     + Hallway/Outdoor lights
#   c3 Downstairs climate   + Office lights
#   c4 Security/Presence    + Home Status (env + safety)
#   c5 Media                + Family/Kitchen lights
# Because of round-robin, the YAML order is the column-interleave (the
# first five sections are the top row, the next five the bottom row),
# NOT the visual top-to-bottom order of a single column. YAML anchors
# (&climate_block, &mlight) are defined in whichever section appears
# first in document order and reused by later ones.
#
# Design language (one tile family across the board): button-card,
# dark tile base, big icon over name over value. State drives icon
# color + background tint (intensity can scale with magnitude, e.g.
# light brightness); a LEFT 4px accent = "active/identity" (alarm,
# presence, a light that's on); a FULL 2px border = "alert" (door/
# garage open, motion, leak wet, alarm triggered) — reserved for things
# that demand attention. Color semantics via theme tokens: green =
# safe/home/closed, red = open/alert, amber = lights/in-transit,
# blue = media/cool. Climate uses the native thermostat dial; weather
# the clock-weather-card; Sonos the mini-media-player.
#
# The Nest doorbell camera was removed 2026-06-13 — its cloud
# integration does not serve a still snapshot, so camera_view:snapshot
# rendered a dead black box dead-center.
#
# Iterate via the codesign sandbox (/dashboard-kiosk-codesign/home),
# a CI-mirrored copy; see scripts/sync-kiosk-codesign.sh.
# =================================================================

kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_sidebar: true
  user_settings:
    - users:
        - "Kiosk"
      kiosk: true

views:
  - title: Co-design
    path: home
    icon: mdi:monitor-edit
    theme: Kiosk Codesign
    type: sections
    max_columns: 5
    sections:

      # ===== c1 top ===== WEATHER ================================
      - type: grid
        cards:
          - type: heading
            heading: Weather
            heading_style: title
          - type: custom:clock-weather-card
            entity: weather.forecast_home
            forecast_rows: 5
            time_format: "12"
            date_pattern: "EEEE, MMM d"
            hide_today_section: false
            hide_forecast_section: false

      # ===== c2 top ===== CLIMATE · UPSTAIRS (defines block) =====
      - type: grid
        cards:
          - type: heading
            heading: Upstairs
            heading_style: title
          - &climate_block
            type: vertical-stack
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: climate.upstairs
                    state_not: 'off'
                card:
                  type: thermostat
                  entity: climate.upstairs
                  name: Upstairs
              - type: conditional
                conditions:
                  - condition: state
                    entity: climate.upstairs
                    state: 'off'
                card:
                  type: custom:mushroom-template-card
                  entity: climate.upstairs
                  primary: |-
                    {% set t = state_attr(config.entity, "current_temperature") %}
                    {{ (t | round(1)) if t is not none else "—" }}°F
                  secondary: "Upstairs · Standby"
                  icon: mdi:thermometer
                  icon_color: blue-grey
                  fill_container: true
                  tap_action: { action: more-info }
              - type: custom:mushroom-chips-card
                alignment: center
                chips:
                  - type: template
                    icon: mdi:water-percent
                    icon_color: blue
                    content: '{% set h = states("sensor.upstairs_humidity") | float(none) %}{{ (h | round) if h is not none else "—" }}%'
                  - type: template
                    icon: mdi:thermometer
                    icon_color: amber
                    content: |-
                      {% set t = state_attr("climate.upstairs", "temperature") %}
                      {% set tl = state_attr("climate.upstairs", "target_temp_low") %}
                      {% set th = state_attr("climate.upstairs", "target_temp_high") %}
                      {% if t is not none %}Set {{ t | round }}°
                      {% elif tl is not none and th is not none %}{{ tl | round }}–{{ th | round }}°
                      {% else %}—{% endif %}
                  - type: template
                    icon: |-
                      {% set a = state_attr("climate.upstairs", "hvac_action") %}
                      {% if a == "heating" %}mdi:fire{% elif a == "cooling" %}mdi:snowflake{% elif a == "idle" %}mdi:thermometer-check{% else %}mdi:thermometer-off{% endif %}
                    icon_color: |-
                      {% set a = state_attr("climate.upstairs", "hvac_action") %}
                      {% if a == "heating" %}red{% elif a == "cooling" %}blue{% else %}grey{% endif %}
                    content: |-
                      {% set a = state_attr("climate.upstairs", "hvac_action") %}
                      {{ a | title if a else "Off" }}

      # ===== c3 top ===== CLIMATE · DOWNSTAIRS ===================
      - type: grid
        cards:
          - type: heading
            heading: Downstairs
            heading_style: title
          - <<: *climate_block
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: climate.downstairs
                    state_not: 'off'
                card:
                  type: thermostat
                  entity: climate.downstairs
                  name: Downstairs
              - type: conditional
                conditions:
                  - condition: state
                    entity: climate.downstairs
                    state: 'off'
                card:
                  type: custom:mushroom-template-card
                  entity: climate.downstairs
                  primary: |-
                    {% set t = state_attr(config.entity, "current_temperature") %}
                    {{ (t | round(1)) if t is not none else "—" }}°F
                  secondary: "Downstairs · Standby"
                  icon: mdi:thermometer
                  icon_color: blue-grey
                  fill_container: true
                  tap_action: { action: more-info }
              - type: custom:mushroom-chips-card
                alignment: center
                chips:
                  - type: template
                    icon: mdi:water-percent
                    icon_color: blue
                    content: '{% set h = states("sensor.downstairs_humidity") | float(none) %}{{ (h | round) if h is not none else "—" }}%'
                  - type: template
                    icon: mdi:thermometer
                    icon_color: amber
                    content: |-
                      {% set t = state_attr("climate.downstairs", "temperature") %}
                      {% set tl = state_attr("climate.downstairs", "target_temp_low") %}
                      {% set th = state_attr("climate.downstairs", "target_temp_high") %}
                      {% if t is not none %}Set {{ t | round }}°
                      {% elif tl is not none and th is not none %}{{ tl | round }}–{{ th | round }}°
                      {% else %}—{% endif %}
                  - type: template
                    icon: |-
                      {% set a = state_attr("climate.downstairs", "hvac_action") %}
                      {% if a == "heating" %}mdi:fire{% elif a == "cooling" %}mdi:snowflake{% elif a == "idle" %}mdi:thermometer-check{% else %}mdi:thermometer-off{% endif %}
                    icon_color: |-
                      {% set a = state_attr("climate.downstairs", "hvac_action") %}
                      {% if a == "heating" %}red{% elif a == "cooling" %}blue{% else %}grey{% endif %}
                    content: |-
                      {% set a = state_attr("climate.downstairs", "hvac_action") %}
                      {{ a | title if a else "Off" }}

      # ===== c4 top ===== SECURITY & PRESENCE ====================
      # Alarm hero + arm/disarm row, then meeting indicator +
      # Chris/Rachel presence.
      - type: grid
        cards:
          - type: heading
            heading: Security
            heading_style: title

          # --- Alarm hero ---
          - type: custom:button-card
            entity: alarm_control_panel.home_alarm
            name: Home Alarm
            show_name: true
            show_state: true
            show_icon: true
            size: 40%
            layout: icon_name_state
            triggers_update:
              - binary_sensor.house_openings
            state_display: |
              [[[
                if (states['alarm_control_panel.home_alarm'].state === 'disarmed'
                    && states['binary_sensor.house_openings'].state === 'on') {
                  const openList = states['binary_sensor.house_openings'].attributes.open_list || '';
                  return openList ? `OPEN: ${openList}` : 'OPEN';
                }
                return entity.state.toUpperCase();
              ]]]
            tap_action: { action: more-info }
            state:
              - operator: template
                value: |
                  [[[ return states['alarm_control_panel.home_alarm'].state === 'disarmed'
                       && states['binary_sensor.house_openings'].state === 'on'; ]]]
                icon: mdi:shield-alert
                color: 'var(--kiosk-accent-armed)'
                styles:
                  card:
                    - background-color: 'rgba(227, 179, 65, 0.20)'
                    - border-left: '4px solid var(--kiosk-accent-armed)'
                  state:
                    - color: 'var(--kiosk-accent-armed)'
                    - font-size: '22px'
                    - letter-spacing: '1px'
                    - white-space: 'normal'
              - value: disarmed
                icon: mdi:shield-check
                color: 'var(--kiosk-accent-disarmed)'
                styles:
                  card:
                    - background-color: 'rgba(86, 211, 100, 0.15)'
                    - border-left: '4px solid var(--kiosk-accent-disarmed)'
                  state: [{ color: 'var(--kiosk-accent-disarmed)' }]
              - value: arming
                icon: mdi:shield-half-full
                color: 'var(--kiosk-accent-armed)'
                styles:
                  card:
                    - background-color: 'rgba(227, 179, 65, 0.15)'
                    - border-left: '4px solid var(--kiosk-accent-armed)'
                  state: [{ color: 'var(--kiosk-accent-armed)' }]
              - operator: regex
                value: '^armed.*'
                icon: mdi:shield-lock
                color: 'var(--kiosk-accent-armed)'
                styles:
                  card:
                    - background-color: 'rgba(227, 179, 65, 0.15)'
                    - border-left: '4px solid var(--kiosk-accent-armed)'
                  state: [{ color: 'var(--kiosk-accent-armed)' }]
              - operator: regex
                value: '^(pending|triggered)$'
                icon: mdi:alarm-light
                color: 'var(--kiosk-accent-triggered)'
                styles:
                  card:
                    - background-color: 'rgba(248, 81, 73, 0.20)'
                    - border-left: '4px solid var(--kiosk-accent-triggered)'
                    - animation: 'pulse 1.2s infinite'
                  state: [{ color: 'var(--kiosk-accent-triggered)' }]
            styles:
              card:
                - border-radius: '10px'
                - border: 'none'
                - padding: '18px 24px'
                - background: 'var(--kiosk-bg-card)'
              name:
                - font-size: '18px'
                - font-weight: '500'
                - color: 'var(--kiosk-text-secondary)'
                - justify-self: start
              state:
                - font-size: '30px'
                - font-weight: '600'
                - text-transform: 'uppercase'
                - letter-spacing: '1.5px'
                - justify-self: start
              grid:
                - grid-template-areas: '"i n" "i s"'
                - grid-template-columns: 'min-content 1fr'
                - column-gap: '20px'
                - align-items: 'center'
            extra_styles: |
              @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.7; }
              }

          # --- Arm/disarm action row ---
          - type: grid
            columns: 3
            square: false
            cards:
              - &arm_btn
                type: custom:button-card
                name: Arm Home
                icon: mdi:shield-home
                show_name: true
                show_icon: true
                show_state: false
                size: 36%
                layout: vertical
                tap_action:
                  action: call-service
                  service: alarm_control_panel.alarm_arm_home
                  target: { entity_id: alarm_control_panel.home_alarm }
                styles:
                  card:
                    - background: 'var(--kiosk-bg-tile)'
                    - border-radius: '8px'
                    - border: 'none'
                    - padding: '12px 4px'
                  name:
                    - font-size: '13px'
                    - font-weight: '600'
                    - color: 'var(--kiosk-text-secondary)'
                    - text-transform: 'uppercase'
                    - letter-spacing: '1px'
                    - padding-top: '4px'
              - <<: *arm_btn
                name: Arm Away
                icon: mdi:shield-lock
                tap_action:
                  action: call-service
                  service: alarm_control_panel.alarm_arm_away
                  target: { entity_id: alarm_control_panel.home_alarm }
              - <<: *arm_btn
                name: Disarm
                icon: mdi:shield-off
                tap_action: { action: more-info, entity: alarm_control_panel.home_alarm }

          # --- Presence: meeting indicator + Chris/Rachel ---
          - type: heading
            heading: Presence
            heading_style: subtitle

          - type: custom:button-card
            entity: light.meeting_light
            name: Rachel
            show_name: true
            show_state: false
            show_label: true
            show_icon: true
            size: 45%
            tap_action:
              action: call-service
              service: switch.toggle
              target: { entity_id: switch.meeting_button_in_meeting }
            hold_action:
              action: more-info
              entity: switch.meeting_button_in_meeting
            triggers_update:
              - device_tracker.rachel_s_s23_presence
              - switch.meeting_button_in_meeting
            custom_fields:
              duration: >-
                [[[
                  if (states['device_tracker.rachel_s_s23_presence']?.state === 'not_home') return '';
                  const s = states['switch.meeting_button_in_meeting']?.state;
                  if (s !== 'on' && s !== 'off') return '';
                  const lc = new Date(states['switch.meeting_button_in_meeting']?.last_changed);
                  const diffMins = Math.floor((new Date() - lc) / 60000);
                  const rel = diffMins < 1 ? 'just now'
                    : diffMins < 60 ? diffMins + ' min'
                    : Math.floor(diffMins/60) + 'h ' + (diffMins%60) + 'm';
                  return 'for ' + rel;
                ]]]
            state:
              - operator: template
                value: |
                  [[[ return states['device_tracker.rachel_s_s23_presence'].state === 'not_home'; ]]]
                icon: mdi:account-off-outline
                color: 'var(--kiosk-text-tertiary)'
                label: Not Home
                styles:
                  card:
                    - background-color: 'var(--kiosk-bg-tile)'
                    - border-left: '4px solid var(--kiosk-text-tertiary)'
                  label: [{ color: 'var(--kiosk-text-tertiary)' }]
              - value: 'on'
                icon: mdi:account-voice
                color: 'var(--kiosk-accent-triggered)'
                label: In Meeting
                styles:
                  card:
                    - background-color: 'rgba(248, 81, 73, 0.20)'
                    - border-left: '4px solid var(--kiosk-accent-triggered)'
                    - animation: 'pulse 1.8s infinite'
                  label: [{ color: 'var(--kiosk-accent-triggered)' }]
              - value: 'off'
                icon: mdi:account-check
                color: 'var(--kiosk-accent-disarmed)'
                label: Available
                styles:
                  card:
                    - background-color: 'rgba(86, 211, 100, 0.12)'
                    - border-left: '4px solid var(--kiosk-accent-disarmed)'
                  label: [{ color: 'var(--kiosk-accent-disarmed)' }]
              - value: 'unavailable'
                icon: mdi:account-off
                color: 'var(--kiosk-text-tertiary)'
                label: Offline
                styles:
                  card:
                    - background-color: 'rgba(227, 179, 65, 0.10)'
                    - border-left: '4px solid var(--kiosk-accent-armed)'
                  label: [{ color: 'var(--kiosk-text-tertiary)' }]
            styles:
              card:
                - border-radius: '10px'
                - border: 'none'
                - padding: '14px 24px'
                - background: 'var(--kiosk-bg-card)'
              name:
                - font-size: '16px'
                - font-weight: '500'
                - color: 'var(--kiosk-text-secondary)'
                - justify-self: start
              label:
                - font-size: '22px'
                - font-weight: '600'
                - text-transform: 'uppercase'
                - letter-spacing: '1.5px'
                - justify-self: start
              custom_fields:
                duration:
                  - font-size: '13px'
                  - color: 'var(--kiosk-text-tertiary)'
                  - padding-top: '3px'
                  - justify-self: 'start'
              grid:
                - grid-template-areas: '"i n" "i l" "i duration"'
                - grid-template-columns: 'min-content 1fr'
                - column-gap: '20px'
                - align-items: 'center'

          - type: grid
            columns: 2
            square: false
            cards:
              - &presence_card
                type: custom:button-card
                entity: device_tracker.chris_phone_presence
                name: Chris
                show_name: true
                show_state: false
                show_label: true
                show_icon: true
                size: 45%
                tap_action: { action: more-info }
                state:
                  - value: 'home'
                    icon: mdi:account-tie
                    color: 'var(--kiosk-accent-disarmed)'
                    label: Home
                    styles:
                      card:
                        - background-color: 'rgba(86, 211, 100, 0.12)'
                        - border-left: '4px solid var(--kiosk-accent-disarmed)'
                      label: [{ color: 'var(--kiosk-accent-disarmed)' }]
                  - value: 'not_home'
                    icon: mdi:account-off-outline
                    color: 'var(--kiosk-text-tertiary)'
                    label: Away
                    styles:
                      card: [{ background-color: 'var(--kiosk-bg-tile)' }]
                      label: [{ color: 'var(--kiosk-text-tertiary)' }]
                styles:
                  card:
                    - border-radius: '10px'
                    - border: 'none'
                    - padding: '12px 20px'
                    - background: 'var(--kiosk-bg-card)'
                  name:
                    - font-size: '15px'
                    - font-weight: '500'
                    - color: 'var(--kiosk-text-secondary)'
                    - justify-self: start
                  label:
                    - font-size: '20px'
                    - font-weight: '600'
                    - text-transform: 'uppercase'
                    - letter-spacing: '1.5px'
                    - justify-self: start
                  grid:
                    - grid-template-areas: '"i n" "i l"'
                    - grid-template-columns: 'min-content 1fr'
                    - column-gap: '16px'
                    - align-items: 'center'
              - <<: *presence_card
                entity: device_tracker.rachel_s_s23_presence
                name: Rachel
                state:
                  - value: 'home'
                    icon: mdi:account-heart
                    color: 'var(--kiosk-accent-disarmed)'
                    label: Home
                    styles:
                      card:
                        - background-color: 'rgba(86, 211, 100, 0.12)'
                        - border-left: '4px solid var(--kiosk-accent-disarmed)'
                      label: [{ color: 'var(--kiosk-accent-disarmed)' }]
                  - value: 'not_home'
                    icon: mdi:account-off-outline
                    color: 'var(--kiosk-text-tertiary)'
                    label: Away
                    styles:
                      card: [{ background-color: 'var(--kiosk-bg-tile)' }]
                      label: [{ color: 'var(--kiosk-text-tertiary)' }]

      # ===== c5 top ===== MEDIA ==================================
      - type: grid
        cards:
          - type: heading
            heading: Media
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - &media_tile
                type: custom:mini-media-player
                entity: media_player.master_bedroom
                name: Master Bedroom
                artwork: full-cover-fit
                info: scroll
                hide: { source: true, sound_mode: true, shuffle: true, runtime: true, name: false }
                tap_action: { action: more-info }
                card_mod:
                  style: |
                    ha-card {
                      min-height: 120px;
                      border-radius: 6px;
                      {% set members = state_attr(config.entity, 'group_members') or [] %}
                      {% if members | length > 1 and members[0] != config.entity %}
                        opacity: 0.5;
                        filter: grayscale(0.4);
                      {% endif %}
                    }
                    {% set members = state_attr(config.entity, 'group_members') or [] %}
                    {% if members | length > 1 and members[0] != config.entity %}
                    ha-card::after {
                      content: "↳ {{ state_attr(members[0], 'friendly_name') or 'leader' }}";
                      position: absolute; bottom: 6px; left: 8px;
                      font-size: 10px; color: white;
                      text-shadow: 0 1px 2px rgba(0,0,0,0.7); z-index: 10;
                    }
                    {% endif %}
              - <<: *media_tile
                entity: media_player.office
                name: Office
              - <<: *media_tile
                entity: media_player.kitchen
                name: Kitchen
              - <<: *media_tile
                entity: media_player.dining_room
                name: Dining Room
              - <<: *media_tile
                entity: media_player.roam_2
                name: Roam 2
          - type: custom:button-card
            entity: media_player.play_room_tv
            name: Play Room TV
            show_name: true
            show_state: true
            show_icon: true
            size: 26%
            layout: icon_name_state
            tap_action: { action: more-info }
            state:
              - value: 'off'
                icon: mdi:television-off
                color: 'var(--kiosk-text-tertiary)'
              - value: 'unavailable'
                icon: mdi:television-off
                color: 'var(--kiosk-text-tertiary)'
                styles:
                  card: [{ background-color: 'rgba(227, 179, 65, 0.10)' }]
              - operator: default
                icon: mdi:television
                color: 'var(--kiosk-accent-media)'
                styles:
                  card: [{ background-color: 'rgba(88, 166, 255, 0.12)' }]
            styles:
              card: [{ background: 'var(--kiosk-bg-tile)' }, { border-radius: '8px' }, { border: 'none' }, { padding: '12px 16px' }]
              name: [{ font-size: '15px' }, { font-weight: '500' }, { color: 'var(--kiosk-text-secondary)' }, { justify-self: 'start' }]
              state: [{ font-size: '16px' }, { font-weight: '600' }, { text-transform: 'uppercase' }, { justify-self: 'start' }]
              grid: [{ grid-template-areas: '"i n" "i s"' }, { grid-template-columns: 'min-content 1fr' }, { column-gap: '14px' }]

      # ===== c1 bottom ===== OPENINGS (doors/garage/motion) ======
      # Defines &door_sensor, &garage_cover, &motion_sensor.
      - type: grid
        cards:
          - type: heading
            heading: Openings
            heading_style: title
          - type: grid
            columns: 3
            square: false
            cards:
              - &door_sensor
                type: custom:button-card
                entity: binary_sensor.main_panel_front_door
                name: Front
                show_name: true
                show_state: true
                show_icon: true
                size: 46%
                tap_action: { action: more-info }
                state:
                  - value: 'on'
                    icon: mdi:door-open
                    color: 'var(--kiosk-accent-triggered)'
                    styles:
                      card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--kiosk-accent-triggered)' }]
                  - value: 'off'
                    icon: mdi:door-closed
                    color: 'var(--kiosk-accent-sensors)'
                    styles:
                      card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                  - operator: default
                    icon: mdi:door
                    color: 'var(--kiosk-text-tertiary)'
                    styles:
                      card: [{ background-color: 'rgba(227, 179, 65, 0.10)' }]
                styles:
                  card:
                    - background: 'var(--kiosk-bg-tile)'
                    - border-radius: '8px'
                    - border: 'none'
                    - padding: '14px 12px'
                    - min-height: '146px'
                  name:
                    - font-size: '16px'
                    - font-weight: '500'
                    - color: 'var(--kiosk-text-secondary)'
                    - padding-top: '6px'
                  state:
                    - font-size: '18px'
                    - text-transform: 'uppercase'
                    - font-weight: '600'
                    - letter-spacing: '0.5px'
                    - padding-top: '2px'
              - <<: *door_sensor
                entity: binary_sensor.main_panel_sliding_door
                name: Sliding
                state:
                  - value: 'on'
                    icon: mdi:door-sliding-open
                    color: 'var(--kiosk-accent-triggered)'
                    styles:
                      card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--kiosk-accent-triggered)' }]
                  - value: 'off'
                    icon: mdi:door-sliding
                    color: 'var(--kiosk-accent-sensors)'
                    styles:
                      card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                  - operator: default
                    icon: mdi:door-sliding
                    color: 'var(--kiosk-text-tertiary)'
                    styles:
                      card: [{ background-color: 'rgba(227, 179, 65, 0.10)' }]
              - <<: *door_sensor
                entity: binary_sensor.main_panel_garage_door
                name: Garage Entry
              - <<: *door_sensor
                entity: binary_sensor.main_panel_basement_door
                name: Basement
              - &garage_cover
                type: custom:button-card
                entity: cover.garage_door_1_door
                name: Garage 1
                show_name: true
                show_state: true
                show_icon: true
                size: 46%
                tap_action: { action: more-info }
                state:
                  - value: 'closed'
                    icon: mdi:garage
                    color: 'var(--kiosk-accent-sensors)'
                    styles:
                      card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                  - value: 'open'
                    icon: mdi:garage-open-variant
                    color: 'var(--kiosk-accent-triggered)'
                    styles:
                      card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--kiosk-accent-triggered)' }]
                  - operator: regex
                    value: '^(opening|closing)$'
                    icon: mdi:garage-alert-variant
                    color: 'var(--kiosk-accent-lights)'
                    styles:
                      card: [{ background-color: 'rgba(227, 179, 65, 0.18)' }, { animation: 'pulse 1s infinite' }]
                styles:
                  card:
                    - background: 'var(--kiosk-bg-tile)'
                    - border-radius: '8px'
                    - border: 'none'
                    - padding: '14px 12px'
                    - min-height: '146px'
                  name:
                    - font-size: '16px'
                    - font-weight: '500'
                    - color: 'var(--kiosk-text-secondary)'
                    - padding-top: '6px'
                  state:
                    - font-size: '18px'
                    - text-transform: 'uppercase'
                    - font-weight: '600'
                    - letter-spacing: '0.5px'
                    - padding-top: '2px'
              - <<: *garage_cover
                entity: cover.garage_door_2_door
                name: Garage 2
              - &motion_sensor
                type: custom:button-card
                entity: binary_sensor.main_panel_family_room_motion
                name: Family
                show_name: true
                show_state: true
                show_icon: true
                size: 46%
                tap_action: { action: more-info }
                state:
                  - value: 'on'
                    icon: mdi:motion-sensor
                    color: 'var(--kiosk-accent-triggered)'
                    styles:
                      card: [{ background-color: 'rgba(248, 81, 73, 0.20)' }, { animation: 'pulse 1s infinite' }]
                  - value: 'off'
                    icon: mdi:motion-sensor-off
                    color: 'var(--kiosk-accent-sensors)'
                    styles:
                      card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                  - operator: default
                    icon: mdi:motion-sensor-off
                    color: 'var(--kiosk-text-tertiary)'
                    styles:
                      card: [{ background-color: 'rgba(227, 179, 65, 0.10)' }]
                styles:
                  card:
                    - background: 'var(--kiosk-bg-tile)'
                    - border-radius: '8px'
                    - border: 'none'
                    - padding: '14px 12px'
                    - min-height: '146px'
                  name:
                    - font-size: '16px'
                    - font-weight: '500'
                    - color: 'var(--kiosk-text-secondary)'
                    - padding-top: '6px'
                  state:
                    - font-size: '18px'
                    - text-transform: 'uppercase'
                    - font-weight: '600'
                    - letter-spacing: '0.5px'
                    - padding-top: '2px'
              - <<: *motion_sensor
                entity: binary_sensor.main_panel_office_motion
                name: Office

      # ===== c2 bottom ===== HALLWAY & OUTDOOR LIGHTS (defines &mlight)
      - type: grid
        cards:
          - type: heading
            heading: Hallways & Outdoor
            heading_style: title
          - type: heading
            heading: Hallways
            heading_style: subtitle
          - type: grid
            columns: 2
            square: false
            cards:
              - &mlight
                type: custom:button-card
                entity: light.downstairs_hallway
                name: Down Hall
                show_name: true
                show_state: true
                show_icon: true
                size: 48%
                tap_action: { action: toggle }
                hold_action: { action: more-info }
                state_display: |
                  [[[
                    if (entity.state === 'unavailable') return 'N/A';
                    if (entity.state !== 'on') return 'OFF';
                    const b = entity.attributes.brightness;
                    return b ? Math.round(b / 2.55) + '%' : 'ON';
                  ]]]
                state:
                  - value: 'on'
                    icon: mdi:lightbulb
                    color: 'var(--kiosk-accent-lights)'
                  - value: 'unavailable'
                    icon: mdi:lightbulb-alert-outline
                    color: 'var(--kiosk-text-tertiary)'
                  - operator: default
                    icon: mdi:lightbulb-outline
                    color: 'var(--kiosk-text-tertiary)'
                styles:
                  card:
                    - border-radius: '8px'
                    - border: 'none'
                    - padding: '14px 12px'
                    - min-height: '150px'
                    - background-color: |
                        [[[
                          if (entity.state !== 'on') return 'var(--kiosk-bg-tile)';
                          const b = entity.attributes.brightness || 255;
                          return `rgba(227, 179, 65, ${(0.10 + 0.24 * (b / 255)).toFixed(2)})`;
                        ]]]
                    - border-left: |
                        [[[ return entity.state === 'on'
                             ? '4px solid var(--kiosk-accent-lights)'
                             : '4px solid transparent'; ]]]
                  name:
                    - font-size: '15px'
                    - font-weight: '500'
                    - color: 'var(--kiosk-text-secondary)'
                    - padding-top: '6px'
                  state:
                    - font-size: '17px'
                    - font-weight: '600'
                    - letter-spacing: '0.5px'
                    - padding-top: '2px'
              - <<: *mlight
                entity: light.upstairs_hallway_light
                name: Up Hall
          - type: heading
            heading: Outdoor
            heading_style: subtitle
          - type: grid
            columns: 3
            square: false
            cards:
              - <<: *mlight
                entity: light.front_door
                name: Front
              - <<: *mlight
                entity: light.front_lantern
                name: Lantern
              - <<: *mlight
                entity: light.garage_front
                name: Garage Fr
              - <<: *mlight
                entity: light.garage_side
                name: Garage Sd
              - <<: *mlight
                entity: light.shed
                name: Shed

      # ===== c3 bottom ===== OFFICE LIGHTS =======================
      - type: grid
        cards:
          - type: heading
            heading: Office
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - <<: *mlight
                entity: light.bookcase_lamp
                name: Bookcase
              - <<: *mlight
                entity: light.corner_lamp
                name: Corner
              - <<: *mlight
                entity: light.door_lamp
                name: Door
              - <<: *mlight
                entity: light.table_lamp
                name: Table
              - <<: *mlight
                entity: light.desk_lamp_2
                name: Desk
              - <<: *mlight
                entity: light.desk_lamp_2_2
                name: Desk 2

      # ===== c4 bottom ===== HOME STATUS (defines &status_tile) ==
      # Environment + safety indicators in the shared tile language:
      # leak detectors (green dry / red wet), UPS, floor temps
      # (warm/cool tinted), humidity.
      - type: grid
        cards:
          - type: heading
            heading: Home Status
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - &status_tile
                type: custom:button-card
                entity: binary_sensor.hvac_pump_leak
                name: HVAC Pump
                show_name: true
                show_state: true
                show_icon: true
                size: 46%
                tap_action: { action: more-info }
                state_display: |
                  [[[ return entity.state === 'on' ? 'WET'
                       : entity.state === 'unavailable' ? 'N/A' : 'DRY'; ]]]
                state:
                  - value: 'on'
                    icon: mdi:water-alert
                    color: 'var(--kiosk-accent-triggered)'
                    styles:
                      card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--kiosk-accent-triggered)' }]
                  - value: 'off'
                    icon: mdi:water-check
                    color: 'var(--kiosk-accent-sensors)'
                    styles:
                      card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                  - operator: default
                    icon: mdi:water-off
                    color: 'var(--kiosk-text-tertiary)'
                    styles:
                      card: [{ background-color: 'rgba(227, 179, 65, 0.10)' }]
                styles:
                  card:
                    - background: 'var(--kiosk-bg-tile)'
                    - border-radius: '8px'
                    - border: 'none'
                    - padding: '14px 12px'
                    - min-height: '150px'
                  name:
                    - font-size: '15px'
                    - font-weight: '500'
                    - color: 'var(--kiosk-text-secondary)'
                    - padding-top: '6px'
                  state:
                    - font-size: '18px'
                    - font-weight: '600'
                    - text-transform: 'uppercase'
                    - letter-spacing: '0.5px'
                    - padding-top: '2px'
              - <<: *status_tile
                entity: binary_sensor.water_heater_leak
                name: Water Htr
              - <<: *status_tile
                entity: sensor.cyberpower_battery_charge
                name: UPS
                icon: mdi:battery-charging
                state_display: |
                  [[[ const v = parseFloat(entity.state); return isNaN(v) ? '—' : Math.round(v) + '%'; ]]]
                state:
                  - operator: template
                    value: '[[[ return parseFloat(entity.state) <= 20; ]]]'
                    icon: mdi:battery-alert
                    color: 'var(--kiosk-accent-triggered)'
                    styles:
                      card: [{ background-color: 'rgba(248, 81, 73, 0.15)' }]
                  - operator: default
                    icon: mdi:battery-charging
                    color: 'var(--kiosk-accent-sensors)'
                    styles:
                      card: [{ background-color: 'var(--kiosk-bg-tile)' }]
              - <<: *status_tile
                entity: sensor.upstairs_temperature
                name: Up Temp
                icon: mdi:thermometer
                state_display: |
                  [[[ const v = parseFloat(entity.state); return isNaN(v) ? '—' : Math.round(v) + '°'; ]]]
                state:
                  - operator: template
                    value: '[[[ return parseFloat(entity.state) >= 76; ]]]'
                    icon: mdi:thermometer-high
                    color: 'var(--kiosk-accent-climate)'
                    styles:
                      card: [{ background-color: 'rgba(240, 136, 62, 0.14)' }]
                  - operator: template
                    value: '[[[ return parseFloat(entity.state) <= 68; ]]]'
                    icon: mdi:thermometer-low
                    color: 'var(--kiosk-accent-media)'
                    styles:
                      card: [{ background-color: 'rgba(88, 166, 255, 0.14)' }]
                  - operator: default
                    icon: mdi:thermometer
                    color: 'var(--kiosk-accent-sensors)'
                    styles:
                      card: [{ background-color: 'var(--kiosk-bg-tile)' }]
              - <<: *status_tile
                entity: sensor.downstairs_temperature
                name: Down Temp
                icon: mdi:thermometer
                state_display: |
                  [[[ const v = parseFloat(entity.state); return isNaN(v) ? '—' : Math.round(v) + '°'; ]]]
                state:
                  - operator: template
                    value: '[[[ return parseFloat(entity.state) >= 76; ]]]'
                    icon: mdi:thermometer-high
                    color: 'var(--kiosk-accent-climate)'
                    styles:
                      card: [{ background-color: 'rgba(240, 136, 62, 0.14)' }]
                  - operator: template
                    value: '[[[ return parseFloat(entity.state) <= 68; ]]]'
                    icon: mdi:thermometer-low
                    color: 'var(--kiosk-accent-media)'
                    styles:
                      card: [{ background-color: 'rgba(88, 166, 255, 0.14)' }]
                  - operator: default
                    icon: mdi:thermometer
                    color: 'var(--kiosk-accent-sensors)'
                    styles:
                      card: [{ background-color: 'var(--kiosk-bg-tile)' }]
              - <<: *status_tile
                entity: sensor.upstairs_humidity
                name: Up Humid
                icon: mdi:water-percent
                state_display: |
                  [[[ const v = parseFloat(entity.state); return isNaN(v) ? '—' : Math.round(v) + '%'; ]]]
                state:
                  - operator: default
                    icon: mdi:water-percent
                    color: 'var(--kiosk-accent-media)'
                    styles:
                      card: [{ background-color: 'rgba(88, 166, 255, 0.10)' }]

      # ===== c5 bottom ===== FAMILY & KITCHEN LIGHTS =============
      - type: grid
        cards:
          - type: heading
            heading: Lights
            heading_style: title
          - type: heading
            heading: Family Room
            heading_style: subtitle
          - type: grid
            columns: 2
            square: false
            cards:
              - <<: *mlight
                entity: light.family_room_2
                name: Family
              - <<: *mlight
                entity: light.floor_lamp_composite
                name: Floor
          - type: heading
            heading: Kitchen
            heading_style: subtitle
          - type: grid
            columns: 3
            square: false
            cards:
              - <<: *mlight
                entity: light.kitchen_island
                name: Island
              - <<: *mlight
                entity: light.kitchen_main
                name: Kitchen
              - <<: *mlight
                entity: light.kitchen_table
                name: Table
