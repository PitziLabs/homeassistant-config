                          content: "↳ {{ state_attr(members[0], 'friendly_name') or 'leader' }}";
                          position: absolute;
                          bottom: 6px;
                          left: 8px;
                          font-size: 10px;
                          color: white;
                          text-shadow: 0 1px 2px rgba(0,0,0,0.7);
                          z-index: 10;
