# =================================================================
# KIOSK DASHBOARD — V2 (foundation rebuild)
# Dedicated 1920x1080 home-state display for pve2 -> TCL TV.
#
# URL: http://<ha-host>:8123/kiosk/home
#
# Architecture (research-driven rebuild):
#   - View type: custom:grid-layout (NOT panel:true wrapper)
#   - Cell wrappers: custom:mod-card for ha-card host + height: 100% cascade
#   - Typed cards per panel (no html-template-card):
#       Climate  -> custom:better-thermostat-ui-card (HACS install required)
#       Sensors  -> custom:button-card with state blocks
#       Lights   -> custom:mushroom-light-card grid (one per light)
#       Media    -> custom:mini-media-player with artwork: full-cover-fit
#       Weather  -> custom:clock-weather-card
#       Alarm    -> custom:button-card hero with pulse animation
# =================================================================

kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_sidebar: true
  user_settings:
    - users:
        - "Kiosk"
      kiosk: true

views:
  - title: Home
    path: home
    icon: mdi:monitor-dashboard
    theme: Kiosk Polish
    type: custom:grid-layout
    layout:
      height: 100vh
      margin: 0
      padding: 8px
      overflow: hidden
      grid-gap: 8px
      grid-template-columns: 1fr 1fr 1.4fr 1fr
      grid-template-rows: 240px 1fr
      grid-template-areas: |
        "weather weather alarm   meeting"
        "climate sensors lights  media"
    cards:

      # ============================================================
      # WEATHER + CLOCK + FORECAST (top-left, spans 2 cols)
      # Single clock-weather-card with forecast_rows: 3 spans the full
      # 2-col weather cell. The card includes its own current-conditions
      # row above the forecast, so the previous right-side mushroom hero
      # was redundant and has been removed. Top row height was bumped
      # from 200px → 240px to give the forecast strip room to breathe.
      # ============================================================
      - type: custom:mod-card
        view_layout: { grid-area: weather }
        card_mod:
          style: |
            ha-card {
              height: 100%;
              overflow: hidden;
              border-radius: 10px;
              border: none;
              background: linear-gradient(135deg, #1e3a5f 0%, #0f1f3a 100%);
            }
        card:
          type: custom:clock-weather-card
          entity: weather.forecast_home
          forecast_rows: 3
          time_format: 12
          date_pattern: "EEEE, MMM d"
          card_mod:
            style: |
              ha-card {
                background: transparent !important;
                border: none !important;
                box-shadow: none !important;
                height: 100%;
              }

      # ============================================================
      # ALARM HERO (top-right, spans 2 cols)
      # ============================================================
      - type: custom:mod-card
        view_layout: { grid-area: alarm }
        card_mod:
          style: |
            ha-card {
              height: 100%;
              border-radius: 10px;
              border: none;
              background: transparent;
            }
        card:
          type: custom:button-card
          entity: alarm_control_panel.home_alarm
          name: Home Alarm
          show_name: true
          show_state: true
          show_icon: true
          size: 55%
          layout: icon_name_state
          tap_action: { action: none }
          hold_action: { action: none }
          state:
            - value: disarmed
              icon: mdi:shield-check
              color: 'var(--kiosk-accent-disarmed)'
              styles:
                card:
                  - background-color: 'rgba(86, 211, 100, 0.15)'
                  - border-left: '4px solid var(--kiosk-accent-disarmed)'
                state: [{ color: 'var(--kiosk-accent-disarmed)' }]
            - value: arming
              icon: mdi:shield-half-full
              color: 'var(--kiosk-accent-armed)'
              styles:
                card:
                  - background-color: 'rgba(227, 179, 65, 0.15)'
                  - border-left: '4px solid var(--kiosk-accent-armed)'
                state: [{ color: 'var(--kiosk-accent-armed)' }]
            - operator: regex
              value: '^armed.*'
              icon: mdi:shield-lock
              color: 'var(--kiosk-accent-armed)'
              styles:
                card:
                  - background-color: 'rgba(227, 179, 65, 0.15)'
                  - border-left: '4px solid var(--kiosk-accent-armed)'
                state: [{ color: 'var(--kiosk-accent-armed)' }]
            - operator: regex
              value: '^(pending|triggered)$'
              icon: mdi:alarm-light
              color: 'var(--kiosk-accent-triggered)'
              styles:
                card:
                  - background-color: 'rgba(248, 81, 73, 0.20)'
                  - border-left: '4px solid var(--kiosk-accent-triggered)'
                  - animation: 'pulse 1.2s infinite'
                state: [{ color: 'var(--kiosk-accent-triggered)' }]
          styles:
            card:
              - height: '100%'
              - border-radius: '10px'
              - border: 'none'
              - padding: '20px 28px'
              - background: 'var(--kiosk-bg-card)'
            name:
              - font-size: '20px'
              - font-weight: '500'
              - color: 'var(--kiosk-text-secondary)'
              - justify-self: start
            state:
              - font-size: '38px'
              - font-weight: '600'
              - text-transform: 'uppercase'
              - letter-spacing: '2px'
              - justify-self: start
            grid:
              - grid-template-areas: '"i n" "i s"'
              - grid-template-columns: 'min-content 1fr'
              - grid-template-rows: '1fr 1fr'
              - column-gap: '24px'
              - row-gap: '4px'
              - align-items: 'center'
              - align-content: 'center'
              - height: '100%'
          extra_styles: |
            @keyframes pulse {
              0%, 100% { opacity: 1; transform: scale(1); }
              50% { opacity: 0.7; transform: scale(0.99); }
            }

      # ============================================================
      # MEETING INDICATOR (top-right corner — Rachel's office light)
      # State-driven by light.meeting_light, which the meeting.yaml
      # automations drive red when switch.meeting_button_in_meeting is on.
      # ============================================================
      - type: custom:mod-card
        view_layout: { grid-area: meeting }
        card_mod:
          style: |
            ha-card {
              height: 100%;
              border-radius: 10px;
              border: none;
              background: transparent;
            }
        card:
          type: custom:button-card
          entity: light.meeting_light
          name: Rachel
          show_name: true
          show_state: false
          show_label: true
          show_icon: true
          size: 60%
          tap_action: { action: none }
          hold_action: { action: none }
          state:
            - value: 'on'
              icon: mdi:account-voice
              color: 'var(--kiosk-accent-triggered)'
              label: In Meeting
              styles:
                card:
                  - background-color: 'rgba(248, 81, 73, 0.20)'
                  - border-left: '4px solid var(--kiosk-accent-triggered)'
                  - animation: 'pulse 1.8s infinite'
                label: [{ color: 'var(--kiosk-accent-triggered)' }]
            - value: 'off'
              icon: mdi:account-check
              color: 'var(--kiosk-accent-disarmed)'
              label: Available
              styles:
                card:
                  - background-color: 'rgba(86, 211, 100, 0.12)'
                  - border-left: '4px solid var(--kiosk-accent-disarmed)'
                label: [{ color: 'var(--kiosk-accent-disarmed)' }]
            - value: 'unavailable'
              icon: mdi:account-off
              color: 'var(--kiosk-text-tertiary)'
              label: Offline
              styles:
                label: [{ color: 'var(--kiosk-text-tertiary)' }]
          styles:
            card:
              - height: '100%'
              - border-radius: '10px'
              - border: 'none'
              - padding: '20px 24px'
              - background: 'var(--kiosk-bg-card)'
            name:
              - font-size: '20px'
              - font-weight: '500'
              - color: 'var(--kiosk-text-secondary)'
              - justify-self: start
              - align-self: end
            label:
              - font-size: '28px'
              - font-weight: '600'
              - text-transform: 'uppercase'
              - letter-spacing: '1.5px'
              - justify-self: start
              - align-self: start
            grid:
              - grid-template-areas: '"i n" "i l"'
              - grid-template-columns: 'min-content 1fr'
              - grid-template-rows: '1fr 1fr'
              - column-gap: '20px'
              - row-gap: '4px'
              - align-items: 'stretch'
              - height: '100%'

      # ============================================================
      # CLIMATE COLUMN
      # ============================================================
      - type: custom:mod-card
        view_layout: { grid-area: climate }
        card_mod:
          style: |
            ha-card {
              height: 100%;
              border-radius: 10px;
              border: none;
              border-top: 3px solid var(--kiosk-accent-climate);
              padding: 8px;
              background: var(--kiosk-bg-card);
              display: flex;
              flex-direction: column;
              gap: 8px;
            }
            ha-card > * { flex: 1 1 auto; min-height: 0; }
        card:
          type: vertical-stack
          cards:
            - type: custom:mod-card
              card_mod:
                style: |
                  ha-card {
                    height: 100%;
                    background: var(--kiosk-bg-tile);
                    border-radius: 8px;
                    border: none;
                    padding: 8px 8px 12px 8px;
                    display: flex;
                    flex-direction: column;
                  }
                  ha-card > * { flex: 1 1 auto; min-height: 0; }
              card:
                type: vertical-stack
                cards:
                  # Active mode (heat / cool / heat_cool): show the BTUI dial
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: climate.upstairs
                        state_not: 'off'
                    card:
                      type: custom:better-thermostat-ui-card
                      entity: climate.upstairs
                      name: Upstairs
                      humidity: sensor.upstairs_humidity
                      disable_buttons: true
                      disable_menu: true
                      card_mod:
                        style: |
                          ha-card { background: transparent !important; border: none !important; box-shadow: none !important; }

                  # Standby (HVAC off, e.g. spring/fall): show current temp prominently
                  # so the dial doesn't render a phantom 0.0 setpoint.
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: climate.upstairs
                        state: 'off'
                    card:
                      type: custom:mushroom-template-card
                      entity: climate.upstairs
                      primary: |-
                        {% set t = state_attr(config.entity, "current_temperature") %}
                        {{ (t | round(1)) if t is not none else "—" }}°F
                      secondary: "Upstairs · Standby"
                      icon: mdi:thermometer
                      icon_color: blue-grey
                      fill_container: true
                      tap_action: { action: none }
                      card_mod:
                        style: |
                          ha-card {
                            background: transparent !important;
                            border: none !important;
                            box-shadow: none !important;
                            padding: 24px 16px !important;
                            display: flex !important;
                            align-items: center !important;
                            justify-content: center !important;
                            height: 100% !important;
                          }
                          mushroom-card { width: 100%; }
                          mushroom-state-info {
                            --card-primary-font-size: 48px;
                            --card-primary-font-weight: 600;
                            --card-primary-color: var(--kiosk-text-primary);
                            --card-primary-line-height: 1.1;
                            --card-secondary-font-size: 14px;
                            --card-secondary-font-weight: 500;
                            --card-secondary-color: var(--kiosk-text-secondary);
                            --card-secondary-line-height: 1.3;
                          }
                          mushroom-shape-icon {
                            --icon-size: 56px;
                            --shape-color: rgba(255, 255, 255, 0.06);
                          }

                  - type: custom:mushroom-chips-card
                    alignment: center
                    chips:
                      - type: template
                        icon: mdi:water-percent
                        icon_color: blue
                        content: '{{ states("sensor.upstairs_humidity") | round }}%'
                      - type: template
                        icon: mdi:thermometer
                        icon_color: amber
                        content: |-
                          {% set t = state_attr("climate.upstairs", "temperature") %}
                          {% set tl = state_attr("climate.upstairs", "target_temp_low") %}
                          {% set th = state_attr("climate.upstairs", "target_temp_high") %}
                          {% if t is not none %}Set {{ t | round }}°
                          {% elif tl is not none and th is not none %}{{ tl | round }}–{{ th | round }}°
                          {% else %}—{% endif %}
                      - type: template
                        icon: |-
                          {% set a = state_attr("climate.upstairs", "hvac_action") %}
                          {% if a == "heating" %}mdi:fire
                          {% elif a == "cooling" %}mdi:snowflake
                          {% elif a == "idle" %}mdi:thermometer-check
                          {% else %}mdi:thermometer-off
                          {% endif %}
                        icon_color: |-
                          {% set a = state_attr("climate.upstairs", "hvac_action") %}
                          {% if a == "heating" %}red
                          {% elif a == "cooling" %}blue
                          {% else %}grey
                          {% endif %}
                        content: |-
                          {% set a = state_attr("climate.upstairs", "hvac_action") %}
                          {{ a | title if a else "Off" }}
                    card_mod:
                      style: |
                        ha-card {
                          background: transparent !important;
                          border: none !important;
                          box-shadow: none !important;
                          padding: 0 !important;
                        }

            - type: custom:mod-card
              card_mod:
                style: |
                  ha-card {
                    height: 100%;
                    background: var(--kiosk-bg-tile);
                    border-radius: 8px;
                    border: none;
                    padding: 8px 8px 12px 8px;
                    display: flex;
                    flex-direction: column;
                  }
                  ha-card > * { flex: 1 1 auto; min-height: 0; }
              card:
                type: vertical-stack
                cards:
                  # Active mode (heat / cool / heat_cool): show the BTUI dial
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: climate.downstairs
                        state_not: 'off'
                    card:
                      type: custom:better-thermostat-ui-card
                      entity: climate.downstairs
                      name: Downstairs
                      humidity: sensor.downstairs_humidity
                      disable_buttons: true
                      disable_menu: true
                      card_mod:
                        style: |
                          ha-card { background: transparent !important; border: none !important; box-shadow: none !important; }

                  # Standby (HVAC off, e.g. spring/fall): show current temp prominently
                  # so the dial doesn't render a phantom 0.0 setpoint.
                  - type: conditional
                    conditions:
                      - condition: state
                        entity: climate.downstairs
                        state: 'off'
                    card:
                      type: custom:mushroom-template-card
                      entity: climate.downstairs
                      primary: |-
                        {% set t = state_attr(config.entity, "current_temperature") %}
                        {{ (t | round(1)) if t is not none else "—" }}°F
                      secondary: "Downstairs · Standby"
                      icon: mdi:thermometer
                      icon_color: blue-grey
                      fill_container: true
                      tap_action: { action: none }
                      card_mod:
                        style: |
                          ha-card {
                            background: transparent !important;
                            border: none !important;
                            box-shadow: none !important;
                            padding: 24px 16px !important;
                            display: flex !important;
                            align-items: center !important;
                            justify-content: center !important;
                            height: 100% !important;
                          }
                          mushroom-card { width: 100%; }
                          mushroom-state-info {
                            --card-primary-font-size: 48px;
                            --card-primary-font-weight: 600;
                            --card-primary-color: var(--kiosk-text-primary);
                            --card-primary-line-height: 1.1;
                            --card-secondary-font-size: 14px;
                            --card-secondary-font-weight: 500;
                            --card-secondary-color: var(--kiosk-text-secondary);
                            --card-secondary-line-height: 1.3;
                          }
                          mushroom-shape-icon {
                            --icon-size: 56px;
                            --shape-color: rgba(255, 255, 255, 0.06);
                          }

                  - type: custom:mushroom-chips-card
                    alignment: center
                    chips:
                      - type: template
                        icon: mdi:water-percent
                        icon_color: blue
                        content: '{{ states("sensor.downstairs_humidity") | round }}%'
                      - type: template
                        icon: mdi:thermometer
                        icon_color: amber
                        content: |-
                          {% set t = state_attr("climate.downstairs", "temperature") %}
                          {% set tl = state_attr("climate.downstairs", "target_temp_low") %}
                          {% set th = state_attr("climate.downstairs", "target_temp_high") %}
                          {% if t is not none %}Set {{ t | round }}°
                          {% elif tl is not none and th is not none %}{{ tl | round }}–{{ th | round }}°
                          {% else %}—{% endif %}
                      - type: template
                        icon: |-
                          {% set a = state_attr("climate.downstairs", "hvac_action") %}
                          {% if a == "heating" %}mdi:fire
                          {% elif a == "cooling" %}mdi:snowflake
                          {% elif a == "idle" %}mdi:thermometer-check
                          {% else %}mdi:thermometer-off
                          {% endif %}
                        icon_color: |-
                          {% set a = state_attr("climate.downstairs", "hvac_action") %}
                          {% if a == "heating" %}red
                          {% elif a == "cooling" %}blue
                          {% else %}grey
                          {% endif %}
                        content: |-
                          {% set a = state_attr("climate.downstairs", "hvac_action") %}
                          {{ a | title if a else "Off" }}
                    card_mod:
                      style: |
                        ha-card {
                          background: transparent !important;
                          border: none !important;
                          box-shadow: none !important;
                          padding: 0 !important;
                        }

      # ============================================================
      # SENSORS COLUMN — 8 sensors in 2x4 grid
      # (4 doors + 2 garage covers + 2 motion)
      # ============================================================
      - type: custom:mod-card
        view_layout: { grid-area: sensors }
        card_mod:
          style: |
            ha-card {
              height: 100%;
              border-radius: 10px;
              border: none;
              border-top: 3px solid var(--kiosk-accent-sensors);
              padding: 8px;
              background: var(--kiosk-bg-card);
            }
        card:
          type: grid
          columns: 2
          square: false
          card_mod:
            style: |
              :host {
                height: 100%;
                display: block;
              }
              #root {
                height: 100%;
                grid-template-rows: repeat(4, 1fr) !important;
                gap: 6px !important;
              }
              /* Stretch each grid child so the inner button-card's
                 height: 100% has a parent to fill against. Without
                 this, hui-card collapses to its content height and
                 leaves dead space below each row. */
              #root > * {
                height: 100% !important;
                min-height: 0 !important;
              }
          cards:
            # === Door sensors (binary_sensor; on=open=red, off=closed=green) ===
            - type: custom:button-card
              entity: binary_sensor.main_panel_front_door
              name: Front
              show_name: true
              show_state: true
              show_icon: true
              size: 70%
              tap_action: { action: none }
              state:
                - value: 'on'
                  icon: mdi:door-open
                  color: 'var(--kiosk-accent-triggered)'
                  styles:
                    card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--kiosk-accent-triggered)' }]
                - value: 'off'
                  icon: mdi:door-closed
                  color: 'var(--kiosk-accent-sensors)'
                  styles:
                    card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                - value: 'unavailable'
                  icon: mdi:door
                  color: 'var(--kiosk-text-tertiary)'
                - value: 'unknown'
                  icon: mdi:door
                  color: 'var(--kiosk-text-tertiary)'
              styles:
                card:
                  - height: '100%'
                  - background: 'var(--kiosk-bg-tile)'
                  - border-radius: '8px'
                  - border: 'none'
                  - padding: '12px'
                name:
                  - font-size: '18px'
                  - font-weight: '500'
                  - color: 'var(--kiosk-text-secondary)'
                  - padding-top: '8px'
                state:
                  - font-size: '22px'
                  - text-transform: 'uppercase'
                  - font-weight: '600'
                  - letter-spacing: '0.5px'
                  - padding-top: '4px'

            - type: custom:button-card
              entity: binary_sensor.main_panel_sliding_door
              name: Sliding
              show_name: true
              show_state: true
              show_icon: true
              size: 70%
              tap_action: { action: none }
              state:
                - value: 'on'
                  icon: mdi:door-sliding-open
                  color: 'var(--kiosk-accent-triggered)'
                  styles:
                    card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--kiosk-accent-triggered)' }]
                - value: 'off'
                  icon: mdi:door-sliding
                  color: 'var(--kiosk-accent-sensors)'
                  styles:
                    card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                - value: 'unavailable'
                  icon: mdi:door-sliding
                  color: 'var(--kiosk-text-tertiary)'
                - value: 'unknown'
                  icon: mdi:door-sliding
                  color: 'var(--kiosk-text-tertiary)'
              styles:
                card:
                  - height: '100%'
                  - background: 'var(--kiosk-bg-tile)'
                  - border-radius: '8px'
                  - border: 'none'
                  - padding: '12px'
                name:
                  - font-size: '18px'
                  - font-weight: '500'
                  - color: 'var(--kiosk-text-secondary)'
                  - padding-top: '8px'
                state:
                  - font-size: '22px'
                  - text-transform: 'uppercase'
                  - font-weight: '600'
                  - letter-spacing: '0.5px'
                  - padding-top: '4px'

            - type: custom:button-card
              entity: binary_sensor.main_panel_garage_door
              name: Garage Entry
              show_name: true
              show_state: true
              show_icon: true
              size: 70%
              tap_action: { action: none }
              state:
                - value: 'on'
                  icon: mdi:door-open
                  color: 'var(--kiosk-accent-triggered)'
                  styles:
                    card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--kiosk-accent-triggered)' }]
                - value: 'off'
                  icon: mdi:door-closed
                  color: 'var(--kiosk-accent-sensors)'
                  styles:
                    card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                - value: 'unavailable'
                  icon: mdi:door
                  color: 'var(--kiosk-text-tertiary)'
                - value: 'unknown'
                  icon: mdi:door
                  color: 'var(--kiosk-text-tertiary)'
              styles:
                card:
                  - height: '100%'
                  - background: 'var(--kiosk-bg-tile)'
                  - border-radius: '8px'
                  - border: 'none'
                  - padding: '12px'
                name:
                  - font-size: '18px'
                  - font-weight: '500'
                  - color: 'var(--kiosk-text-secondary)'
                  - padding-top: '8px'
                state:
                  - font-size: '22px'
                  - text-transform: 'uppercase'
                  - font-weight: '600'
                  - letter-spacing: '0.5px'
                  - padding-top: '4px'

            - type: custom:button-card
              entity: binary_sensor.basement_kitchen_door
              name: Basement
              show_name: true
              show_state: true
              show_icon: true
              size: 70%
              tap_action: { action: none }
              state:
                - value: 'on'
                  icon: mdi:door-open
                  color: 'var(--kiosk-accent-triggered)'
                  styles:
                    card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--kiosk-accent-triggered)' }]
                - value: 'off'
                  icon: mdi:door-closed
                  color: 'var(--kiosk-accent-sensors)'
                  styles:
                    card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                - value: 'unavailable'
                  icon: mdi:door
                  color: 'var(--kiosk-text-tertiary)'
                - value: 'unknown'
                  icon: mdi:door
                  color: 'var(--kiosk-text-tertiary)'
              styles:
                card:
                  - height: '100%'
                  - background: 'var(--kiosk-bg-tile)'
                  - border-radius: '8px'
                  - border: 'none'
