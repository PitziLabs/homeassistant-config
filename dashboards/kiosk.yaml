# =================================================================
# KIOSK DASHBOARD — V2 (foundation rebuild)
# Dedicated 1920x1080 home-state display for pve2 -> TCL TV.
#
# URL: http://<ha-host>:8123/kiosk/home
#
# Architecture (research-driven rebuild):
#   - View type: custom:grid-layout (NOT panel:true wrapper)
#   - Cell wrappers: custom:mod-card for ha-card host + height: 100% cascade
#   - Typed cards per panel (no html-template-card):
#       Climate  -> custom:better-thermostat-ui-card (HACS install required)
#       Sensors  -> custom:button-card with state blocks
#       Lights   -> custom:mushroom-light-card grid (one per light)
#       Media    -> custom:mini-media-player with artwork: full-cover-fit
#       Weather  -> custom:clock-weather-card
#       Alarm    -> custom:button-card hero with pulse animation
# =================================================================

kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_sidebar: true
  user_settings:
    - users:
        - "Kiosk"
      kiosk: true

views:
  - title: Home
    path: home
    icon: mdi:monitor-dashboard
    theme: Kiosk Polish
    type: custom:grid-layout
    layout:
      height: 100vh
      margin: 0
      padding: 8px
      grid-gap: 8px
      grid-template-columns: 1fr 1fr 1.4fr 1fr
      grid-template-rows: 130px 1fr
      grid-template-areas: |
        "weather weather alarm   alarm"
        "climate sensors lights  media"
    cards:

      # ============================================================
      # WEATHER + CLOCK (top-left, spans 2 cols)
      # ============================================================
      - type: custom:mod-card
        view_layout: { grid-area: weather }
        card_mod:
          style: |
            ha-card {
              height: 100%;
              border-radius: 10px;
              border: none;
              background: linear-gradient(135deg, #1e3a5f 0%, #0f1f3a 100%);
            }
        card:
          type: custom:clock-weather-card
          entity: weather.forecast_home
          forecast_rows: 2
          time_format: 12
          date_pattern: "EEEE, MMM d"

      # ============================================================
      # ALARM HERO (top-right, spans 2 cols)
      # ============================================================
      - type: custom:mod-card
        view_layout: { grid-area: alarm }
        card_mod:
          style: |
            ha-card {
              height: 100%;
              border-radius: 10px;
              border: none;
              background: transparent;
            }
        card:
          type: custom:button-card
          entity: alarm_control_panel.home_alarm
          name: Home Alarm
          show_name: true
          show_state: true
          show_icon: true
          size: 35%
          layout: icon_name_state
          tap_action: { action: none }
          hold_action: { action: none }
          state:
            - value: disarmed
              icon: mdi:shield-check
              color: 'var(--kiosk-accent-disarmed)'
              styles:
                card:
                  - background-color: 'rgba(86, 211, 100, 0.15)'
                  - border-left: '4px solid var(--kiosk-accent-disarmed)'
                state: [{ color: 'var(--kiosk-accent-disarmed)' }]
            - value: arming
              icon: mdi:shield-half-full
              color: 'var(--kiosk-accent-armed)'
              styles:
                card:
                  - background-color: 'rgba(227, 179, 65, 0.15)'
                  - border-left: '4px solid var(--kiosk-accent-armed)'
                state: [{ color: 'var(--kiosk-accent-armed)' }]
            - operator: regex
              value: '^armed.*'
              icon: mdi:shield-lock
              color: 'var(--kiosk-accent-armed)'
              styles:
                card:
                  - background-color: 'rgba(227, 179, 65, 0.15)'
                  - border-left: '4px solid var(--kiosk-accent-armed)'
                state: [{ color: 'var(--kiosk-accent-armed)' }]
            - operator: regex
              value: '^(pending|triggered)$'
              icon: mdi:alarm-light
              color: 'var(--kiosk-accent-triggered)'
              styles:
                card:
                  - background-color: 'rgba(248, 81, 73, 0.20)'
                  - border-left: '4px solid var(--kiosk-accent-triggered)'
                  - animation: 'pulse 1.2s infinite'
                state: [{ color: 'var(--kiosk-accent-triggered)' }]
          styles:
            card:
              - height: '100%'
              - border-radius: '10px'
              - border: 'none'
              - padding: '20px 28px'
              - background: 'var(--kiosk-bg-card)'
            name:
              - font-size: '20px'
              - font-weight: '500'
              - color: 'var(--kiosk-text-secondary)'
              - justify-self: start
            state:
              - font-size: '38px'
              - font-weight: '600'
              - text-transform: 'uppercase'
              - letter-spacing: '2px'
              - justify-self: start
            grid:
              - grid-template-areas: '"i n" "i s"'
              - grid-template-columns: 'min-content 1fr'
              - grid-template-rows: 'min-content min-content'
              - column-gap: '24px'
              - row-gap: '4px'
              - align-items: 'center'
          extra_styles: |
            @keyframes pulse {
              0%, 100% { opacity: 1; transform: scale(1); }
              50% { opacity: 0.7; transform: scale(0.99); }
            }

      # ============================================================
      # CLIMATE COLUMN
      # ============================================================
      - type: custom:mod-card
        view_layout: { grid-area: climate }
        card_mod:
          style: |
            ha-card {
              height: 100%;
              border-radius: 10px;
              border: none;
              border-top: 3px solid var(--kiosk-accent-climate);
              padding: 8px;
              background: var(--kiosk-bg-card);
              display: flex;
              flex-direction: column;
              gap: 8px;
            }
            ha-card > * { flex: 1 1 auto; min-height: 0; }
            ha-card > *:last-child { flex: 0 0 70px; }
        card:
          type: vertical-stack
          cards:
            - type: custom:better-thermostat-ui-card
              entity: climate.upstairs
              name: Upstairs
              humidity: sensor.upstairs_humidity
              disable_buttons: true
              disable_menu: true
              card_mod:
                style: |
                  ha-card { height: 100%; background: var(--kiosk-bg-tile); border-radius: 8px; border: none; }

            - type: custom:better-thermostat-ui-card
              entity: climate.downstairs
              name: Downstairs
              humidity: sensor.downstairs_humidity
              disable_buttons: true
              disable_menu: true
              card_mod:
                style: |
                  ha-card { height: 100%; background: var(--kiosk-bg-tile); border-radius: 8px; border: none; }

            - type: custom:button-card
              entity: climate.heatstorm_infrared_heater
              name: Office Heater
              show_name: true
              show_state: true
              show_icon: true
              size: 30%
              layout: icon_name_state
              tap_action: { action: none }
              state:
                - value: 'off'
                  icon: mdi:radiator-off
                  color: 'var(--kiosk-text-tertiary)'
                - value: 'heat'
                  icon: mdi:radiator
                  color: 'var(--kiosk-accent-climate)'
                  styles:
                    card: [{ background-color: 'rgba(240, 136, 62, 0.12)' }]
              styles:
                card:
                  - height: '70px'
                  - background: 'var(--kiosk-bg-tile)'
                  - border-radius: '8px'
                  - border: 'none'
                  - padding: '8px 14px'
                name: [{ font-size: '11px' }, { color: 'var(--kiosk-text-secondary)' }, { justify-self: 'start' }]
                state: [{ font-size: '14px' }, { font-weight: '500' }, { text-transform: 'capitalize' }, { justify-self: 'start' }]
                grid:
                  - grid-template-areas: '"i n" "i s"'
                  - grid-template-columns: 'min-content 1fr'
                  - column-gap: '12px'

      # ============================================================
      # SENSORS COLUMN — 10 sensors in 2x5 grid
      # ============================================================
      - type: custom:mod-card
        view_layout: { grid-area: sensors }
        card_mod:
          style: |
            ha-card {
              height: 100%;
              border-radius: 10px;
              border: none;
              border-top: 3px solid var(--kiosk-accent-sensors);
              padding: 8px;
              background: var(--kiosk-bg-card);
            }
        card:
          type: grid
          columns: 2
          square: false
          cards:
            # === Door sensors (binary_sensor; on=open=red, off=closed=green) ===
            - type: custom:button-card
              entity: binary_sensor.main_panel_front_door
              name: Front
              show_name: true
              show_state: true
              show_icon: true
              size: 50%
              tap_action: { action: none }
              state:
                - value: 'on'
                  icon: mdi:door-open
                  color: 'var(--kiosk-accent-triggered)'
                  styles:
                    card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--kiosk-accent-triggered)' }]
                - value: 'off'
                  icon: mdi:door-closed
                  color: 'var(--kiosk-accent-sensors)'
                  styles:
                    card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                - value: 'unavailable'
                  icon: mdi:door
                  color: 'var(--kiosk-text-tertiary)'
                - value: 'unknown'
                  icon: mdi:door
                  color: 'var(--kiosk-text-tertiary)'
              styles:
                card: [{ height: '100%' }, { background: 'var(--kiosk-bg-tile)' }, { border-radius: '8px' }, { border: 'none' }, { padding: '6px' }]
                name: [{ font-size: '12px' }, { color: 'var(--kiosk-text-secondary)' }, { padding-top: '4px' }]
                state: [{ font-size: '11px' }, { text-transform: 'uppercase' }, { font-weight: '500' }]

            - type: custom:button-card
              entity: binary_sensor.main_panel_sliding_door
              name: Sliding
              show_name: true
              show_state: true
              show_icon: true
              size: 50%
              tap_action: { action: none }
              state:
                - value: 'on'
                  icon: mdi:door-sliding-open
                  color: 'var(--kiosk-accent-triggered)'
                  styles:
                    card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--kiosk-accent-triggered)' }]
                - value: 'off'
                  icon: mdi:door-sliding
                  color: 'var(--kiosk-accent-sensors)'
                  styles:
                    card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                - value: 'unavailable'
                  icon: mdi:door-sliding
                  color: 'var(--kiosk-text-tertiary)'
                - value: 'unknown'
                  icon: mdi:door-sliding
                  color: 'var(--kiosk-text-tertiary)'
              styles:
                card: [{ height: '100%' }, { background: 'var(--kiosk-bg-tile)' }, { border-radius: '8px' }, { border: 'none' }, { padding: '6px' }]
                name: [{ font-size: '12px' }, { color: 'var(--kiosk-text-secondary)' }, { padding-top: '4px' }]
                state: [{ font-size: '11px' }, { text-transform: 'uppercase' }, { font-weight: '500' }]

            - type: custom:button-card
              entity: binary_sensor.main_panel_garage_door
              name: Garage Entry
              show_name: true
              show_state: true
              show_icon: true
              size: 50%
              tap_action: { action: none }
              state:
                - value: 'on'
                  icon: mdi:door-open
                  color: 'var(--kiosk-accent-triggered)'
                  styles:
                    card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--kiosk-accent-triggered)' }]
                - value: 'off'
                  icon: mdi:door-closed
                  color: 'var(--kiosk-accent-sensors)'
                  styles:
                    card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                - value: 'unavailable'
                  icon: mdi:door
                  color: 'var(--kiosk-text-tertiary)'
                - value: 'unknown'
                  icon: mdi:door
                  color: 'var(--kiosk-text-tertiary)'
              styles:
                card: [{ height: '100%' }, { background: 'var(--kiosk-bg-tile)' }, { border-radius: '8px' }, { border: 'none' }, { padding: '6px' }]
                name: [{ font-size: '12px' }, { color: 'var(--kiosk-text-secondary)' }, { padding-top: '4px' }]
                state: [{ font-size: '11px' }, { text-transform: 'uppercase' }, { font-weight: '500' }]

            - type: custom:button-card
              entity: binary_sensor.basement_kitchen_door
              name: Basement
              show_name: true
              show_state: true
              show_icon: true
              size: 50%
              tap_action: { action: none }
              state:
                - value: 'on'
                  icon: mdi:door-open
                  color: 'var(--kiosk-accent-triggered)'
                  styles:
                    card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--kiosk-accent-triggered)' }]
                - value: 'off'
                  icon: mdi:door-closed
                  color: 'var(--kiosk-accent-sensors)'
                  styles:
                    card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                - value: 'unavailable'
                  icon: mdi:door
                  color: 'var(--kiosk-text-tertiary)'
                - value: 'unknown'
                  icon: mdi:door
                  color: 'var(--kiosk-text-tertiary)'
              styles:
                card: [{ height: '100%' }, { background: 'var(--kiosk-bg-tile)' }, { border-radius: '8px' }, { border: 'none' }, { padding: '6px' }]
                name: [{ font-size: '12px' }, { color: 'var(--kiosk-text-secondary)' }, { padding-top: '4px' }]
                state: [{ font-size: '11px' }, { text-transform: 'uppercase' }, { font-weight: '500' }]

            - type: custom:button-card
              entity: binary_sensor.z_wave_door_window_sensor
              name: Hannah
              show_name: true
              show_state: true
              show_icon: true
              size: 50%
              tap_action: { action: none }
              state:
                - value: 'on'
                  icon: mdi:door-open
                  color: 'var(--kiosk-accent-triggered)'
                  styles:
                    card: [{ background-color: 'rgba(248, 81, 73, 0.18)' }, { border: '2px solid var(--kiosk-accent-triggered)' }]
                - value: 'off'
                  icon: mdi:door-closed
                  color: 'var(--kiosk-accent-sensors)'
                  styles:
                    card: [{ background-color: 'rgba(86, 211, 100, 0.10)' }]
                - value: 'unavailable'
                  icon: mdi:door
                  color: 'var(--kiosk-text-tertiary)'
                - value: 'unknown'
                  icon: mdi:door
                  color: 'var(--kiosk-text-tertiary)'
              styles:
                card: [{ height: '100%' }, { background: 'var(--kiosk-bg-tile)' }, { border-radius: '8px' }, { border: 'none' }, { padding: '6px' }]
                name: [{ font-size: '12px' }, { color: 'var(--kiosk-text-secondary)' }, { padding-top: '4px' }]
                state: [{ font-size: '11px' }, { text-transform: 'uppercase' }, { font-weight: '500' }]

            - type: custom:button-card
              entity: binary_sensor.z_wave_door_window_sensor_2
              name: Jacob
              show_name: true
              show_state: true
              show_icon: true
              size: 50%
