      # ============================================================
      # MEDIA COLUMN — 6 Sonos cells (2x3) + TV row (60px)
      # ============================================================
      - type: custom:mod-card
        view_layout: { grid-area: media }
        card_mod:
          style: |
            ha-card {
              height: 100%;
              border-radius: 10px;
              border: none;
              border-top: 3px solid var(--kiosk-accent-media);
              padding: 8px;
              background: var(--kiosk-bg-card);
            }
        card:
          type: vertical-stack
          cards:
            - type: grid
              columns: 2
              square: false
              cards:
                - type: custom:mini-media-player
                  entity: media_player.master_bedroom
                  name: Master Bedroom
                  artwork: full-cover-fit
                  info: scroll
                  hide: { power: true, volume: true, source: true, progress: true, controls: true, play_pause: true, next: true, prev: true, runtime: true, shuffle: true, sound_mode: true, name: false }
                  tap_action: { action: none }
                  card_mod:
                    style: |
                      ha-card {
                        height: 100%;
                        border-radius: 6px;
                        border: none;
                        overflow: hidden;
                        {% set members = state_attr(config.entity, 'group_members') or [] %}
                        {% if members | length > 1 and members[0] != config.entity %}
                          opacity: 0.5;
                          filter: grayscale(0.4);
                        {% endif %}
                      }
                      {% set members = state_attr(config.entity, 'group_members') or [] %}
                      {% if members | length > 1 and members[0] != config.entity %}
                      ha-card::after {
                        content: "↳ {{ state_attr(members[0], 'friendly_name') or 'leader' }}";
                        position: absolute;
                        bottom: 6px;
                        left: 8px;
                        font-size: 10px;
                        color: white;
                        text-shadow: 0 1px 2px rgba(0,0,0,0.7);
                        z-index: 10;
                      }
                      {% endif %}

