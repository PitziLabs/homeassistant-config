                      - color: 'var(--kiosk-text-secondary)'
                      - padding-top: '8px'
                    state:
                      - font-size: '22px'
                      - text-transform: 'uppercase'
                      - font-weight: '600'
                      - letter-spacing: '0.5px'
                      - padding-top: '4px'

                - type: custom:button-card
                  entity: binary_sensor.main_panel_sliding_door
