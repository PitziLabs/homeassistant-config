title: UPS
path: ups-detail
subview: true
icon: mdi:power-plug
type: panel
cards:
  - type: vertical-stack
    cards:

      # Hero
      - type: custom:mushroom-template-card
        primary: CyberPower CP1500PFCLCDa
        secondary: >
          {% set st = states('sensor.cyberpower_status_data') %}
          {% set label = 'Online' if st == 'OL' else ('On battery' if st == 'OB' else st) %}
          NUT master on neptune (usbhid-ups) · PVE×5 wired as secondaries · {{ label }}
        icon: mdi:power-plug
        icon_color: >
          {% set st = states('sensor.cyberpower_status_data') %}
          {% if st == 'OB' %}red
          {% elif st != 'OL' %}amber
          {% else %}green{% endif %}
        entity: sensor.cyberpower_status_data
        tap_action: { action: none }

      # Live state. Runtime-remaining card removed in #334 — the NUT
      # integration registers sensor.cyberpower_battery_runtime but
      # disables it by default for this UPS model (not consistently
      # reported); re-enabling it just leaves it `unavailable`. Battery
      # charge + load are sufficient signals for the dashboard.
      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.cyberpower_battery_charge
            name: Battery
            unit: '%'
            min: 0
            max: 100
            needle: true
            severity: { green: 50, yellow: 20, red: 0 }
          - type: gauge
            entity: sensor.cyberpower_load
            name: Load
            unit: '%'
            min: 0
            max: 100
            needle: true
            severity: { green: 0, yellow: 50, red: 75 }

      # Power lines
      - type: entities
        title: Power
        show_header_toggle: false
        entities:
          - entity: sensor.cyberpower_input_voltage
            name: Input voltage
          - entity: sensor.cyberpower_output_voltage
            name: Output voltage
          - entity: sensor.cyberpower_status
            name: Raw status
          - entity: sensor.cyberpower_status_data
            name: Status (text)

      # Notes
      - type: markdown
        content: >
          **Topology:** CyberPower CP1500PFCLCDa connected USB to neptune
          (NAS), which runs `nut-server` as the NUT master. The five PVE
          nodes run `upsmon` as secondaries against neptune. NUT
          passwords live at `/root/nut-secrets/` on neptune. HA's NUT
          integration provides these sensors + a power-event automation.
