title: HAOS
path: haos-detail
subview: true
icon: mdi:home-assistant
type: panel
cards:
  - type: vertical-stack
    cards:

      # Hero
      - type: custom:mushroom-template-card
        primary: Home Assistant OS
        secondary: >
          {% if is_state('binary_sensor.haos_17_1_status', 'on') %}
            VM 100 · pinned to pve3 by USB-passthrough radios (Z-Wave / Zigbee / Matter)
          {% else %}VM 100 · DOWN{% endif %}
        icon: mdi:home-assistant
        icon_color: >
          {% if is_state('binary_sensor.haos_17_1_status', 'on') %}green{% else %}red{% endif %}
        entity: binary_sensor.haos_17_1_status
        tap_action: { action: none }

      # Live state
      - type: grid
        columns: 3
        square: false
        cards:
          - type: gauge
            entity: sensor.haos_17_1_cpu_usage
            name: CPU
            min: 0
            max: 100
            needle: true
            severity: { green: 0, yellow: 50, red: 80 }
          - type: gauge
            entity: sensor.haos_17_1_memory_usage_percentage
            name: Memory
            min: 0
            max: 100
            needle: true
            severity: { green: 0, yellow: 70, red: 85 }
          - type: gauge
            entity: sensor.haos_17_1_disk_usage
            name: Disk
            min: 0
            max: 100
            needle: true
            severity: { green: 0, yellow: 60, red: 80 }

      # Network + uptime
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.haos_17_1_network_input
            name: Network in
            icon: mdi:download-network
          - type: custom:mushroom-entity-card
            entity: sensor.haos_17_1_network_output
            name: Network out
            icon: mdi:upload-network
          - type: custom:mushroom-template-card
            primary: Uptime
            secondary: >
              {% set s = states('sensor.haos_17_1_uptime') | int(-1) %}
              {% if s < 0 %}—
              {% elif s >= 86400 %}{{ (s // 86400) }}d {{ ((s % 86400) // 3600) }}h
              {% elif s >= 3600 %}{{ (s // 3600) }}h {{ ((s % 3600) // 60) }}m
              {% else %}{{ (s // 60) }}m{% endif %}
            icon: mdi:clock-outline
            entity: sensor.haos_17_1_uptime
            tap_action: { action: more-info }

      # Note + actions
      - type: markdown
        content: >
          **DR constraint:** USB passthrough for hardwired smart-home radios
          (`usb0: host=303a:831a`, `usb1: host=303a:4001`) pins this VM to pve3.
          `qm migrate` does not preserve USB passthrough. Plan outages for
          pve3 maintenance; live HA-style failover via `ha-manager` is
          impossible without physically moving the radios first.

      # Power actions (hold-to-fire, no accidental taps)
      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: button.haos_17_1_restart
            name: Restart VM
            icon: mdi:restart
            tap_action: { action: none }
            hold_action: { action: call-service, service: button.press, target: { entity_id: button.haos_17_1_restart } }
          - type: custom:mushroom-entity-card
            entity: button.haos_17_1_shut_down
            name: Shut down
            icon: mdi:power
            tap_action: { action: none }
            hold_action: { action: call-service, service: button.press, target: { entity_id: button.haos_17_1_shut_down } }
          - type: custom:mushroom-entity-card
            entity: button.haos_17_1_start
            name: Start
            icon: mdi:play-circle
            tap_action: { action: none }
            hold_action: { action: call-service, service: button.press, target: { entity_id: button.haos_17_1_start } }
          - type: custom:mushroom-entity-card
            entity: button.haos_17_1_create_snapshot
            name: Snapshot
            icon: mdi:camera
            tap_action: { action: none }
            hold_action: { action: call-service, service: button.press, target: { entity_id: button.haos_17_1_create_snapshot } }
