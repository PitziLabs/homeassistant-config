            card:
              type: tile
              entity: light.play_room_2
              name: Light 2
          - type: conditional
            conditions:
              - condition: state
                entity: light.play_room_3
                state: "on"
            card:
              type: tile
              entity: light.play_room_3
              name: Light 3
          - type: conditional
            conditions:
              - condition: state
                entity: light.play_room_4
                state: "on"
            card:
              type: tile
              entity: light.play_room_4
              name: Light 4

      # --- Family Room ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Family Room"
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.family_room_lights_on
                state: "off"
            card:
              type: markdown
              content: "All off"
          - type: conditional
            conditions:
              - condition: state
                entity: light.family_room
                state: "on"
            card:
              type: tile
              entity: light.family_room
              name: Main
          - type: conditional
            conditions:
              - condition: state
                entity: light.family_room_2
                state: "on"
            card:
              type: tile
              entity: light.family_room_2
              name: Light 2
          - type: conditional
            conditions:
              - condition: state
                entity: switch.family_room_outlets
                state: "on"
            card:
              type: tile
              entity: switch.family_room_outlets
              name: Outlets
              icon: mdi:power-plug
          - type: conditional
            conditions:
              - condition: state
                entity: light.floor_lamp
                state: "on"
            card:
              type: tile
              entity: light.floor_lamp
              name: Floor Lamp

      # --- Entry & Upstairs ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Entry & Upstairs"
          - type: conditional
            conditions:
              - condition: state
