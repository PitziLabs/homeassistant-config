                    info: false
                  info: scroll
                  tap_action:
                    action: none
                  card_mod:
                    style: |
                      ha-card {
                        height: 230px;
                        overflow: hidden;
                        background: {{ '#14283f' if is_state('media_player.roam_2','playing') else '#1a1f27' }};
                        border: none;
