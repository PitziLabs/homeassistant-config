  # =================================================================
  # KIOSK VIEW — 65" 1080p wall display, Noctis Kiosk theme
  # 6×7 hard-placed grid, every card via view_layout: grid-area
  # No vertical-stack column wrappers; no auto-flow within columns
  # URL: /dashboard-home/kiosk
  # =================================================================
  - title: Kiosk
    path: kiosk
    theme: Noctis Kiosk
    type: custom:grid-layout
    icon: mdi:monitor
    layout:
      grid-template-columns: repeat(6, 1fr)
      grid-template-rows: auto auto 1fr 1fr 1fr 1fr auto
      grid-template-areas: |
        "infra     infra     weather   weather   alarm     sonos"
        "infra     infra     weather   weather   sensors   sonos"
        "kitchen   pipeline  pipeline  pipeline  exterior  sonos"
        "playroom  pipeline  pipeline  pipeline  exterior  sonos"
        "family    weight    weight    weight    exterior  sonos"
        "office    weight    weight    weight    exterior  sonos"
        "office    infostrip infostrip infostrip exterior  sonos"
      margin: 0
      padding: 8px
      grid-gap: 8px
      height: 100vh
    cards:
      # ============================================================
      # INFRA — 6 radialBar gauges, 3×2 internal grid (grid area: infra)
      # yaxis min/max lives under apex_config.yaxis — not plotOptions.radialBar
      # ============================================================
      - type: custom:mod-card
        view_layout:
          grid-area: infra
        card_mod:
          style: |
            ha-card {
              border: 1px solid var(--divider-color);
              border-radius: 16px;
              padding: 8px;
              background: rgba(255, 255, 255, 0.015);
              box-shadow: none;
            }
        card:
          type: vertical-stack
          cards:
            - type: custom:mushroom-title-card
              title: Infra
            - type: grid
              columns: 3
              square: false
              cards:
                - type: custom:apexcharts-card
                  chart_type: radialBar
                  header:
                    show: true
                    show_states: true
                    colorize_states: true
                  series:
                    - entity: sensor.ugreen_nas_cpu_usage
                      name: NAS CPU
                      color_threshold:
                        - value: 0
                          color: "#4caf50"
                        - value: 50
                          color: "#ffc107"
                        - value: 80
                          color: "#f44336"
                  apex_config:
                    chart:
                      background: transparent
                      toolbar:
                        show: false
                      sparkline:
                        enabled: true
                    plotOptions:
                      radialBar:
                        hollow:
                          size: "55%"
                        track:
                          background: "rgba(255, 255, 255, 0.08)"
                        dataLabels:
                          value:
                            fontSize: "14px"
                            formatter: "EVAL:function(val) { return Math.round(val) + '%'; }"
                          name:
                            fontSize: "11px"
                    yaxis:
                      min: 0
                      max: 100
                - type: custom:apexcharts-card
                  chart_type: radialBar
                  header:
                    show: true
                    show_states: true
                    colorize_states: true
                  series:
                    - entity: sensor.ugreen_nas_cpu_temperature
                      name: NAS Temp
                      color_threshold:
                        - value: 0
                          color: "#4caf50"
                        - value: 55
                          color: "#ffc107"
                        - value: 70
                          color: "#f44336"
                  apex_config:
                    chart:
                      background: transparent
                      toolbar:
                        show: false
                      sparkline:
                        enabled: true
                    plotOptions:
                      radialBar:
                        hollow:
                          size: "55%"
                        track:
                          background: "rgba(255, 255, 255, 0.08)"
                        dataLabels:
                          value:
                            fontSize: "14px"
                            formatter: "EVAL:function(val) { return Math.round(val) + '°C'; }"
                          name:
                            fontSize: "11px"
                    yaxis:
                      min: 20
                      max: 90
                - type: custom:apexcharts-card
                  chart_type: radialBar
                  header:
                    show: true
                    show_states: true
                    colorize_states: true
                  series:
                    - entity: sensor.pve_memory_usage_percentage
                      name: pve Mem
                      color_threshold:
                        - value: 0
                          color: "#4caf50"
                        - value: 75
                          color: "#ffc107"
                        - value: 90
                          color: "#f44336"
                  apex_config:
                    chart:
                      background: transparent
                      toolbar:
                        show: false
                      sparkline:
                        enabled: true
                    plotOptions:
                      radialBar:
                        hollow:
                          size: "55%"
                        track:
                          background: "rgba(255, 255, 255, 0.08)"
                        dataLabels:
                          value:
                            fontSize: "14px"
                            formatter: "EVAL:function(val) { return Math.round(val) + '%'; }"
                          name:
                            fontSize: "11px"
                    yaxis:
                      min: 0
                      max: 100
                - type: custom:apexcharts-card
                  chart_type: radialBar
                  header:
                    show: true
                    show_states: true
                    colorize_states: true
                  series:
                    - entity: sensor.haos_17_1_memory_usage_percentage
                      name: HAOS Mem
                      color_threshold:
                        - value: 0
                          color: "#4caf50"
                        - value: 70
                          color: "#ffc107"
                        - value: 85
                          color: "#f44336"
                  apex_config:
                    chart:
                      background: transparent
                      toolbar:
                        show: false
                      sparkline:
                        enabled: true
                    plotOptions:
                      radialBar:
                        hollow:
                          size: "55%"
                        track:
                          background: "rgba(255, 255, 255, 0.08)"
                        dataLabels:
                          value:
                            fontSize: "14px"
                            formatter: "EVAL:function(val) { return Math.round(val) + '%'; }"
                          name:
                            fontSize: "11px"
                    yaxis:
                      min: 0
                      max: 100
                - type: custom:apexcharts-card
                  chart_type: radialBar
                  header:
                    show: true
                    show_states: true
                    colorize_states: true
                  series:
                    - entity: sensor.grafana_stack_memory_usage_percentage
                      name: Grafana Mem
                      color_threshold:
                        - value: 0
                          color: "#4caf50"
                        - value: 70
                          color: "#ffc107"
                        - value: 85
                          color: "#f44336"
                  apex_config:
                    chart:
                      background: transparent
                      toolbar:
                        show: false
                      sparkline:
                        enabled: true
                    plotOptions:
                      radialBar:
                        hollow:
                          size: "55%"
                        track:
                          background: "rgba(255, 255, 255, 0.08)"
                        dataLabels:
                          value:
                            fontSize: "14px"
                            formatter: "EVAL:function(val) { return Math.round(val) + '%'; }"
                          name:
                            fontSize: "11px"
                    yaxis:
                      min: 0
                      max: 100
                # NAS Volume: data_generator computes used/total*100 from raw byte sensors.
                # Returns empty series if either sensor is unavailable (gauge stays blank).
                - type: custom:apexcharts-card
                  chart_type: radialBar
                  header:
                    show: true
                    show_states: true
                    colorize_states: true
                  series:
                    - entity: sensor.ugreen_nas_pool_1_volume_1_used_size_raw
                      name: NAS Vol
                      color_threshold:
                        - value: 0
                          color: "#4caf50"
                        - value: 70
                          color: "#ffc107"
                        - value: 85
                          color: "#f44336"
                      data_generator: |
                        const totalSensor = hass.states['sensor.ugreen_nas_pool_1_volume_1_total_size_raw'];
                        if (!totalSensor) return [];
                        const used = parseFloat(entity.state);
                        const total = parseFloat(totalSensor.state);
                        if (!isFinite(used) || !isFinite(total) || total === 0) return [];
                        return [[Date.now(), used / total * 100]];
                  apex_config:
                    chart:
                      background: transparent
                      toolbar:
                        show: false
                      sparkline:
                        enabled: true
                    plotOptions:
                      radialBar:
                        hollow:
                          size: "55%"
                        track:
                          background: "rgba(255, 255, 255, 0.08)"
                        dataLabels:
                          value:
                            fontSize: "14px"
                            formatter: "EVAL:function(val) { return Math.round(val) + '%'; }"
                          name:
                            fontSize: "11px"
                    yaxis:
                      min: 0
                      max: 100

      # ============================================================
      # WEATHER — clock-weather-card (grid area: weather)
      # ============================================================
      - type: custom:clock-weather-card
        entity: weather.forecast_home
        forecast_rows: 3
        hide_clock: false
        hide_date: true
        hide_today_section: false
        hide_forecast_section: false
        weather_icon_type: line
        animated_icon: true
        time_format: 12
        view_layout:
          grid-area: weather

      # ============================================================
      # ALARM — Mushroom alarm card, glow shadow values scaled ~50%
      # Other states, keyframes, and colors unchanged from prior impl
      # (grid area: alarm)
      # ============================================================
      - type: custom:mushroom-alarm-control-panel-card
        entity: alarm_control_panel.home_alarm
        name: Home Alarm
        states:
          - armed_away
          - armed_home
        layout: horizontal
        show_keypad: false
        view_layout:
          grid-area: alarm
        card_mod:
          style: |
            ha-card {
              {% set state = states('alarm_control_panel.home_alarm') %}
              transition: background 0.6s ease, box-shadow 0.6s ease;
              will-change: box-shadow, background;
              {% if state == 'armed_home' %}
                background: rgba(76, 175, 80, 0.06) !important;
                animation: alarm-pulse-green 3.0s ease-in-out infinite;
              {% elif state == 'armed_away' %}
                background: rgba(79, 195, 247, 0.06) !important;
                animation: alarm-pulse-blue 2.0s ease-in-out infinite;
              {% elif state == 'arming' %}
                background: rgba(255, 193, 7, 0.08) !important;
                animation: alarm-pulse-amber 1.0s ease-in-out infinite;
              {% elif state == 'pending' %}
                background: rgba(244, 67, 54, 0.10) !important;
                animation: alarm-pulse-red-pending 0.7s ease-in-out infinite;
              {% elif state == 'triggered' %}
                background: rgba(244, 67, 54, 0.14) !important;
                animation: alarm-pulse-red-triggered 0.4s ease-in-out infinite;
              {% endif %}
            }
            @keyframes alarm-pulse-green {
              0%, 100% { box-shadow: 0 0 4px rgba(76, 175, 80, 0.3); }
              50% { box-shadow: 0 0 16px rgba(76, 175, 80, 0.9); }
            }
            @keyframes alarm-pulse-blue {
              0%, 100% { box-shadow: 0 0 4px rgba(79, 195, 247, 0.3); }
              50% { box-shadow: 0 0 20px rgba(79, 195, 247, 0.9); }
            }
            @keyframes alarm-pulse-amber {
              0%, 100% { box-shadow: 0 0 4px rgba(255, 193, 7, 0.3); }
              50% { box-shadow: 0 0 16px rgba(255, 193, 7, 0.9); }
            }
            @keyframes alarm-pulse-red-pending {
              0%, 100% { box-shadow: 0 0 4px rgba(244, 67, 54, 0.3); }
              50% { box-shadow: 0 0 24px rgba(244, 67, 54, 0.9); }
            }
            @keyframes alarm-pulse-red-triggered {
              0%, 100% { box-shadow: 0 0 4px rgba(244, 67, 54, 0.3); }
              50% { box-shadow: 0 0 30px rgba(244, 67, 54, 0.9); }
            }

      # ============================================================
      # SENSORS — Chips bar, alarm chip without pulse (grid area: sensors)
      # ============================================================
      - type: custom:mushroom-chips-card
        alignment: center
        view_layout:
          grid-area: sensors
        chips:
          - type: alarm-control-panel
            entity: alarm_control_panel.home_alarm
          - type: entity
            entity: binary_sensor.main_panel_front_door
            icon: mdi:door
            name: Front
            content_info: name
            use_entity_picture: false
          - type: entity
            entity: binary_sensor.main_panel_garage_door
            icon: mdi:garage
            name: Garage
            content_info: name
          - type: entity
            entity: binary_sensor.main_panel_basement_door
            icon: mdi:door
            name: Basement
            content_info: name
          - type: entity
            entity: binary_sensor.main_panel_sliding_door
            icon: mdi:door-sliding
            name: Sliding
            content_info: name
          - type: entity
