kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_sidebar: true
  user_settings:
    - users:
        - "Kiosk"
      kiosk: true

views:
  # =================================================================
  # HOME VIEW — mobile/tablet control dashboard (masonry)
  # Room vertical-stacks stay together in masonry layout
  # =================================================================
  - title: Home
    path: home
    icon: mdi:home
    cards:
      # --- Alarm section (always visible) ---
      - type: vertical-stack
        cards:
          - type: alarm-panel
            entity: alarm_control_panel.home_alarm
            name: Home Alarm
