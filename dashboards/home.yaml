kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_sidebar: true
  user_settings:
    - users:
        - "Kiosker"
      kiosk: true

views:
  # =================================================================
  # HOME VIEW — mobile/tablet control dashboard (masonry)
  # Room vertical-stacks stay together in masonry layout
  # =================================================================
  - title: Home
    path: home
    icon: mdi:home
    cards:
      # --- Alarm section (always visible) ---
      - type: vertical-stack
        cards:
          - type: alarm-panel
            entity: alarm_control_panel.home_alarm
            name: Home Alarm
            states:
              - arm_away
              - arm_home
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: binary_sensor.main_panel_front_door
                name: Front
                icon: mdi:door
              - type: tile
                entity: binary_sensor.main_panel_garage_door
                name: Garage
                icon: mdi:garage
              - type: tile
                entity: binary_sensor.main_panel_basement_door
                name: Basement
                icon: mdi:door
              - type: tile
                entity: binary_sensor.main_panel_sliding_door
                name: Sliding
                icon: mdi:door-sliding
              - type: tile
                entity: binary_sensor.main_panel_office_motion
                name: Office
                icon: mdi:motion-sensor
              - type: tile
                entity: binary_sensor.main_panel_family_room_motion
                name: Family Rm
                icon: mdi:motion-sensor

      # --- Weather (always visible) ---
      - type: weather-forecast
        entity: weather.forecast_home
        show_forecast: true
        forecast_type: daily

      # --- Sonos (conditional, playing coordinators only) ---
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_office_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.office

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_kitchen_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.kitchen

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_dining_room_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.dining_room

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_master_bedroom_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.master_bedroom

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_basement_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.basement

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_roam_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.roam_2

      # --- Kitchen ---
      - type: vertical-stack
