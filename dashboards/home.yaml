kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_sidebar: true
  user_settings:
    - users:
        - "Kiosker"
      kiosk: true

views:
  # =================================================================
  # HOME VIEW — mobile/tablet control dashboard
  # =================================================================
  - title: Home
    path: home
    icon: mdi:home
    cards:
      # Alarm panel — always visible, keypad for disarm
      - type: alarm-panel
        entity: alarm_control_panel.home_alarm
        name: Home Alarm
        states:
          - arm_away
          - arm_home

      # Weather — always visible
      - type: weather-forecast
        entity: weather.forecast_home
        show_forecast: true
        forecast_type: daily

      # --- Door sensors: show only when OPEN ---
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.main_panel_front_door
            state: "on"
        card:
          type: tile
          entity: binary_sensor.main_panel_front_door
          name: Front Door OPEN
          icon: mdi:door-open

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.main_panel_garage_door
            state: "on"
        card:
          type: tile
          entity: binary_sensor.main_panel_garage_door
          name: Garage Door OPEN
          icon: mdi:garage-open

      - type: conditional
        conditions:
          - condition: state
