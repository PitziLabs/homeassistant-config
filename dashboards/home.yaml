          - type: markdown
            content: "### Kitchen"
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.kitchen_lights_on
                state: "off"
            card:
              type: markdown
              content: "All off"
          - type: conditional
            conditions:
              - condition: state
                entity: light.kitchen_main
                state: "on"
            card:
              type: tile
              entity: light.kitchen_main
              name: Main
          - type: conditional
            conditions:
              - condition: state
                entity: light.kitchen_island
                state: "on"
            card:
              type: tile
              entity: light.kitchen_island
