  # =================================================================
  # KIOSK VIEW — 65" 1080p wall display, Noctis Kiosk theme
  # Grid layout, four columns, alarm chip animation
  # Global state-based card colors via theme card-mod
  # URL: /dashboard-home/kiosk
  # =================================================================
  - title: Kiosk
    path: kiosk
    theme: Noctis Kiosk
    type: custom:grid-layout
    icon: mdi:monitor
    layout:
      grid-template-columns: 1fr 1fr 1fr 1fr
      grid-template-rows: auto auto 1fr
      grid-template-areas: |
        "alarm alarm alarm alarm"
        "sensors sensors sensors sensors"
        "col1 col2 col3 col4"
      margin: 0
      padding: 8px
      grid-gap: 8px
      height: 100vh
    cards:
      # ============================================================
      # ALARM — full width (grid area: alarm)
      # ============================================================
      - type: custom:mushroom-alarm-control-panel-card
        entity: alarm_control_panel.home_alarm
        name: Home Alarm
        states:
          - armed_away
          - armed_home
        layout: horizontal
        show_keypad: false
        view_layout:
          grid-area: alarm

      # ============================================================
      # SENSOR CHIPS — with animated alarm chip (grid area: sensors)
      # ============================================================
      - type: custom:mushroom-chips-card
        alignment: center
        view_layout:
          grid-area: sensors
        chips:
          - type: alarm-control-panel
            entity: alarm_control_panel.home_alarm
            card_mod:
              style: |
                ha-card {
                  {% set state = states('alarm_control_panel.home_alarm') %}
                  {% if state == 'armed_away' %}
                    animation: pulse-blue 2s ease-in-out infinite;
                  {% elif state == 'armed_home' %}
                    animation: pulse-green 2s ease-in-out infinite;
                  {% elif state == 'triggered' %}
                    animation: pulse-red 0.5s ease-in-out infinite;
                  {% elif state == 'arming' %}
                    animation: pulse-amber 1s ease-in-out infinite;
                  {% elif state == 'pending' %}
                    animation: pulse-red 0.7s ease-in-out infinite;
                  {% endif %}
                }
                @keyframes pulse-blue {
                  0%, 100% { box-shadow: 0 0 4px rgba(79, 195, 247, 0.3); }
                  50% { box-shadow: 0 0 16px rgba(79, 195, 247, 0.8); }
                }
                @keyframes pulse-green {
                  0%, 100% { box-shadow: 0 0 4px rgba(76, 175, 80, 0.3); }
                  50% { box-shadow: 0 0 16px rgba(76, 175, 80, 0.8); }
                }
                @keyframes pulse-red {
                  0%, 100% { box-shadow: 0 0 4px rgba(244, 67, 54, 0.3); }
                  50% { box-shadow: 0 0 20px rgba(244, 67, 54, 0.9); }
                }
                @keyframes pulse-amber {
                  0%, 100% { box-shadow: 0 0 4px rgba(255, 193, 7, 0.3); }
                  50% { box-shadow: 0 0 16px rgba(255, 193, 7, 0.8); }
                }
          - type: entity
            entity: binary_sensor.main_panel_front_door
            icon: mdi:door
            name: Front
            content_info: name
            use_entity_picture: false
          - type: entity
            entity: binary_sensor.main_panel_garage_door
            icon: mdi:garage
            name: Garage
            content_info: name
          - type: entity
            entity: binary_sensor.main_panel_basement_door
            icon: mdi:door
            name: Basement
            content_info: name
          - type: entity
            entity: binary_sensor.main_panel_sliding_door
            icon: mdi:door-sliding
            name: Sliding
            content_info: name
          - type: entity
            entity: binary_sensor.main_panel_office_motion
            icon: mdi:motion-sensor
            name: Office
            content_info: name
          - type: entity
            entity: binary_sensor.main_panel_family_room_motion
            icon: mdi:motion-sensor
            name: Family
            content_info: name

      # ============================================================
      # COLUMN 1 — Kitchen + Play Room (grid area: col1)
      # ============================================================
      - type: vertical-stack
        view_layout:
          grid-area: col1
        cards:
          - type: custom:mushroom-title-card
            title: Kitchen
          - type: grid
            columns: 2
            square: false
            cards:
              - type: conditional
                conditions:
