  # =================================================================
  # KIOSK VIEW — 65" 1080p wall display, Noctis Kiosk theme
  # Grid layout, four columns, alarm chip animation
  # Global state-based card colors via theme card-mod
  # URL: /dashboard-home/kiosk
  # =================================================================
  - title: Kiosk
    path: kiosk
    theme: Noctis Kiosk
    type: custom:grid-layout
    icon: mdi:monitor
    layout:
      grid-template-columns: 1fr 1fr 1fr 1fr
      grid-template-rows: auto auto 1fr auto
      grid-template-areas: |
        "alarm alarm alarm alarm"
        "sensors sensors sensors sensors"
        "col1 col2 col3 col4"
        "metrics metrics metrics metrics"
      margin: 0
      padding: 8px
      grid-gap: 8px
      height: 100vh
    cards:
      # ============================================================
      # ALARM — full width (grid area: alarm)
      # ============================================================
      - type: custom:mushroom-alarm-control-panel-card
        entity: alarm_control_panel.home_alarm
        name: Home Alarm
        states:
          - armed_away
          - armed_home
        layout: horizontal
        show_keypad: false
        view_layout:
          grid-area: alarm
        card_mod:
          style: |
            ha-card {
              {% set state = states('alarm_control_panel.home_alarm') %}
              transition: background 0.6s ease, box-shadow 0.6s ease;
              will-change: box-shadow, background;
              {% if state == 'armed_home' %}
                background: rgba(76, 175, 80, 0.06) !important;
                animation: alarm-pulse-green 3.0s ease-in-out infinite;
              {% elif state == 'armed_away' %}
                background: rgba(79, 195, 247, 0.06) !important;
                animation: alarm-pulse-blue 2.0s ease-in-out infinite;
              {% elif state == 'arming' %}
                background: rgba(255, 193, 7, 0.08) !important;
                animation: alarm-pulse-amber 1.0s ease-in-out infinite;
              {% elif state == 'pending' %}
                background: rgba(244, 67, 54, 0.10) !important;
                animation: alarm-pulse-red-pending 0.7s ease-in-out infinite;
              {% elif state == 'triggered' %}
                background: rgba(244, 67, 54, 0.14) !important;
                animation: alarm-pulse-red-triggered 0.4s ease-in-out infinite;
              {% endif %}
            }
            @keyframes alarm-pulse-green {
              0%, 100% { box-shadow: 0 0 8px rgba(76, 175, 80, 0.3); }
              50% { box-shadow: 0 0 32px rgba(76, 175, 80, 0.9); }
            }
            @keyframes alarm-pulse-blue {
              0%, 100% { box-shadow: 0 0 8px rgba(79, 195, 247, 0.3); }
              50% { box-shadow: 0 0 40px rgba(79, 195, 247, 0.9); }
            }
            @keyframes alarm-pulse-amber {
              0%, 100% { box-shadow: 0 0 8px rgba(255, 193, 7, 0.3); }
              50% { box-shadow: 0 0 32px rgba(255, 193, 7, 0.9); }
            }
            @keyframes alarm-pulse-red-pending {
              0%, 100% { box-shadow: 0 0 8px rgba(244, 67, 54, 0.3); }
              50% { box-shadow: 0 0 48px rgba(244, 67, 54, 0.9); }
            }
            @keyframes alarm-pulse-red-triggered {
              0%, 100% { box-shadow: 0 0 8px rgba(244, 67, 54, 0.3); }
              50% { box-shadow: 0 0 60px rgba(244, 67, 54, 0.9); }
            }

      # ============================================================
      # SENSOR CHIPS — with animated alarm chip (grid area: sensors)
      # ============================================================
      - type: custom:mushroom-chips-card
        alignment: center
        view_layout:
          grid-area: sensors
        card_mod:
          style: |
            ha-card {
              {% set state = states('alarm_control_panel.home_alarm') %}
              will-change: box-shadow, background;
              {% if state == 'pending' %}
                background: rgba(244, 67, 54, 0.08) !important;
                animation: sensors-pulse-red-pending 0.7s ease-in-out infinite;
              {% elif state == 'triggered' %}
                background: rgba(244, 67, 54, 0.12) !important;
                animation: sensors-pulse-red-triggered 0.4s ease-in-out infinite;
              {% endif %}
            }
            @keyframes sensors-pulse-red-pending {
              0%, 100% { box-shadow: 0 0 8px rgba(244, 67, 54, 0.3); }
              50% { box-shadow: 0 0 32px rgba(244, 67, 54, 0.9); }
            }
            @keyframes sensors-pulse-red-triggered {
              0%, 100% { box-shadow: 0 0 8px rgba(244, 67, 54, 0.3); }
              50% { box-shadow: 0 0 48px rgba(244, 67, 54, 0.9); }
            }
        chips:
          - type: alarm-control-panel
            entity: alarm_control_panel.home_alarm
          - type: entity
            entity: binary_sensor.main_panel_front_door
            icon: mdi:door
            name: Front
            content_info: name
            use_entity_picture: false
          - type: entity
            entity: binary_sensor.main_panel_garage_door
            icon: mdi:garage
            name: Garage
            content_info: name
          - type: entity
            entity: binary_sensor.main_panel_basement_door
            icon: mdi:door
            name: Basement
            content_info: name
          - type: entity
            entity: binary_sensor.main_panel_sliding_door
            icon: mdi:door-sliding
            name: Sliding
            content_info: name
          - type: entity
            entity: binary_sensor.main_panel_office_motion
            icon: mdi:motion-sensor
            name: Office
            content_info: name
          - type: entity
            entity: binary_sensor.main_panel_family_room_motion
            icon: mdi:motion-sensor
            name: Family
            content_info: name

      # ============================================================
      # COLUMN 1 — Kitchen + Play Room (grid area: col1)
      # ============================================================
      - type: vertical-stack
        view_layout:
          grid-area: col1
        cards:
          - type: custom:mod-card
            card_mod:
              style: |
                ha-card {
                  border: 1px solid var(--divider-color);
                  border-radius: 16px;
                  padding: 8px;
