# Home Control Dashboard
# Tile-based layout optimized for mobile and wall tablet kiosk.
# Lights show persistent on/off color. Sensors show security state.

views:
  - title: Home
    path: home
    icon: mdi:home
    cards:

      # ============================================================
      # ALARM
      # ============================================================

      - type: alarm-panel
        entity: alarm_control_panel.home_alarm
        name: Home Alarm
        states:
          - arm_away
          - arm_home

      # --- Security sensors: doors ---
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: binary_sensor.main_panel_front_door
            name: Front Door
            icon: mdi:door
          - type: tile
            entity: binary_sensor.main_panel_garage_door
            name: Garage Door
            icon: mdi:garage
          - type: tile
            entity: binary_sensor.main_panel_basement_door
            name: Basement
            icon: mdi:door
          - type: tile
            entity: binary_sensor.main_panel_sliding_door
            name: Sliding Door
            icon: mdi:door-sliding

      # --- Security sensors: motion ---
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: binary_sensor.main_panel_office_motion
            name: Office Motion
            icon: mdi:motion-sensor
          - type: tile
            entity: binary_sensor.main_panel_family_room_motion
            name: Family Room
            icon: mdi:motion-sensor

      # ============================================================
      # NOW PLAYING — Sonos (group-aware, coordinators only)
      # ============================================================

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_office_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.office

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_kitchen_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.kitchen

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_dining_room_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.dining_room

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_master_bedroom_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.master_bedroom

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_basement_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.basement

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_roam_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.roam_2

      # ============================================================
      # LIGHTS — tile cards grouped by room
      # Colored when on, gray when off. Tap to toggle.
      # ============================================================

      # --- Kitchen ---
      - type: grid
        title: Kitchen
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.kitchen_main
            name: Main
          - type: tile
            entity: light.kitchen_island
            name: Island
          - type: tile
            entity: light.kitchen_table
            name: Table
          - type: tile
            entity: light.kitchen_sink
            name: Sink

      # --- Office ---
      - type: grid
        title: Office
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.office
            name: Main
          - type: tile
            entity: light.office_lamp
            name: Lamp
          - type: tile
            entity: light.office_bookcase
            name: Bookcase
          - type: tile
            entity: light.office_corner
            name: Corner
          - type: tile
            entity: light.office_back_corner
            name: Back Corner
          - type: tile
            entity: light.office_door
            name: Door
          - type: tile
            entity: light.desk_lamp
            name: Desk Lamp
          - type: tile
            entity: light.desk_lamp_2
            name: Desk Lamp 2

      # --- Play Room ---
      - type: grid
        title: Play Room
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.play_room
            name: Main
          - type: tile
            entity: light.play_room_1
            name: Light 1
          - type: tile
            entity: light.play_room_2
            name: Light 2
          - type: tile
            entity: light.play_room_3
            name: Light 3
          - type: tile
            entity: light.play_room_4
            name: Light 4

      # --- Family Room ---
      # Floor lamp is powered through the outlets switch.
      # Outlet must be on for floor lamp to work.
      - type: grid
        title: Family Room
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.family_room
            name: Main
          - type: tile
            entity: light.family_room_2
            name: Light 2
          - type: tile
            entity: switch.family_room_outlets
            name: Outlets
            icon: mdi:power-plug
          - type: tile
            entity: light.floor_lamp
            name: Floor Lamp

      # --- Entry & Upstairs ---
      - type: grid
        title: Entry & Upstairs
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.entry_1
            name: Entry 1
          - type: tile
            entity: light.entry_2
            name: Entry 2
          - type: tile
            entity: light.upstairs_hallway_light
            name: Upstairs Hall

      # ============================================================
      # OUTDOOR
      # ============================================================

      - type: grid
        title: Outdoor
        columns: 2
        square: false
        cards:
          - type: tile
            entity: light.garage_front
            name: Garage Front
            icon: mdi:garage
          - type: tile
            entity: light.garage_side
            name: Garage Side
            icon: mdi:garage
          - type: tile
            entity: light.shed
            name: Shed
            icon: mdi:shed
          - type: tile
            entity: switch.back_porch
            name: Back Porch
            icon: mdi:outdoor-lamp
          - type: tile
            entity: switch.garden
            name: Garden
            icon: mdi:flower

      # ============================================================
      # INDOOR SWITCHES
      # ============================================================

      - type: grid
        title: Switches
        columns: 2
        square: false
        cards:
          - type: tile
            entity: switch.play_room_outlet
            name: Play Room Outlet
            icon: mdi:power-plug
          - type: tile
            entity: switch.bonus_room
            name: Bonus Room
          - type: tile
            entity: switch.basement_1
            name: Basement

      # ============================================================
      # SPRINKLER
      # ============================================================

      - type: entities
        title: Sprinkler
        icon: mdi:sprinkler-variant
        show_header_toggle: false
        entities:
          - entity: switch.rachio_lawn_schedule
            name: Lawn Schedule
          - entity: switch.rachio_standby
            name: Standby
          - entity: switch.rachio_rain_delay
            name: Rain Delay
          - type: divider
          - entity: switch.rachio_front_yard
            name: Front Yard
          - entity: switch.rachio_main_yard
            name: Main Yard
          - entity: switch.rachio_mid_yard
            name: Mid Yard
          - entity: switch.rachio_side_yard
            name: Side Yard
          - entity: switch.rachio_side_strip
            name: Side Strip
          - entity: switch.rachio_drip_lines
            name: Drip Lines
