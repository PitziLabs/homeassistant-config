                      card:
                        type: custom:mushroom-light-card
                        entity: light.play_room_4
                        name: Light 4
                        layout: horizontal
                        use_light_color: true
                        show_brightness_control: false
                        fill_container: true

      # ============================================================
      # COLUMN 2 — Office (grid area: col2)
      # ============================================================
      - type: vertical-stack
        view_layout:
          grid-area: col2
        cards:
          - type: custom:mod-card
