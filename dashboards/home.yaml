kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_sidebar: true
  user_settings:
    - users:
        - "Kiosk"
      kiosk: true

views:
  # =================================================================
  # HOME VIEW — mobile/tablet control dashboard (masonry)
  # Room vertical-stacks stay together in masonry layout
  # =================================================================
  - title: Home
    path: home
    icon: mdi:home
    cards:
      # --- Alarm section (always visible) ---
      - type: vertical-stack
        cards:
          - type: alarm-panel
            entity: alarm_control_panel.home_alarm
            name: Home Alarm
            states:
              - arm_away
              - arm_home
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: binary_sensor.main_panel_front_door
                name: Front
                icon: mdi:door
              - type: tile
                entity: binary_sensor.main_panel_garage_door
                name: Garage
                icon: mdi:garage
              - type: tile
                entity: binary_sensor.main_panel_basement_door
                name: Basement
                icon: mdi:door
              - type: tile
                entity: binary_sensor.main_panel_sliding_door
                name: Sliding
                icon: mdi:door-sliding
              - type: tile
                entity: binary_sensor.main_panel_office_motion
                name: Office
                icon: mdi:motion-sensor
              - type: tile
                entity: binary_sensor.main_panel_family_room_motion
                name: Family Rm
                icon: mdi:motion-sensor

      # --- Weather (always visible) ---
      - type: weather-forecast
        entity: weather.forecast_home
        show_forecast: true
        forecast_type: daily

      # --- Sonos (conditional, playing coordinators only) ---
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_office_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.office

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_kitchen_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.kitchen

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_dining_room_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.dining_room

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_master_bedroom_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.master_bedroom

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_basement_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.basement

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_roam_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.roam_2

      # --- Kitchen ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Kitchen"
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.kitchen_lights_on
                state: "off"
            card:
              type: markdown
              content: "All off"
          - type: conditional
            conditions:
              - condition: state
                entity: light.kitchen_main
                state: "on"
            card:
              type: tile
              entity: light.kitchen_main
              name: Main
          - type: conditional
            conditions:
              - condition: state
                entity: light.kitchen_island
                state: "on"
            card:
              type: tile
              entity: light.kitchen_island
              name: Island
          - type: conditional
            conditions:
              - condition: state
                entity: light.kitchen_table
                state: "on"
            card:
              type: tile
              entity: light.kitchen_table
              name: Table
          - type: conditional
            conditions:
              - condition: state
                entity: light.kitchen_sink
                state: "on"
            card:
              type: tile
              entity: light.kitchen_sink
              name: Sink

      # --- Office ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Office"
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.office_lights_on
                state: "off"
            card:
              type: markdown
              content: "All off"
          - type: conditional
            conditions:
              - condition: state
                entity: light.office
                state: "on"
            card:
              type: tile
              entity: light.office
              name: Main
          - type: conditional
            conditions:
              - condition: state
                entity: light.office_lamp
                state: "on"
            card:
              type: tile
              entity: light.office_lamp
              name: Lamp
          - type: conditional
            conditions:
              - condition: state
                entity: light.office_bookcase
                state: "on"
            card:
              type: tile
              entity: light.office_bookcase
              name: Bookcase
          - type: conditional
            conditions:
              - condition: state
                entity: light.office_corner
                state: "on"
            card:
              type: tile
              entity: light.office_corner
              name: Corner
          - type: conditional
            conditions:
              - condition: state
                entity: light.office_door
                state: "on"
            card:
              type: tile
              entity: light.office_door
              name: Door
          - type: conditional
            conditions:
              - condition: state
                entity: light.desk_lamp
                state: "on"
            card:
              type: tile
              entity: light.desk_lamp
              name: Desk Lamp
          - type: conditional
            conditions:
              - condition: state
                entity: light.desk_lamp_2
                state: "on"
            card:
              type: tile
              entity: light.desk_lamp_2
              name: Desk Lamp 2

      # --- Play Room ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Play Room"
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.play_room_lights_on
                state: "off"
            card:
              type: markdown
              content: "All off"
          - type: conditional
            conditions:
              - condition: state
                entity: light.play_room
                state: "on"
            card:
              type: tile
              entity: light.play_room
              name: Main
          - type: conditional
            conditions:
              - condition: state
                entity: light.play_room_1
                state: "on"
            card:
              type: tile
              entity: light.play_room_1
              name: Light 1
          - type: conditional
            conditions:
              - condition: state
                entity: light.play_room_2
                state: "on"
            card:
              type: tile
              entity: light.play_room_2
              name: Light 2
          - type: conditional
            conditions:
              - condition: state
                entity: light.play_room_3
                state: "on"
            card:
              type: tile
              entity: light.play_room_3
              name: Light 3
          - type: conditional
            conditions:
              - condition: state
                entity: light.play_room_4
                state: "on"
            card:
              type: tile
              entity: light.play_room_4
              name: Light 4

      # --- Family Room ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Family Room"
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.family_room_lights_on
                state: "off"
            card:
              type: markdown
              content: "All off"
          - type: conditional
            conditions:
              - condition: state
                entity: light.family_room
                state: "on"
            card:
              type: tile
              entity: light.family_room
              name: Main
          - type: conditional
            conditions:
              - condition: state
                entity: light.family_room_2
                state: "on"
            card:
              type: tile
              entity: light.family_room_2
              name: Light 2
          - type: conditional
            conditions:
              - condition: state
                entity: switch.family_room_outlets
                state: "on"
            card:
              type: tile
              entity: switch.family_room_outlets
              name: Outlets
              icon: mdi:power-plug
          - type: conditional
            conditions:
              - condition: state
                entity: light.floor_lamp
                state: "on"
            card:
              type: tile
              entity: light.floor_lamp
              name: Floor Lamp

      # --- Entry & Upstairs ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Entry & Upstairs"
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.entry_lights_on
                state: "off"
            card:
              type: markdown
              content: "All off"
          - type: conditional
            conditions:
              - condition: state
                entity: light.entry_1
                state: "on"
            card:
              type: tile
              entity: light.entry_1
              name: Entry 1
          - type: conditional
            conditions:
              - condition: state
                entity: light.entry_2
                state: "on"
            card:
              type: tile
              entity: light.entry_2
              name: Entry 2
          - type: conditional
            conditions:
              - condition: state
                entity: light.downstairs_hallway
                state: "on"
            card:
              type: tile
              entity: light.downstairs_hallway
              name: Downstairs Hall
          - type: conditional
            conditions:
              - condition: state
                entity: light.upstairs_hallway_light
                state: "on"
            card:
              type: tile
              entity: light.upstairs_hallway_light
              name: Upstairs Hall
          - type: conditional
            conditions:
              - condition: state
                entity: light.meeting_light
                state: "on"
            card:
              type: tile
              entity: light.meeting_light
              name: Meeting Light

      # --- Outdoor ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Outdoor"
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.outdoor_lights_on
                state: "off"
            card:
              type: markdown
              content: "All off"
          - type: conditional
            conditions:
              - condition: state
                entity: light.front_door
                state: "on"
            card:
              type: tile
              entity: light.front_door
              name: Front Door
              icon: mdi:coach-lamp
          - type: conditional
            conditions:
              - condition: state
                entity: light.front_lantern
                state: "on"
            card:
              type: tile
              entity: light.front_lantern
              name: Front Lantern
              icon: mdi:lamp-outline
          - type: conditional
            conditions:
              - condition: state
                entity: light.garage_front
                state: "on"
            card:
              type: tile
              entity: light.garage_front
              name: Garage Front
              icon: mdi:garage
          - type: conditional
            conditions:
              - condition: state
                entity: light.garage_side
                state: "on"
            card:
              type: tile
              entity: light.garage_side
              name: Garage Side
              icon: mdi:garage
          - type: conditional
            conditions:
              - condition: state
                entity: light.shed
                state: "on"
            card:
              type: tile
              entity: light.shed
              name: Shed
              icon: mdi:shed
          - type: conditional
            conditions:
              - condition: state
                entity: switch.back_porch
                state: "on"
            card:
              type: tile
              entity: switch.back_porch
              name: Back Porch
              icon: mdi:outdoor-lamp
          - type: conditional
            conditions:
              - condition: state
                entity: switch.garden
                state: "on"
            card:
              type: tile
              entity: switch.garden
              name: Garden
              icon: mdi:flower

      # --- Switches ---
      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Switches"
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.any_switch_on
                state: "off"
            card:
              type: markdown
              content: "All off"
          - type: conditional
            conditions:
              - condition: state
                entity: switch.play_room_outlet
                state: "on"
            card:
              type: tile
              entity: switch.play_room_outlet
              name: Play Room Outlet
              icon: mdi:power-plug
          - type: conditional
            conditions:
              - condition: state
                entity: switch.bonus_room
                state: "on"
            card:
              type: tile
              entity: switch.bonus_room
              name: Bonus Room
          - type: conditional
            conditions:
              - condition: state
                entity: switch.basement_1
                state: "on"
            card:
              type: tile
              entity: switch.basement_1
              name: Basement

  # =================================================================
  # KIOSK VIEW — 1920×1080 home-state display
  # 4-zone grid: Climate | Doors & Motion | Lights & Camera | Media
  # panel: true via custom:grid-layout — root fills 100vh, no scroll
  # =================================================================
  - title: Kiosk
    path: kiosk
    type: custom:grid-layout
    layout:
      grid-template-columns: 1fr 1fr 1fr 1fr
      grid-template-rows: 76px 1fr
      grid-template-areas: |
        "topstrip topstrip topstrip topstrip"
        "climate  doors    lights   media"
      height: 100vh
      margin: 0
      padding: 8px
      gap: 8px
    cards:

      # ============================================================
      # TOP STRIP — clock · weather · alarm state
      # (grid-area: topstrip, fixed 76px)
      # ============================================================
      - type: markdown
        view_layout:
          grid-area: topstrip
        content: >
          <div style="display:grid;grid-template-columns:1.1fr 1.4fr 1fr;height:76px;align-items:center;box-sizing:border-box;padding:0 4px;">
            <div style="padding:0 12px;">
              <div style="font-size:30px;font-weight:500;color:#e6edf3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ now().strftime('%-I:%M %p') }}</div>
              <div style="font-size:11px;color:#8b949e;margin-top:2px;white-space:nowrap;">{{ now().strftime('%A, %B %-d') }}</div>
            </div>
            <div style="display:flex;align-items:center;gap:20px;padding:0 12px;overflow:hidden;">
              <div style="flex-shrink:0;">
                <div style="font-size:24px;font-weight:500;color:#e6edf3;">{{ state_attr('weather.forecast_home','temperature') | round(0) | int }}°</div>
                <div style="font-size:11px;color:#8b949e;text-transform:capitalize;white-space:nowrap;">{{ states('weather.forecast_home') | replace('_',' ') }}</div>
              </div>
              {% set fc = state_attr('weather.forecast_home','forecast') %}
              {% if fc and fc | length > 0 %}
                {% for d in fc[:3] %}
                <div style="text-align:center;flex-shrink:0;min-width:32px;">
                  <div style="font-size:10px;color:#8b949e;">{{ as_timestamp(d.datetime) | timestamp_custom('%a') }}</div>
                  <div style="font-size:13px;font-weight:500;color:#e6edf3;">{{ d.temperature | round(0) | int }}°</div>
                  <div style="font-size:10px;color:#6e7681;">{{ d.templow | default(d.temperature) | round(0) | int }}°</div>
                </div>
                {% endfor %}
              {% endif %}
            </div>
            {% set st = states('alarm_control_panel.home_alarm') %}
            {% if st == 'disarmed' %}{% set col = '#56d364' %}{% set lbl = 'Disarmed' %}{% set sub = 'all sensors clear' %}
            {% elif st == 'armed_home' %}{% set col = '#e3b341' %}{% set lbl = 'Armed Home' %}{% set sub = '' %}
            {% elif st == 'armed_away' %}{% set col = '#f85149' %}{% set lbl = 'Armed Away' %}{% set sub = '' %}
            {% elif st == 'arming' %}{% set col = '#e3b341' %}{% set lbl = 'Arming…' %}{% set sub = '' %}
            {% elif st in ['pending','triggered'] %}{% set col = '#f85149' %}{% set lbl = 'ALARM' %}{% set sub = '' %}
            {% else %}{% set col = '#6e7681' %}{% set lbl = st | title %}{% set sub = '' %}{% endif %}
            <div style="padding:0 12px 0 16px;border-left:3px solid {{ col }};align-self:stretch;display:flex;flex-direction:column;justify-content:center;overflow:hidden;">
              <div style="font-size:18px;font-weight:500;color:{{ col }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ lbl }}</div>
              {% if sub %}<div style="font-size:11px;color:#8b949e;margin-top:2px;">{{ sub }}</div>{% endif %}
            </div>
          </div>
        card_mod:
          style: |
            ha-card {
              height: 76px;
              overflow: hidden;
              background: #161b22;
              border: 1px solid #30363d;
              border-radius: 12px;
              padding: 0 !important;
              box-shadow: none;
            }
            ha-card > * { padding: 0 !important; margin: 0 !important; }
            ha-markdown { padding: 0 !important; height: 76px !important; display: block !important; overflow: hidden; }

      # ============================================================
      # CLIMATE COLUMN (grid-area: climate)
      # Orange accent · outdoor + upstairs + downstairs + heater
      # ============================================================
      - type: markdown
        view_layout:
          grid-area: climate
        content: >
          <div style="height:calc(100vh - 100px);display:flex;flex-direction:column;padding:12px;gap:8px;box-sizing:border-box;overflow:hidden;">
            <div style="font-size:11px;font-weight:600;color:#f0883e;text-transform:uppercase;letter-spacing:0.08em;padding-bottom:6px;border-bottom:1px solid #30363d;flex-shrink:0;">Climate</div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1f27;border-radius:8px;padding:12px;min-height:0;overflow:hidden;">
              <div style="font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;">Outdoor</div>
              <div style="font-size:26px;font-weight:500;color:#f0883e;">{{ state_attr('weather.forecast_home','temperature') | round(0) | int }}°</div>
              <div style="font-size:11px;color:#8b949e;text-transform:capitalize;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;">{{ states('weather.forecast_home') | replace('_',' ') }}</div>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;justify-content:center;background:#1a1f27;border-radius:8px;padding:12px;min-height:0;overflow:hidden;">
              <div style="font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Upstairs</div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;">
                <div style="font-size:22px;font-weight:500;color:#e6edf3;">{{ state_attr('climate.upstairs','current_temperature') }}°</div>
                <div style="font-size:11px;color:#8b949e;">{{ states('sensor.upstairs_humidity') | int(0) }}% RH</div>
              </div>
              <div style="font-size:11px;color:#6e7681;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Set {{ state_attr('climate.upstairs','temperature') }}°
              · {{ state_attr('climate.upstairs','hvac_action') | default('') | replace('_',' ') }}</div>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;justify-content:center;background:#1a1f27;border-radius:8px;padding:12px;min-height:0;overflow:hidden;">
              <div style="font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;">Downstairs</div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;">
                <div style="font-size:22px;font-weight:500;color:#e6edf3;">{{ state_attr('climate.downstairs','current_temperature') }}°</div>
                <div style="font-size:11px;color:#8b949e;">{{ states('sensor.downstairs_humidity') | int(0) }}% RH</div>
              </div>
              <div style="font-size:11px;color:#6e7681;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Set {{ state_attr('climate.downstairs','temperature') }}°
              · {{ state_attr('climate.downstairs','hvac_action') | default('') | replace('_',' ') }}</div>
            </div>
            {% set hs = states('climate.heatstorm_infrared_heater') %}
            <div style="height:44px;flex-shrink:0;display:flex;align-items:center;padding:0 12px;background:#1a1f27;border-radius:8px;overflow:hidden;">
              <div style="font-size:11px;color:#8b949e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">Office Heater</div>
              <div style="font-size:11px;font-weight:500;flex-shrink:0;margin-left:8px;color:{% if hs == 'heat' %}#f0883e{% else %}#6e7681{% endif %};">{{ hs | replace('_',' ') | title }}</div>
            </div>
          </div>
        card_mod:
          style: |
            ha-card {
              height: 100%;
              overflow: hidden;
              background: #161b22;
              border: 1px solid #30363d;
              border-top: 3px solid #f0883e;
              border-radius: 12px;
              padding: 0 !important;
              box-shadow: none;
            }
            ha-card > * { padding: 0 !important; margin: 0 !important; }
            ha-markdown { padding: 0 !important; display: block !important; }

      # ============================================================
      # DOORS & MOTION COLUMN (grid-area: doors)
      # Green accent · 6 contact dots · garage covers · motion
      # Unavailable renders as gray ○, distinct from open red ●
      # ============================================================
      - type: markdown
        view_layout:
          grid-area: doors
        content: >
          <div style="height:calc(100vh - 100px);display:flex;flex-direction:column;padding:12px;gap:8px;box-sizing:border-box;overflow:hidden;">
            <div style="font-size:11px;font-weight:600;color:#56d364;text-transform:uppercase;letter-spacing:0.08em;padding-bottom:6px;border-bottom:1px solid #30363d;flex-shrink:0;">Doors &amp; Motion</div>
            <div style="flex:1;background:#1a1f27;border-radius:8px;padding:10px 12px;min-height:0;overflow:hidden;">
              <div style="font-size:10px;color:#6e7681;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">Contact Sensors</div>
              {% set doors = [
                ('binary_sensor.main_panel_front_door','Front'),
                ('binary_sensor.basement_kitchen_door','Basement'),
                ('binary_sensor.main_panel_sliding_door','Sliding'),
                ('binary_sensor.main_panel_garage_door','Garage'),
                ('binary_sensor.z_wave_door_window_sensor',"Hannah's Room"),
                ('binary_sensor.z_wave_door_window_sensor_2',"Jacob's Room")
              ] %}
              {% for eid, label in doors %}
                {% set s = states(eid) %}
                {% if s == 'off' %}{% set col = '#56d364' %}{% set sym = '&#9679;' %}{% set badge = '' %}
                {% elif s == 'on' %}{% set col = '#f85149' %}{% set sym = '&#9679;' %}{% set badge = 'open' %}
                {% else %}{% set col = '#6e7681' %}{% set sym = '&#9675;' %}{% set badge = 'unavail' %}{% endif %}
                <div style="display:flex;align-items:center;gap:6px;padding:5px 0;{% if not loop.last %}border-bottom:1px solid rgba(48,54,61,0.5);{% endif %}">
                  <span style="font-size:13px;color:{{ col }};flex-shrink:0;">{{ sym }}</span>
                  <span style="font-size:11px;color:#8b949e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">{{ label }}</span>
                  {% if badge %}<span style="font-size:10px;color:{{ col }};flex-shrink:0;">{{ badge }}</span>{% endif %}
                </div>
              {% endfor %}
            </div>
            <div style="background:#1a1f27;border-radius:8px;padding:10px 12px;flex-shrink:0;">
              <div style="font-size:10px;color:#6e7681;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">Garage Doors</div>
              {% set g1 = states('cover.garage_door_1_door') %}
              {% set g2 = states('cover.garage_door_2_door') %}
              <div style="display:flex;gap:20px;overflow:hidden;">
                <div style="font-size:12px;white-space:nowrap;color:{% if g1 == 'open' %}#f85149{% elif g1 == 'closed' %}#56d364{% else %}#6e7681{% endif %};">Bay 1 · {{ g1 | title }}</div>
                <div style="font-size:12px;white-space:nowrap;color:{% if g2 == 'open' %}#f85149{% elif g2 == 'closed' %}#56d364{% else %}#6e7681{% endif %};">Bay 2 · {{ g2 | title }}</div>
              </div>
            </div>
            <div style="background:#1a1f27;border-radius:8px;padding:10px 12px;flex-shrink:0;">
              <div style="font-size:10px;color:#6e7681;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">Motion</div>
              {% set fm = states('binary_sensor.main_panel_family_room_motion') %}
              {% set om = states('binary_sensor.main_panel_office_motion') %}
              <div style="display:flex;gap:20px;overflow:hidden;">
                <div style="font-size:12px;white-space:nowrap;font-weight:{% if fm == 'on' %}600{% else %}400{% endif %};color:{% if fm == 'on' %}#f85149{% else %}#6e7681{% endif %};">Family Rm</div>
                <div style="font-size:12px;white-space:nowrap;font-weight:{% if om == 'on' %}600{% else %}400{% endif %};color:{% if om == 'on' %}#f85149{% else %}#6e7681{% endif %};">Office</div>
              </div>
            </div>
          </div>
        card_mod:
          style: |
            ha-card {
              height: 100%;
              overflow: hidden;
              background: #161b22;
              border: 1px solid #30363d;
              border-top: 3px solid #56d364;
              border-radius: 12px;
              padding: 0 !important;
              box-shadow: none;
            }
            ha-card > * { padding: 0 !important; margin: 0 !important; }
            ha-markdown { padding: 0 !important; display: block !important; }

      # ============================================================
      # LIGHTS & DOORBELL COLUMN (grid-area: lights)
      # Amber accent · per-area counts · camera snapshot · doorbell events
      # Camera height is fixed; text sections are compact/fixed
      # ============================================================
      - type: custom:mod-card
        view_layout:
          grid-area: lights
        card_mod:
          style: |
            ha-card {
              height: 100%;
              overflow: hidden;
              background: #161b22;
              border: 1px solid #30363d;
              border-top: 3px solid #e3b341;
              border-radius: 12px;
              padding: 0 !important;
              box-shadow: none;
            }
        card:
          type: vertical-stack
          cards:

            - type: markdown
              content: >
                {% set o = states('sensor.lights_on_office_count') | int(0) %}
                {% set f = states('sensor.lights_on_family_room_count') | int(0) %}
                {% set k = states('sensor.lights_on_kitchen_count') | int(0) %}
                {% set d = states('sensor.lights_on_outdoor_count') | int(0) %}
                {% set h = states('sensor.lights_on_hallway_count') | int(0) %}
                {% set total = o + f + k + d + h %}
                <div style="padding:12px;background:#161b22;">
                  <div style="font-size:11px;font-weight:600;color:#e3b341;text-transform:uppercase;letter-spacing:0.08em;padding-bottom:6px;border-bottom:1px solid #30363d;margin-bottom:8px;">Lights</div>
                  <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:10px;">
                    <span style="font-size:24px;font-weight:500;color:#e3b341;">{{ total }}</span>
                    <span style="font-size:11px;color:#8b949e;">of 22 on</span>
                  </div>
                  <div style="display:flex;flex-direction:column;gap:5px;">
                    {% for row in [('Office', o, 8),('Family Rm', f, 3),('Kitchen', k, 3),('Outdoor', d, 6),('Hallway', h, 2)] %}
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                      <span style="font-size:11px;color:#8b949e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ row[0] }}</span>
                      <span style="font-size:11px;font-weight:500;color:{% if row[1] > 0 %}#e3b341{% else %}#6e7681{% endif %};">{{ row[1] }}/{{ row[2] }}</span>
                    </div>
                    {% endfor %}
                  </div>
                </div>
              card_mod:
                style: |
                  ha-card { background: transparent; border: none; box-shadow: none; border-radius: 0; padding: 0; }
                  ha-card > * { padding: 0 !important; margin: 0 !important; }
                  ha-markdown { padding: 0 !important; }

            - type: picture-glance
              entity: camera.front_door
              camera_view: auto
              entities: []
              tap_action:
                action: none
              hold_action:
                action: none
              double_tap_action:
                action: none
              card_mod:
                style: |
                  ha-card {
                    border: none;
                    border-radius: 0;
                    box-shadow: none;
                    height: 620px;
                    overflow: hidden;
                  }

            - type: markdown
              content: >
                {% set chime_ts = states('event.front_door_chime') %}
                {% set motion_ts = states('event.front_door_motion') %}
                {% macro rel(ts) %}{% if ts in ['unknown','unavailable',''] %}—{% else %}{{ relative_time(as_datetime(ts)) }}{% endif %}{% endmacro %}
                <div style="padding:8px 12px;border-top:1px solid #30363d;background:#161b22;">
                  <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
                    <span style="font-size:10px;color:#6e7681;white-space:nowrap;">Chime</span>
                    <span style="font-size:10px;color:#8b949e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px;">{{ rel(chime_ts) }}</span>
                  </div>
                  <div style="display:flex;justify-content:space-between;">
                    <span style="font-size:10px;color:#6e7681;white-space:nowrap;">Motion</span>
                    <span style="font-size:10px;color:#8b949e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px;">{{ rel(motion_ts) }}</span>
                  </div>
                </div>
              card_mod:
                style: |
                  ha-card { background: transparent; border: none; box-shadow: none; border-radius: 0; padding: 0; }
                  ha-card > * { padding: 0 !important; margin: 0 !important; }
                  ha-markdown { padding: 0 !important; }

      # ============================================================
      # MEDIA COLUMN (grid-area: media)
      # Blue accent · 6 Sonos rooms in 2-col grid · TV states row
      # Cells have fixed 230px height — no height change on state change
      # Track titles use ellipsis truncation
      # ============================================================
      - type: custom:mod-card
        view_layout:
          grid-area: media
        card_mod:
          style: |
            ha-card {
              height: 100%;
              overflow: hidden;
              background: #161b22;
              border: 1px solid #30363d;
              border-top: 3px solid #58a6ff;
              border-radius: 12px;
              padding: 0 !important;
              box-shadow: none;
            }
        card:
          type: vertical-stack
          cards:

            - type: markdown
              content: |
                <div style="padding:10px 12px 8px;font-size:11px;font-weight:600;color:#58a6ff;text-transform:uppercase;letter-spacing:0.08em;border-bottom:1px solid #30363d;">Media</div>
              card_mod:
                style: |
                  ha-card { background: transparent; border: none; box-shadow: none; border-radius: 0; padding: 0; }
                  ha-card > * { padding: 0 !important; margin: 0 !important; }
                  ha-markdown { padding: 0 !important; }

            - type: grid
              columns: 2
              square: false
              card_mod:
                style: |
                  ha-card { background: transparent; border: none; box-shadow: none; border-radius: 0; padding: 4px; }
              cards:

                - type: custom:mini-media-player
                  entity: media_player.master_bedroom
                  artwork: cover
                  hide:
                    power: true
                    source: true
                    controls: true
                    volume: true
                    icon: false
                    name: false
                    info: false
                  info: scroll
                  tap_action:
                    action: none
                  card_mod:
                    style: |
                      ha-card {
                        height: 230px;
                        overflow: hidden;
                        background: {{ '#14283f' if is_state('media_player.master_bedroom','playing') else '#1a1f27' }};
                        border: none;
                        border-left: 2px solid {{ '#58a6ff' if is_state('media_player.master_bedroom','playing') else 'transparent' }};
                        border-radius: 8px;
                      }
                      .mmp-player__core { overflow: hidden; }
                      .mmp__name, .mmp-player__media-title { white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; }

                - type: custom:mini-media-player
                  entity: media_player.basement
                  artwork: cover
                  hide:
                    power: true
                    source: true
                    controls: true
                    volume: true
                    icon: false
                    name: false
                    info: false
                  info: scroll
                  tap_action:
                    action: none
                  card_mod:
                    style: |
                      ha-card {
                        height: 230px;
                        overflow: hidden;
                        background: {{ '#14283f' if is_state('media_player.basement','playing') else '#1a1f27' }};
                        border: none;
                        border-left: 2px solid {{ '#58a6ff' if is_state('media_player.basement','playing') else 'transparent' }};
