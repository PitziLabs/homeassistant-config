# Home Control Dashboard
# Designed for mobile device and wall-mounted tablet in kiosk mode.
# Single-page layout: alarm → active music → lights → outdoor → sprinkler

views:
  - title: Home
    path: home
    icon: mdi:home
    cards:

      # ============================================================
      # ALARM PANEL
      # ============================================================

      - type: alarm-panel
        entity: alarm_control_panel.home_alarm
        name: Home Alarm
        states:
          - arm_away
          - arm_home

      # Door and motion sensor status — compact glance card
      - type: glance
        title: Sensors
        show_state: true
        columns: 3
        entities:
          - entity: binary_sensor.main_panel_front_door
            name: Front
          - entity: binary_sensor.main_panel_garage_door
            name: Garage
          - entity: binary_sensor.main_panel_basement_door
            name: Basement
          - entity: binary_sensor.main_panel_sliding_door
            name: Sliding
          - entity: binary_sensor.main_panel_office_motion
            name: Office
          - entity: binary_sensor.main_panel_family_room_motion
            name: Family Rm

      # ============================================================
      # NOW PLAYING — Sonos (group-aware)
      # Playing speakers: full media-control card (coordinator only)
      # Paused speakers: compact resume button (coordinator only)
      # Idle/unavailable: hidden
      # ============================================================

      # --- Playing: full media controls ---

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_office_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.office

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_kitchen_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.kitchen

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_dining_room_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.dining_room

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_master_bedroom_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.master_bedroom

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_basement_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.basement

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_roam_leader
            state: "on"
        card:
          type: media-control
          entity: media_player.roam_2

      # --- Paused: compact resume buttons ---
      # Tap to resume playback. Button disappears, full card appears.

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_office_paused
            state: "on"
        card:
          type: button
          entity: media_player.office
          name: Office (Paused)
          icon: mdi:play-circle-outline
          show_state: false
          tap_action:
            action: call-service
            service: media_player.media_play
            target:
              entity_id: media_player.office

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_kitchen_paused
            state: "on"
        card:
          type: button
          entity: media_player.kitchen
          name: Kitchen (Paused)
          icon: mdi:play-circle-outline
          show_state: false
          tap_action:
            action: call-service
            service: media_player.media_play
            target:
              entity_id: media_player.kitchen

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_dining_room_paused
            state: "on"
        card:
          type: button
          entity: media_player.dining_room
          name: Dining Room (Paused)
          icon: mdi:play-circle-outline
          show_state: false
          tap_action:
            action: call-service
            service: media_player.media_play
            target:
              entity_id: media_player.dining_room

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_master_bedroom_paused
            state: "on"
        card:
          type: button
          entity: media_player.master_bedroom
          name: Master Bedroom (Paused)
          icon: mdi:play-circle-outline
          show_state: false
          tap_action:
            action: call-service
            service: media_player.media_play
            target:
              entity_id: media_player.master_bedroom

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_basement_paused
            state: "on"
        card:
          type: button
          entity: media_player.basement
          name: Basement (Paused)
          icon: mdi:play-circle-outline
          show_state: false
          tap_action:
            action: call-service
            service: media_player.media_play
            target:
              entity_id: media_player.basement

      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.sonos_roam_paused
            state: "on"
        card:
          type: button
          entity: media_player.roam_2
          name: Roam (Paused)
          icon: mdi:play-circle-outline
          show_state: false
          tap_action:
            action: call-service
            service: media_player.media_play
            target:
              entity_id: media_player.roam_2

      # ============================================================
      # LIGHTS — grouped by room
      # ============================================================

      - type: entities
        title: Kitchen
        icon: mdi:silverware-fork-knife
        show_header_toggle: true
        entities:
          - entity: light.kitchen_main
            name: Main
          - entity: light.kitchen_island
            name: Island
          - entity: light.kitchen_table
            name: Table
          - entity: light.kitchen_sink
            name: Sink

      - type: entities
        title: Office
        icon: mdi:desk
        show_header_toggle: true
        entities:
          - entity: light.office
            name: Main
          - entity: light.office_lamp
            name: Lamp
          - entity: light.office_bookcase
            name: Bookcase
          - entity: light.office_corner
            name: Corner
          - entity: light.office_back_corner
            name: Back Corner
          - entity: light.office_door
            name: Door
          - entity: light.desk_lamp
            name: Desk Lamp
          - entity: light.desk_lamp_2
            name: Desk Lamp 2

      - type: entities
        title: Play Room
        icon: mdi:puzzle
        show_header_toggle: true
        entities:
          - entity: light.play_room
            name: Main
          - entity: light.play_room_1
            name: Light 1
          - entity: light.play_room_2
            name: Light 2
          - entity: light.play_room_3
            name: Light 3
          - entity: light.play_room_4
            name: Light 4

      - type: entities
        title: Family Room
        icon: mdi:sofa
        show_header_toggle: false
        entities:
          - entity: light.family_room
            name: Main
          - entity: light.family_room_2
            name: Light 2
          - type: divider
          - entity: switch.family_room_outlets
            name: Outlets (powers floor lamp)
          - entity: light.floor_lamp
            name: Floor Lamp

      - type: entities
        title: Rest of House
        icon: mdi:home-floor-1
        show_header_toggle: false
        entities:
          - entity: light.entry_1
            name: Entry 1
          - entity: light.entry_2
            name: Entry 2
          - entity: light.upstairs_hallway_light
            name: Upstairs Hallway
          - entity: light.garage_front
            name: Garage Front
          - entity: light.garage_side
            name: Garage Side
          - entity: light.shed
            name: Shed

      # ============================================================
      # OUTDOOR & UTILITY
      # ============================================================

      - type: entities
        title: Outdoor
        icon: mdi:tree
        show_header_toggle: false
        entities:
          - entity: switch.back_porch
            name: Back Porch
          - entity: switch.garden
            name: Garden

      - type: entities
        title: Indoor Switches
        icon: mdi:power-socket-us
        show_header_toggle: false
        entities:
          - entity: switch.play_room_outlet
            name: Play Room Outlet
          - entity: switch.bonus_room
            name: Bonus Room
          - entity: switch.basement_1
            name: Basement

      - type: entities
        title: Workstation
        icon: mdi:monitor
        show_header_toggle: false
        entities:
          - entity: switch.workstation_1_switch_1
            name: WS1 Switch 1
          - entity: switch.workstation_1_switch_2
            name: WS1 Switch 2
          - entity: switch.workstation_2_switch_1
            name: WS2 Switch 1
          - entity: switch.workstation_2_switch_2
            name: WS2 Switch 2

      # ============================================================
      # SPRINKLER — Rachio
      # ============================================================

      - type: entities
        title: Sprinkler
        icon: mdi:sprinkler-variant
        show_header_toggle: false
        entities:
          - entity: switch.rachio_lawn_schedule
            name: Lawn Schedule
          - entity: switch.rachio_standby
            name: Standby
          - entity: switch.rachio_rain_delay
            name: Rain Delay
          - type: divider
          - entity: switch.rachio_front_yard
            name: Front Yard
          - entity: switch.rachio_main_yard
            name: Main Yard
          - entity: switch.rachio_mid_yard
            name: Mid Yard
          - entity: switch.rachio_side_yard
            name: Side Yard
          - entity: switch.rachio_side_strip
            name: Side Strip
          - entity: switch.rachio_drip_lines
            name: Drip Lines
