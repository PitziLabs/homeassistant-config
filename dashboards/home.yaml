              name: Entry 2
          - type: conditional
            conditions:
              - condition: state
                entity: light.downstairs_hallway
                state: "on"
            card:
              type: tile
              entity: light.downstairs_hallway
              name: Downstairs Hall
          - type: conditional
            conditions:
              - condition: state
                entity: light.upstairs_hallway_light
                state: "on"
            card:
              type: tile
              entity: light.upstairs_hallway_light
              name: Upstairs Hall
          - type: conditional
            conditions:
