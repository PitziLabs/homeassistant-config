views:
  - title: Homelab Status
    path: homelab-status
    icon: mdi:server-network
    type: masonry
    cards:

      # ═══════════════════════════════════════════════════════════
      # 1. NAS — Neptune (UGREEN DXP2800)
      # ═══════════════════════════════════════════════════════════
      - type: markdown
        content: "### 🗄️ Neptune (UGREEN DXP2800)"

      - type: custom:mushroom-entity-card
        entity: sensor.ugreen_nas_server_status
        name: Server Status
        icon: mdi:nas

      - type: entities
        title: Pool 1 — RAID 1 btrfs
        entities:
          - entity: sensor.ugreen_nas_pool_1_status
            name: Status
          - entity: sensor.ugreen_nas_pool_1_level
            name: RAID Level
          - entity: sensor.ugreen_nas_pool_1_volume_1_used_size
            name: Used
          - entity: sensor.ugreen_nas_pool_1_volume_1_total_size
            name: Total

      - type: custom:mushroom-template-card
        primary: Volume Usage
        secondary: >
          {% set used = states('sensor.ugreen_nas_pool_1_volume_1_used_size') %}
          {% set total = states('sensor.ugreen_nas_pool_1_volume_1_total_size') %}
          {% set used_raw = states('sensor.ugreen_nas_pool_1_volume_1_used_size_raw') | float(0) %}
          {% set total_raw = states('sensor.ugreen_nas_pool_1_volume_1_total_size_raw') | float(0) %}
          {% if total_raw > 0 %}{{ used }} / {{ total }} — {{ (used_raw / total_raw * 100) | round(1) }}% used
          {% else %}{{ used }} / {{ total }}{% endif %}
        icon: mdi:harddisk
        icon_color: >
          {% set used_raw = states('sensor.ugreen_nas_pool_1_volume_1_used_size_raw') | float(0) %}
          {% set total_raw = states('sensor.ugreen_nas_pool_1_volume_1_total_size_raw') | float(1) %}
          {% set pct = used_raw / total_raw * 100 %}
          {% if pct > 80 %}red{% elif pct > 60 %}amber{% else %}green{% endif %}
        tap_action:
          action: none

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.ugreen_nas_cpu_temperature
            name: CPU Temp
            icon: mdi:thermometer
          - type: custom:mushroom-entity-card
            entity: sensor.ugreen_nas_cpu_usage
            name: CPU Usage
            icon: mdi:chip
          - type: custom:mushroom-entity-card
            entity: sensor.ugreen_nas_ram_usage
            name: RAM Usage
            icon: mdi:memory

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.ugreen_nas_device_fan
            name: Fan (RPM)
            icon: mdi:fan
          - type: custom:mushroom-entity-card
            entity: sensor.ugreen_nas_fans_system_mode
            name: Fan Mode
            icon: mdi:fan-auto

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.ugreen_nas_overall_lan_download
            name: LAN Download
            icon: mdi:download-network
          - type: custom:mushroom-entity-card
            entity: sensor.ugreen_nas_overall_lan_upload
            name: LAN Upload
            icon: mdi:upload-network

      - type: grid
        columns: 2
        square: false
        cards:
          - type: entities
            title: Disk 1
            entities:
              - entity: sensor.ugreen_nas_pool_1_disk_1_brand
                name: Brand / Model
              - entity: sensor.ugreen_nas_pool_1_disk_1_temperature
                name: Temperature
              - entity: sensor.ugreen_nas_pool_1_disk_1_power_on_hours
                name: Power-On Hours
              - entity: sensor.ugreen_nas_pool_1_disk_1_status
                name: Status
          - type: entities
            title: Disk 2
            entities:
              - entity: sensor.ugreen_nas_pool_1_disk_2_brand
                name: Brand / Model
              - entity: sensor.ugreen_nas_pool_1_disk_2_temperature
                name: Temperature
              - entity: sensor.ugreen_nas_pool_1_disk_2_power_on_hours
                name: Power-On Hours
              - entity: sensor.ugreen_nas_pool_1_disk_2_status
                name: Status

      - type: custom:mushroom-entity-card
        entity: sensor.ugreen_nas_last_boot_timestamp
        name: Last Boot / Uptime
        icon: mdi:clock-start


      # ═══════════════════════════════════════════════════════════
      # 2. Proxmox — pve
      # ═══════════════════════════════════════════════════════════
      - type: markdown
        content: "### 🖥️ Proxmox (pve)"

      - type: entities
        title: Node — pve
        entities:
          - entity: sensor.pve_status
            name: Status
          - entity: sensor.pve_cpu_usage
            name: CPU Usage
          - entity: sensor.pve_memory_usage_percentage
            name: Memory
          - entity: sensor.pve_disk_usage
            name: Disk Usage

      - type: custom:mushroom-template-card
        primary: Uptime
        secondary: >
          {% set s = states('sensor.pve_uptime') | int(-1) %}
          {% if s < 0 %}—{% elif s >= 86400 %}{{ (s // 86400) }}d {{ ((s % 86400) // 3600) }}h {{ ((s % 3600) // 60) }}m{% elif s >= 3600 %}{{ (s // 3600) }}h {{ ((s % 3600) // 60) }}m{% else %}{{ (s // 60) }}m{% endif %}
        icon: mdi:clock-outline
        entity: sensor.pve_uptime
        tap_action:
          action: none

      - type: grid
        columns: 2
        square: false
        cards:
          - type: entities
            title: HAOS VM
            entities:
              - entity: binary_sensor.haos_17_1_status
                name: Status
              - entity: sensor.haos_17_1_cpu_usage
                name: CPU Usage
              - entity: sensor.haos_17_1_memory_usage_percentage
                name: Memory
          - type: entities
            title: grafana-stack VM
            entities:
              - entity: binary_sensor.grafana_stack_status
                name: Status
              - entity: sensor.grafana_stack_cpu_usage
                name: CPU Usage
              - entity: sensor.grafana_stack_memory_usage_percentage
                name: Memory

      - type: entities
        title: Backup
        entities:
          - entity: sensor.pve_last_backup
            name: Last Backup
          - entity: sensor.backup_backup_manager_state
            name: Manager State
          - entity: sensor.backup_next_scheduled_automatic_backup
            name: Next Scheduled

      # Kiosk host memory watch — pve2 drives the household dashboard
      # display via Chromium. The renderer has a slow leak that ends in
      # a V8 OOM after ~7h (see issue #308); pve2 only runs the kiosk
      # plus bare PVE/corosync, so host memory % is a reliable proxy
      # for "kiosk Chromium has bloated." Pre-OOM peak observed at ~65%.
      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.pve2_memory_usage_percentage_2
            name: Kiosk Host Memory
            unit: '%'
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 50
              red: 70
          - type: entities
            title: pve2 (kiosk host)
            entities:
              - entity: sensor.pve2_status_2
                name: Status
              - entity: sensor.pve2_cpu_usage_2
                name: CPU
              - entity: sensor.pve2_memory_usage_2
                name: Memory (GB)
              - entity: sensor.pve2_uptime_2
                name: Host Uptime


      # ═══════════════════════════════════════════════════════════
      # 3. UPS — CyberPower CP1500PFCLCDa
      # ═══════════════════════════════════════════════════════════
      - type: markdown
        content: "### 🔌 UPS (CyberPower CP1500PFCLCDa)"

      - type: entities
        title: Power
        entities:
          - entity: sensor.cyberpower_status_data
            name: Status
          - entity: sensor.cyberpower_load
            name: Load
          - entity: sensor.cyberpower_input_voltage
            name: Input Voltage
          - entity: sensor.cyberpower_output_voltage
            name: Output Voltage

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Battery Charge
            secondary: "{{ states('sensor.cyberpower_battery_charge') }}%"
            icon: >
              {% set v = states('sensor.cyberpower_battery_charge') | int(100) %}
              {% if v < 20 %}mdi:battery-10{% elif v < 40 %}mdi:battery-40{% elif v < 60 %}mdi:battery-60{% elif v < 80 %}mdi:battery-80{% else %}mdi:battery{% endif %}
            icon_color: >
              {% set v = states('sensor.cyberpower_battery_charge') | int(100) %}
              {% if v < 20 %}red{% elif v < 40 %}amber{% else %}green{% endif %}
            entity: sensor.cyberpower_battery_charge
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: Runtime Remaining
            secondary: >
              {% set s = states('sensor.cyberpower_battery_runtime') | int(-1) %}
              {% if s < 0 %}—{% elif s >= 3600 %}{{ (s // 3600) }}h {{ ((s % 3600) // 60) }}m{% else %}{{ (s // 60) }}m{% endif %}
            icon: mdi:timer-sand
            icon_color: >
              {% set s = states('sensor.cyberpower_battery_runtime') | int(0) %}
              {% if s < 300 %}red{% elif s < 600 %}amber{% else %}green{% endif %}
            entity: sensor.cyberpower_battery_runtime
            tap_action:
              action: more-info


      # ═══════════════════════════════════════════════════════════
      # 4. Smart Home Coordinators
      # ═══════════════════════════════════════════════════════════
      - type: markdown
        content: "### 📡 Coordinators"

      - type: entities
        title: Z-Wave / Zigbee
        entities:
          - entity: sensor.home_assistant_connect_zwa_2_status
            name: ZWA-2 Status
          - entity: update.home_assistant_connect_zwa_2_firmware
            name: ZWA-2 Firmware
          - entity: update.home_assistant_connect_zbt_2_dcb4d90d5790_firmware
            name: ZBT-2 Firmware

      - type: grid
        columns: 2
        square: false
        cards:
          - type: entities
            title: Main Panel (56ac70)
            entities:
              - entity: binary_sensor.main_panel_status
                name: Status
              - entity: sensor.main_panel_wifi_signal
                name: WiFi RSSI
          - type: entities
            title: Secondary Panel (56a4fa)
            entities:
              - entity: binary_sensor.secondary_panel_status
                name: Status
              - entity: sensor.secondary_panel_wifi_signal
                name: WiFi RSSI

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Main Panel Uptime
            secondary: >
              {% set s = states('sensor.alarm_panel_56ac70_uptime') | int(-1) %}
              {% if s < 0 %}—{% elif s >= 86400 %}{{ (s // 86400) }}d {{ ((s % 86400) // 3600) }}h {{ ((s % 3600) // 60) }}m{% elif s >= 3600 %}{{ (s // 3600) }}h {{ ((s % 3600) // 60) }}m{% else %}{{ (s // 60) }}m{% endif %}
            icon: mdi:clock-outline
            entity: sensor.alarm_panel_56ac70_uptime
            tap_action:
              action: none
          - type: custom:mushroom-template-card
            primary: Secondary Panel Uptime
            secondary: >
              {% set s = states('sensor.alarm_panel_56a4fa_uptime') | int(-1) %}
              {% if s < 0 %}—{% elif s >= 86400 %}{{ (s // 86400) }}d {{ ((s % 86400) // 3600) }}h {{ ((s % 3600) // 60) }}m{% elif s >= 3600 %}{{ (s // 3600) }}h {{ ((s % 3600) // 60) }}m{% else %}{{ (s // 60) }}m{% endif %}
            icon: mdi:clock-outline
            entity: sensor.alarm_panel_56a4fa_uptime
            tap_action:
              action: none


      # ═══════════════════════════════════════════════════════════
      # 5. Battery Health
      # ═══════════════════════════════════════════════════════════
      - type: markdown
        content: "### 🔋 Battery Health"

      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Basement Kitchen Door
            secondary: "{{ states('sensor.basement_kitchen_door_battery') }}%"
            icon: >
              {% set v = states('sensor.basement_kitchen_door_battery') | int(100) %}
              {% if v < 20 %}mdi:battery-10{% elif v < 40 %}mdi:battery-40{% elif v < 60 %}mdi:battery-60{% elif v < 80 %}mdi:battery-80{% else %}mdi:battery{% endif %}
            icon_color: >
              {% set v = states('sensor.basement_kitchen_door_battery') | int(100) %}
              {% if v < 20 %}red{% elif v < 40 %}amber{% else %}green{% endif %}
            entity: sensor.basement_kitchen_door_battery
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: Z-Wave Door/Window 1
            secondary: "{{ states('sensor.z_wave_door_window_sensor_battery_level') }}%"
            icon: >
              {% set v = states('sensor.z_wave_door_window_sensor_battery_level') | int(100) %}
              {% if v < 20 %}mdi:battery-10{% elif v < 40 %}mdi:battery-40{% elif v < 60 %}mdi:battery-60{% elif v < 80 %}mdi:battery-80{% else %}mdi:battery{% endif %}
            icon_color: >
              {% set v = states('sensor.z_wave_door_window_sensor_battery_level') | int(100) %}
              {% if v < 20 %}red{% elif v < 40 %}amber{% else %}green{% endif %}
            entity: sensor.z_wave_door_window_sensor_battery_level
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: Z-Wave Door/Window 2
            secondary: "{{ states('sensor.z_wave_door_window_sensor_battery_level_2') }}%"
            icon: >
              {% set v = states('sensor.z_wave_door_window_sensor_battery_level_2') | int(100) %}
              {% if v < 20 %}mdi:battery-10{% elif v < 40 %}mdi:battery-40{% elif v < 60 %}mdi:battery-60{% elif v < 80 %}mdi:battery-80{% else %}mdi:battery{% endif %}
            icon_color: >
              {% set v = states('sensor.z_wave_door_window_sensor_battery_level_2') | int(100) %}
              {% if v < 20 %}red{% elif v < 40 %}amber{% else %}green{% endif %}
            entity: sensor.z_wave_door_window_sensor_battery_level_2
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: Samsung Galaxy (SM-S926U1)
            secondary: "{{ states('sensor.sm_s926u1_battery_level') }}%"
            icon: >
              {% set v = states('sensor.sm_s926u1_battery_level') | int(100) %}
              {% if v < 20 %}mdi:battery-10{% elif v < 40 %}mdi:battery-40{% elif v < 60 %}mdi:battery-60{% elif v < 80 %}mdi:battery-80{% else %}mdi:battery{% endif %}
            icon_color: >
              {% set v = states('sensor.sm_s926u1_battery_level') | int(100) %}
              {% if v < 20 %}red{% elif v < 40 %}amber{% else %}green{% endif %}
            entity: sensor.sm_s926u1_battery_level
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: Sonos Dining Room
            secondary: "{{ states('sensor.dining_room_battery') }}%"
            icon: >
              {% set v = states('sensor.dining_room_battery') | int(100) %}
              {% if v < 20 %}mdi:battery-10{% elif v < 40 %}mdi:battery-40{% elif v < 60 %}mdi:battery-60{% elif v < 80 %}mdi:battery-80{% else %}mdi:battery{% endif %}
            icon_color: >
              {% set v = states('sensor.dining_room_battery') | int(100) %}
              {% if v < 20 %}red{% elif v < 40 %}amber{% else %}green{% endif %}
            entity: sensor.dining_room_battery
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: Sonos Roam 2
            secondary: "{{ states('sensor.roam_2_battery') }}%"
            icon: >
              {% set v = states('sensor.roam_2_battery') | int(100) %}
              {% if v < 20 %}mdi:battery-10{% elif v < 40 %}mdi:battery-40{% elif v < 60 %}mdi:battery-60{% elif v < 80 %}mdi:battery-80{% else %}mdi:battery{% endif %}
            icon_color: >
              {% set v = states('sensor.roam_2_battery') | int(100) %}
              {% if v < 20 %}red{% elif v < 40 %}amber{% else %}green{% endif %}
            entity: sensor.roam_2_battery
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: Play Room Tap
            secondary: "{{ states('sensor.hue_tap_dial_battery') }}%"
            icon: >
              {% set v = states('sensor.hue_tap_dial_battery') | int(100) %}
              {% if v < 20 %}mdi:battery-10{% elif v < 40 %}mdi:battery-40{% elif v < 60 %}mdi:battery-60{% elif v < 80 %}mdi:battery-80{% else %}mdi:battery{% endif %}
            icon_color: >
              {% set v = states('sensor.hue_tap_dial_battery') | int(100) %}
              {% if v < 20 %}red{% elif v < 40 %}amber{% else %}green{% endif %}
            entity: sensor.hue_tap_dial_battery
            tap_action:
              action: more-info


      # ═══════════════════════════════════════════════════════════
      # 6. Consumables — Printer (HP M477fdw)
      # ═══════════════════════════════════════════════════════════
      - type: markdown
        content: "### 🖨️ Printer (HP M477fdw)"

      - type: custom:mushroom-entity-card
        entity: sensor.hp_color_laserjet_mfp_m477fdw
        name: Printer Status
        icon: mdi:printer

      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Cyan
            secondary: "{{ states('sensor.hp_color_laserjet_mfp_m477fdw_cyan_cartridge_hp_cf411x') }}%"
            icon: mdi:water
            icon_color: >
              {% set v = states('sensor.hp_color_laserjet_mfp_m477fdw_cyan_cartridge_hp_cf411x') | int(100) %}
              {% if v < 25 %}red{% elif v < 40 %}amber{% else %}cyan{% endif %}
            entity: sensor.hp_color_laserjet_mfp_m477fdw_cyan_cartridge_hp_cf411x
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: Magenta
            secondary: "{{ states('sensor.hp_color_laserjet_mfp_m477fdw_magenta_cartridge_hp_cf413x') }}%"
            icon: mdi:water
            icon_color: >
              {% set v = states('sensor.hp_color_laserjet_mfp_m477fdw_magenta_cartridge_hp_cf413x') | int(100) %}
              {% if v < 25 %}red{% elif v < 40 %}amber{% else %}pink{% endif %}
            entity: sensor.hp_color_laserjet_mfp_m477fdw_magenta_cartridge_hp_cf413x
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: Yellow
            secondary: "{{ states('sensor.hp_color_laserjet_mfp_m477fdw_yellow_cartridge_hp_cf412x') }}%"
            icon: mdi:water
            icon_color: >
              {% set v = states('sensor.hp_color_laserjet_mfp_m477fdw_yellow_cartridge_hp_cf412x') | int(100) %}
              {% if v < 25 %}red{% elif v < 40 %}amber{% else %}yellow{% endif %}
            entity: sensor.hp_color_laserjet_mfp_m477fdw_yellow_cartridge_hp_cf412x
            tap_action:
              action: more-info

          - type: custom:mushroom-template-card
            primary: Black
            secondary: "{{ states('sensor.hp_color_laserjet_mfp_m477fdw_black_cartridge_hp_cf410a') }}%"
            icon: mdi:water
            icon_color: >
              {% set v = states('sensor.hp_color_laserjet_mfp_m477fdw_black_cartridge_hp_cf410a') | int(100) %}
              {% if v < 25 %}red{% elif v < 40 %}amber{% else %}grey{% endif %}
            entity: sensor.hp_color_laserjet_mfp_m477fdw_black_cartridge_hp_cf410a
            tap_action:
              action: more-info


      # ═══════════════════════════════════════════════════════════
      # 7. GitHub — PitziLabs fleet
      # ═══════════════════════════════════════════════════════════
      # Entity IDs follow HA core `github` integration naming:
      # sensor.<owner>_<repo>_{latest_commit,open_issues,open_pull_requests}.
      # Repo hyphens become underscores in the entity_id slug.
      - type: markdown
        content: "### 🐙 GitHub — PitziLabs"

      - type: entities
        title: Fleet activity
        show_header_toggle: false
        entities:
          - type: section
            label: firewalla-axiom-pipeline
          - entity: sensor.pitzilabs_firewalla_axiom_pipeline_latest_commit
            name: Latest Commit
          - entity: sensor.pitzilabs_firewalla_axiom_pipeline_open_issues
            name: Open Issues
          - entity: sensor.pitzilabs_firewalla_axiom_pipeline_open_pull_requests
            name: Open PRs

          - type: section
            label: foundry-platform-demo
          - entity: sensor.pitzilabs_foundry_platform_demo_latest_commit
            name: Latest Commit
          - entity: sensor.pitzilabs_foundry_platform_demo_open_issues
            name: Open Issues
          - entity: sensor.pitzilabs_foundry_platform_demo_open_pull_requests
            name: Open PRs

          - type: section
            label: homeassistant-config
          - entity: sensor.pitzilabs_homeassistant_config_latest_commit
            name: Latest Commit
          - entity: sensor.pitzilabs_homeassistant_config_open_issues
            name: Open Issues
          - entity: sensor.pitzilabs_homeassistant_config_open_pull_requests
            name: Open PRs

          - type: section
            label: homelab-observability
          - entity: sensor.pitzilabs_homelab_observability_latest_commit
            name: Latest Commit
          - entity: sensor.pitzilabs_homelab_observability_open_issues
            name: Open Issues
          - entity: sensor.pitzilabs_homelab_observability_open_pull_requests
            name: Open PRs

          - type: section
            label: ice-cream-book
          - entity: sensor.pitzilabs_ice_cream_book_latest_commit
            name: Latest Commit
          - entity: sensor.pitzilabs_ice_cream_book_open_issues
            name: Open Issues
          - entity: sensor.pitzilabs_ice_cream_book_open_pull_requests
            name: Open PRs

          - type: section
            label: reference-checker
          - entity: sensor.pitzilabs_reference_checker_latest_commit
            name: Latest Commit
          - entity: sensor.pitzilabs_reference_checker_open_issues
            name: Open Issues
          - entity: sensor.pitzilabs_reference_checker_open_pull_requests
            name: Open PRs

          - type: section
            label: shared-workflows
          - entity: sensor.pitzilabs_shared_workflows_latest_commit
            name: Latest Commit
          - entity: sensor.pitzilabs_shared_workflows_open_issues
            name: Open Issues
          - entity: sensor.pitzilabs_shared_workflows_open_pull_requests
            name: Open PRs

          - type: section
            label: workstation-bootstrap
          - entity: sensor.pitzilabs_workstation_bootstrap_latest_commit
            name: Latest Commit
          - entity: sensor.pitzilabs_workstation_bootstrap_open_issues
            name: Open Issues
          - entity: sensor.pitzilabs_workstation_bootstrap_open_pull_requests
            name: Open PRs

      - type: markdown
        content: >
          _Sensors populate once the HA core `github` integration is configured
          with the eight PitziLabs/* repos. Until then they read as Unavailable._


      # ═══════════════════════════════════════════════════════════
      # 8. Meeting Indicator (Rachel's Office)
      # ═══════════════════════════════════════════════════════════
      - type: markdown
        content: "### 🔴 Meeting Indicator (Rachel's Office)"

      - type: custom:mushroom-entity-card
        entity: switch.meeting_button_in_meeting
        name: In Meeting
        icon: mdi:video-account
        tap_action:
          action: toggle

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: binary_sensor.meeting_button_meeting_button
            name: Button State
            icon: mdi:gesture-tap-button
          - type: custom:mushroom-template-card
            primary: WiFi Signal
            secondary: >
              {% set v = states('sensor.meeting_button_wifi_signal') | int(-100) %}
              {{ v }} dBm{% if v > -65 %} — Good{% elif v > -75 %} — Weak{% else %} — Poor{% endif %}
            icon: mdi:wifi
            icon_color: >
              {% set v = states('sensor.meeting_button_wifi_signal') | int(-100) %}
              {% if v > -65 %}green{% elif v > -75 %}amber{% else %}red{% endif %}
            entity: sensor.meeting_button_wifi_signal
            tap_action:
              action: more-info

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: Uptime
            secondary: >
              {% set s = states('sensor.meeting_button_uptime') | int(-1) %}
              {% if s < 0 %}—{% elif s >= 86400 %}{{ (s // 86400) }}d {{ ((s % 86400) // 3600) }}h {{ ((s % 3600) // 60) }}m{% elif s >= 3600 %}{{ (s // 3600) }}h {{ ((s % 3600) // 60) }}m{% else %}{{ (s // 60) }}m{% endif %}
            icon: mdi:clock-outline
            entity: sensor.meeting_button_uptime
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.meeting_button_ip_address
            name: IP Address
            icon: mdi:ip-network
