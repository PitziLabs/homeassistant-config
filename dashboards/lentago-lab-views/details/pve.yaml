title: pve
path: pve-detail
subview: true
icon: mdi:server
type: panel
cards:
  - type: vertical-stack
    cards:
      - type: custom:mushroom-template-card
        primary: pve
        secondary: >
          {% if is_state('binary_sensor.pve_status', 'on') %}
            Main entry point for the cluster · `vmdata` zpool (single-disk ZFS, unused) ·
            no guests pinned · root SSH lands here, jumps to pve2/3/4/5 from here
          {% else %}DOWN{% endif %}
        icon: mdi:server
        icon_color: >
          {% if is_state('binary_sensor.pve_status', 'on') %}green{% else %}red{% endif %}
        entity: binary_sensor.pve_status
        tap_action: { action: none }

      - type: grid
        columns: 3
        square: false
        cards:
          - type: gauge
            entity: sensor.pve_cpu_usage
            name: CPU
            min: 0
            max: 100
            needle: true
            severity: { green: 0, yellow: 50, red: 80 }
          - type: gauge
            entity: sensor.pve_memory_usage_percentage
            name: Memory
            min: 0
            max: 100
            needle: true
            severity: { green: 0, yellow: 70, red: 85 }
          - type: gauge
            entity: sensor.pve_disk_usage
            name: Disk
            min: 0
            max: 100
            needle: true
            severity: { green: 0, yellow: 60, red: 80 }

      - type: grid
        columns: 2
        square: false
        cards:
          - type: entities
            title: Backup (guests-weekly job)
            show_header_toggle: false
            entities:
              - entity: binary_sensor.pve_backup_status
                name: Last backup status
              - entity: sensor.pve_last_backup
                name: Last backup
              - entity: sensor.pve_backup_duration
                name: Duration
          - type: custom:mushroom-template-card
            primary: Uptime
            secondary: >
              {% set s = states('sensor.pve_uptime') | int(-1) %}
              {% if s < 0 %}—
              {% elif s >= 86400 %}{{ (s // 86400) }}d {{ ((s % 86400) // 3600) }}h
              {% elif s >= 3600 %}{{ (s // 3600) }}h {{ ((s % 3600) // 60) }}m
              {% else %}{{ (s // 60) }}m{% endif %}
            icon: mdi:clock-outline
            entity: sensor.pve_uptime
            tap_action: { action: more-info }

      # Node controls removed — the Proxmox button.* entities are unavailable (see #376)
      - type: markdown
        content: >
          **Node controls (restart / shut down / start-all / stop-all
          guests):** absent from this view because the Proxmox VE
          `button.pve_*` control entities are `unavailable` from HA (see
          #376). The live stat sensors on this node still report; only the
          control buttons are dead — the integration registers them but
          isn't actuating them until it is re-paired (and its API token
          carries node power-management privileges). Manage the node from
          Proxmox directly in the meantime.
