# ============================================================================
# Claude Code — Automated PR Review
# ============================================================================
# Thin wrapper around PitziLabs/shared-workflows/claude-review.yml.
# Pinned to Haiku. Accepts bot-authored PRs (allowed_bots: "*").
# ============================================================================

name: Claude Code Review

# >>> DISABLED 2026-06-25: automated Claude PR review turned off fleet-wide.
# Trigger changed from `pull_request` to manual `workflow_dispatch` only, so it
# never auto-runs on PRs. The repo-specific review_prompt below is preserved.
# To re-enable, restore the `on: pull_request` trigger (see git history).
on:
  workflow_dispatch:

jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: PitziLabs/shared-workflows/.github/workflows/claude-review.yml@main
    secrets: inherit
    with:
      allowed_bots: "*"
      review_prompt: |
        This repository is a Home Assistant configuration: YAML automations,
        scripts, scenes, and Lovelace dashboards, plus bash gitops and
        home-dashboard deploy scripts (`scripts/gitops-sync.sh`, `home-host/`)
        that pull to production via systemd timers. Focus your review on:

        1. **HA YAML validity** — automations, scripts, scenes, and templates:
           trigger / condition / action shape, Jinja2 template errors, and the
           right automation mode (e.g. not `single` for motion lights).
        2. **entity_id discipline** — prefer entity_id over device_id; flag
           entity renames that would break consumers (dashboards, automations).
        3. **Bash correctness & safety** of the gitops/home-host scripts —
           quoting, unset vars, and the flock / main-branch-guard /
           log-rotation / reinstall-only-on-drift invariants.
        4. **Secrets** — nothing sensitive committed; `!secret` references
           intact, no tokens in YAML or logs.
        5. **PR summary voice** — the PR body carries a neutral, objective
           summary of the who/what/why (no `## Origin` section, no
           `Prompt-Origin` trailer) per this repo's CLAUDE.md.
