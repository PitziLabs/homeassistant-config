name: HA Version Sync

on:
  repository_dispatch:
    types: [ha-version-report]

permissions:
  contents: read

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version payload
        env:
          RAW_VERSION: ${{ github.event.client_payload.version }}
        run: |
          if ! printf '%s' "$RAW_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+)?$'; then
            echo "::error::Version '${RAW_VERSION}' failed format check." \
              "Expected: YYYY.MM.N or YYYY.MM.NbN. Dev builds not supported — update regex to widen."
            exit 1
          fi
          echo "VERSION=$RAW_VERSION" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.HA_SYNC_PAT }}

      - name: Compare versions
        id: compare
        run: |
          CURRENT=$(cat .ha-version)
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "Versions match ($VERSION) — nothing to do."
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "Drift detected: .ha-version=$CURRENT, HAOS reports=$VERSION"
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing bump branch or PR
        if: steps.compare.outputs.match == 'false'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.HA_SYNC_PAT }}
        run: |
          BRANCH="ha-version-bump/$VERSION"
          PR_COUNT=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$PR_COUNT" -gt "0" ]; then
            echo "Open PR exists for $BRANCH — idempotent exit."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "::warning::Branch $BRANCH exists on remote with no open PR (orphan). Deleting and recreating."
            git push origin --delete "$BRANCH"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create version bump branch and PR
        if: steps.compare.outputs.match == 'false' && steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.HA_SYNC_PAT }}
          CURRENT_VERSION: ${{ steps.compare.outputs.current }}
        run: |
          git config user.name "ha-version-sync[bot]"
          git config user.email "ha-version-sync@users.noreply.github.com"
          BRANCH="ha-version-bump/$VERSION"
          git checkout -b "$BRANCH"
          printf '%s\n' "$VERSION" > .ha-version
          git add .ha-version
          git commit -m "Bump .ha-version to $VERSION (auto-dispatched from HAOS startup)"
          git push origin "$BRANCH"
          BODY="Auto-dispatched from the HAOS \`homeassistant_started\` event.

          | | Version |
          |---|---|
          | Previous | \`${CURRENT_VERSION}\` |
          | New | \`${VERSION}\` |

          Card 1 [\`ha-config-check\`](../../actions/workflows/ha-config-check.yml) is the merge gate. Auto-merges via branch protection Ruleset once all checks pass.

          > **Note:** Opened with \`HA_SYNC_PAT\` (not \`GITHUB_TOKEN\`) so downstream workflows fire. See README → Validation Pipeline for the \`GITHUB_TOKEN\` limitation.

          @claude"
          PR_URL=$(gh pr create \
            --title "Bump .ha-version to ${VERSION}" \
            --body "$BODY" \
            --head "$BRANCH" \
            --base main)
          gh pr merge --auto --squash "$PR_URL"
