name: HA Config Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read HA version
        id: version
        run: echo "version=$(cat .ha-version)" >> "$GITHUB_OUTPUT"

      - name: Prepare secrets
        run: cp secrets.fake.yaml secrets.yaml

      - name: Validate HA config
        uses: frenck/action-home-assistant@v1
        with:
          path: "./"
          version: ${{ steps.version.outputs.version }}
