name: HA Config Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Read HA version
        id: version
        run: echo "version=$(cat .ha-version)" >> "$GITHUB_OUTPUT"

      - name: Prepare secrets
        run: cp secrets.fake.yaml secrets.yaml

      - name: Validate HA config
        uses: frenck/action-home-assistant@d1b1b8b5afc0e86564e3e52bde40cbc94e597ce4  # v1.4.0
        with:
          path: "./"
          version: ${{ steps.version.outputs.version }}
