name: HA Config Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read HA version
        id: version
        run: echo "version=$(cat .ha-version)" >> "$GITHUB_OUTPUT"

      - name: Prepare secrets
        run: cp secrets.fake.yaml secrets.yaml

      - name: Validate HA config
        uses: frenck/action-home-assistant@941d5d917f4c1c7a7e7d4087526daf90d53f4437 # v1
        with:
          path: "./"
          version: ${{ steps.version.outputs.version }}
